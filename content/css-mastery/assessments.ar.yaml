checkpoints:
  s-css-1:
    - q: |
        ما لون الرابط؟
        ```css
        @layer base, components;
        @layer components {
          .btn { color: white; }
        }
        a { color: blue; }
        ```
        ```html
        <a class="btn" href="#">Buy tickets</a>
        ```
      options:
        - text: "white، لأن `components` هي آخر layer مُعلنة."
          why: "كونها آخر layer مسمّاة لا يجعلها تتغلّب إلا على الـ layers المسمّاة الأخرى؛ أما القاعدة الواقعة خارج الـ layers فتتفوّق عليها كلها."
        - text: "blue، لأن الأنماط العادية خارج الـ layers تتغلّب على كل layer."
          why: "صحيح. الأنماط خارج الـ layers تجلس في layer ضمنية فوق كل الـ layers المسمّاة، فيفوز selector النوع رغم أن الـ specificity الخاصة به أقل."
        - text: "white، لأن الـ class أدقّ تحديدًا من selector النوع."
          why: "الـ specificity لا تُقارَن إلا داخل الـ layer نفسها. وأولوية الـ layers تُحسم أولًا."
        - text: "لون الروابط الافتراضي في المتصفّح، لأن القاعدتين تلغي إحداهما الأخرى."
          why: "القواعد لا تلغي بعضها أبدًا؛ الـ cascade يختار دائمًا فائزًا واحدًا."
      answer: 1
    - q: |
        القاعدتان تستهدفان `<h3 class="title">` داخل `.card`. أيّ لون يفوز؟
        ```css
        :where(.card) .title { color: green; }
        .title { color: red; }
        ```
      options:
        - text: "red، لأن درجة الـ selectorين (0,1,0) والأحمر يأتي لاحقًا."
          why: "صحيح. `:where()` لا تضيف شيئًا، فتتعادل الـ specificity ويحسم ترتيب الظهور."
        - text: "green، لأنه أدقّ تحديدًا."
          why: "`:where(.card)` تضيف specificity صفرًا، فدرجة selector الأخضر (0,1,0) نفسها درجة الأحمر."
        - text: "green، لأن selectors العناصر الداخلية تتغلّب على الـ selectors المفردة."
          why: "الروابط بين الـ selectors لا تضيف specificity؛ ولا يُحسب إلا الـ selectors البسيطة."
        - text: "لا هذا ولا ذاك؛ `:where()` تجعل القاعدة الأولى غير صالحة."
          why: "`:where()` صالحة في كل مكان وتظل تطابق؛ لكنها لا تزن شيئًا."
      answer: 0
    - q: "يُفترض أن يكبر توهّج بطاقة عند المرور بـ `transition: --glow 300ms`، مع `box-shadow: 0 0 var(--glow) violet`. لكن التوهّج يقفز بدل أن يتحرّك. ما الإصلاح؟"
      options:
        - text: "أضف `transition-behavior: allow-discrete` ليُسمح للـ custom property بالدخول في transition."
          why: "`allow-discrete` تتيح لقيمة لا يمكن الانتقال بين قيمها تدريجيًا أن تشارك في الـ transition، لكنها تظل تنقلب دفعة واحدة عند منتصف المدة. المتصفّح يحتاج إلى أن يعرف أن `--glow` طول ليمزج بين قيمها."
        - text: "انقل `--glow` إلى `:root` لتُورَث."
          why: "مكان تعريف الخاصية لا يغيّر قابليتها للانتقال التدريجي."
        - text: "سجّل `--glow` بـ `@property` مع `syntax: \"<length>\"` وقيمة ابتدائية."
          why: "صحيح. حين يعرف المتصفّح أن `--glow` طول، يستطيع الانتقال بين قيمها تدريجيًا، فيتحرّك الظلّ بسلاسة."
        - text: "أضف `will-change: --glow`."
          why: "`will-change` تلميح للأداء؛ ولا تجعل القيمة التي بلا نوع قابلة للتحريك."
      answer: 2
    - q: "الـ HTML هو `<label class=\"field\">Email <input type=\"email\"></label>`. أيّ selector ينسّق التسمية (label) حين يكون الـ focus على حقلها؟"
      options:
        - text: "`.field:focus`"
          why: "التسمية نفسها لا تستقبل الـ focus أبدًا؛ الحقل الذي بداخلها هو الذي يستقبله."
        - text: "`input:focus + .field`"
          why: "الرابط `+` يبحث عن شقيق لاحق، لكن التسمية هي أب الحقل."
        - text: "`.field > input:focus`"
          why: "هذا يحدّد الحقل، لا التسمية."
        - text: "`.field:has(input:focus)`"
          why: "صحيح. تطابق التسمية حين تحتوي على حقل عليه الـ focus. و`.field:focus-within` ستنجح هنا أيضًا."
      answer: 3
    - q: |
        داخل قاعدة `.session-card` متداخلة، أيّ selector يستهدف البطاقة نفسها حين تحمل أيضًا الـ class `is-live`؟
        ```css
        .session-card {
          /* ??? */ { border-color: red; }
        }
        ```
      options:
        - text: "`& .is-live`"
          why: "المسافة تجعله selector لعنصر داخلي: عنصر `.is-live` داخل البطاقة."
        - text: "`.is-live`"
          why: "الـ selector المتداخل بلا `&` يُعامَل كعنصر داخلي، فهذا أيضًا يعني عنصرًا داخل البطاقة."
        - text: "`&:is-live`"
          why: "`:is-live` ليست pseudo-class، فالـ selector غير صالح."
        - text: "`&.is-live`"
          why: "صحيح. دون مسافة تشكّل `&` و`.is-live` selector مركّبًا واحدًا: `.session-card.is-live`."
      answer: 3
  s-css-2:
    - q: "صفحة بـ `display: flex` فيها شريط جانبي بعرض 16rem و`main` له `flex: 1`. جدول بيانات عريض داخل `main` يدفع الصفحة إلى التمرير الأفقي. ما الإصلاح الموجَّه؟"
      options:
        - text: "أضف `min-width: 0` إلى `main` ودع الجدول يتمرّر داخل غلاف خاص به له `overflow-x: auto`."
          why: "صحيح. الحدّ الأدنى التلقائي لعرض `main` هو عرض محتواه؛ وإزالته تتيح لـ `main` أن يتقلّص، وتحصر الفيضان حيث ينتمي."
        - text: "أضف `flex-shrink: 1` إلى `main`."
          why: "`flex-shrink: 1` هي القيمة الافتراضية أصلًا؛ والتقلّص يتوقّف عند الحدّ الأدنى التلقائي على أيّ حال."
        - text: "اضبط `overflow: hidden` على `body`."
          why: "هذا يخفي محتوى يحتاجه المستخدمون ويجعل قراءة الجدول مستحيلة على الشاشات الصغيرة."
        - text: "غيّر `flex: 1` إلى `flex: auto` على `main`."
          why: "`auto` تجعل `main` يبدأ من عرض محتواه، فيزيد الفيضان سوءًا لا تحسّنًا."
      answer: 0
    - q: "شبكة تستخدم `grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))` بلا فجوة في حاوية عرضها 500px. كم عمودًا فيها، وما عرض كلٍّ منها؟"
      options:
        - text: "عمودان بعرض 200px و100px من المساحة الفارغة."
          why: "الحدّ الأقصى `1fr` يتيح للـ tracks أن تكبر لتتقاسم المساحة المتبقية."
        - text: "عمودان بعرض 250px."
          why: "صحيح. يتّسع اثنان من الـ tracks بعرض 200px ولا يتّسع الثالث، ثم يقسم الحدّ الأقصى `1fr` الـ 100px المتبقية بين الاثنين."
        - text: "ثلاثة أعمدة بعرض يقارب 167px."
          why: "لكل track حدّ أدنى 200px، فلا تتّسع ثلاثة في 500px."
        - text: "عمود واحد بعرض 500px."
          why: "`auto-fill` تنشئ أكبر عدد من الـ tracks يتّسع بحجمها الأدنى، وهو اثنان هنا."
      answer: 1
    - q: "نموذج تسجيل المتحدّثين فيه ثلاثة fieldsets، في كلٍّ منها أزواج من التسميات والحقول. يجب أن تشكّل التسميات عمودًا واحدًا متساوي العرض عبر كل الـ fieldsets. والنموذج شبكة من عمودين. ماذا تضيف إلى كل fieldset؟"
      options:
        - text: "`display: grid; grid-template-columns: max-content 1fr;`"
          why: "كل fieldset يحدّد عرض عمود تسمياته بنفسه، فلا توسّع تسمية طويلة في أحدها الأخرى."
        - text: "`display: contents;`"
          why: "قد يحاذي هذا الحقول، لكنه يزيل صندوق الـ fieldset (وحدّه وتخطيط الـ legend فيه)، فينكسر التجميع."
        - text: "`display: grid; grid-column: span 2; grid-template-columns: subgrid;`"
          why: "صحيح. كل fieldset يمتدّ على عمودي النموذج ويتبنّاهما، فتتشارك كل التسميات track عمود واحدًا."
        - text: "`width: 100%;`"
          why: "العرض لا يربط الأعمدة الداخلية للـ fieldsets ببعضها."
      answer: 2
    - q: "بطاقة جلسة في شريط جانبي عرضه 300px. يتبدّل تخطيطها بـ `@container (width > 400px)`، والشريط الجانبي هو حاوية الحجم. عرض نافذة المتصفّح 1400px. أيّ تخطيط تحصل عليه البطاقة؟"
      options:
        - text: "التخطيط الضيّق، لأن الاستعلام يقيس الشريط الجانبي ذا الـ 300px."
          why: "صحيح. الـ container queries تتجاهل الـ viewport؛ وما يُقاس هو أقرب حاوية حجم."
        - text: "التخطيط العريض، لأن النافذة أعرض من 400px."
          why: "هذا سلوك الـ media query. أما الـ container query فتقيس الحاوية."
        - text: "لا هذا ولا ذاك؛ الـ container queries تحتاج إلى اسم حاوية لتطابق."
          why: "الاستعلامات بلا اسم تستخدم أقرب حاوية حجم بين الأسلاف."
        - text: "يعتمد على عرض البطاقة نفسها."
          why: "لا يستطيع العنصر أن يستعلم عن نفسه؛ والقياس هو عرض حاوية الشريط الجانبي."
      answer: 0
    - q: "ما العرض الذي تُنتجه `width: clamp(280px, 50%, 600px)` داخل عنصر أب عرضه 400px؟"
      options:
        - text: "280px"
          why: "صحيح. 50% من 400px تساوي 200px، وهي تحت الحدّ الأدنى 280px، فيفوز الحدّ الأدنى."
        - text: "200px"
          why: "200px هي القيمة المفضّلة، لكن clamp() لا تنزل أبدًا تحت حدّها الأدنى."
        - text: "400px"
          why: "عرض العنصر الأب ليس إحدى القيم الثلاث؛ تُرجع clamp() الحدّ الأدنى أو المفضّلة أو الحدّ الأقصى."
        - text: "600px"
          why: "الحدّ الأقصى لا ينطبق إلا حين تتجاوزه القيمة المفضّلة."
      answer: 0
  s-css-3:
    - q: "يسأل مصمّم لماذا يستخدم عنوان الواجهة الرئيسية `clamp(2rem, 1.2rem + 3vw, 3.5rem)` لا `clamp(32px, 3vw + 19px, 56px)`. ما أفضل جواب؟"
      options:
        - text: "نسخة الـ rem تتدرّج مع حجم الخط الافتراضي لدى المستخدم ومع التكبير؛ أما نسخة الـ px فتقفل المدى على إعدادات المصمّم."
          why: "صحيح. حدود rem ونقطة تقاطع بـ rem تُبقي تفضيلات المستخدم داخل الحساب، وعلى هذا يعتمد معيار Resize Text."
        - text: "نسخة الـ px لا تعمل في Safari."
          why: "كلتاهما صالحة في كل المتصفّحات الحالية؛ الفرق في إمكانية الوصول لا في الدعم."
        - text: "الـ rem تُرسم أسرع من الـ px."
          why: "لا فرق في سرعة الرسم بين الوحدتين."
        - text: "لا يمكنك جمع px وvw داخل clamp()."
          why: "الوحدات المختلطة مسموحة في الدوال الرياضية؛ و`3vw + 19px` صالحة."
      answer: 0
    - q: "زر إغلاق موضوع بـ `inset-inline-end: 8px`. والصفحة `dir=\"rtl\"`. إلى أيّ خاصية فيزيائية تُترجَم؟"
      options:
        - text: "`left: 8px`"
          why: "صحيح. في النص المكتوب من اليمين إلى اليسار، نهاية السطر على اليسار."
        - text: "`right: 8px`"
          why: "هذا هو المقابل في النص من اليسار إلى اليمين، حيث تنتهي الأسطر على اليمين."
        - text: "`top: 8px`"
          why: "`top` موضع على محور الـ block؛ والخصائص الـ inline تقابل اليسار واليمين في الكتابة الأفقية."
        - text: "لا أثر لها في RTL."
          why: "الخصائص المنطقية وُجدت تحديدًا لتعمل في الاتجاهين."
      answer: 0
    - q: "أيّ تصريح يعطي الزر المعطّل لونًا رماديًا بالإضاءة المُدرَكة نفسها التي للون العلامة التجارية؟"
      options:
        - text: "`background: hsl(from var(--brand) h 0% l);`"
          why: "إضاءة HSL ليست إدراكية، فلن تطابق الإضاءة الظاهرة للرمادي إضاءة لون العلامة التجارية."
        - text: "`background: oklch(from var(--brand) l 0 h);`"
          why: "صحيح. ضبط التشبّع على 0 يزيل اللونية مع الإبقاء على L، فيبدو الرمادي بالإضاءة نفسها."
        - text: "`background: color-mix(in srgb, var(--brand), grey);`"
          why: "المزج مع الرمادي يُبقي نصف اللون ويزيح الإضاءة نحو إضاءة الرمادي، لا إضاءة العلامة التجارية."
        - text: "`filter: grayscale(1);`"
          why: "الـ filter يحوّل النص وأيّ أيقونات إلى الرمادي أيضًا، ويعمل في فضاء غير إدراكي."
      answer: 1
    - q: "الصفحة في الوضع الداكن، لكن لوحة «معاينة الطباعة» داخلها يجب أن تُرسم بالقيم الفاتحة لكل tokens `light-dark()`. ماذا تضبط على اللوحة؟"
      options:
        - text: "`@media (prefers-color-scheme: light)` حول قواعد اللوحة."
          why: "هذه الـ media query تفحص إعداد نظام تشغيل المستخدم، وهو ما زال داكنًا."
        - text: "`data-theme=\"light\"` على اللوحة."
          why: "قواعد مفتاح التبديل في هذه الدورة تقرأ `data-theme` على الجذر، لذا لا تفعل السمة على اللوحة شيئًا ما لم تستهدفها CSS."
        - text: "`color-scheme: light;`"
          why: "صحيح. تُحسم `light-dark()` بحسب النظام اللوني المستخدم في كل عنصر، ويرثه العناصر داخل اللوحة."
        - text: "`filter: invert(1);`"
          why: "القلب يعكس الصور وألوان العلامة التجارية أيضًا، ولا يلمس قيم الـ tokens."
      answer: 2
    - q: "تضيف Waypoint شريط «إعدادات ملفات تعريف الارتباط» ثابتًا ارتفاعه 56px أسفل الـ viewport. يبلّغ مستخدمو لوحة المفاتيح أن الرابط الذي عليه الـ focus يختبئ أحيانًا خلفه. أيّ إصلاح يعالج معيار Focus Not Obscured في WCAG؟"
      options:
        - text: "`:focus-visible { outline-offset: 56px; }`"
          why: "إزاحة الحلقة لا تُخرج العنصر من تحت الشريط."
        - text: "`.cookie-bar { opacity: 0.9; }`"
          why: "الشفافية الطفيفة تظل تحجب العنصر؛ المعيار يتعلّق باختفائه، لا بمظهر الشريط."
        - text: "`body { padding-top: 56px; }`"
          why: "الشريط في الأسفل؛ والحشوة العلوية لا تغيّر المكان الذي تستقرّ فيه العناصر التي عليها الـ focus."
        - text: "`html { scroll-padding-bottom: 56px; }`"
          why: "صحيح. الـ scroll padding تحدّد أن الـ 56px السفلية مغطّاة، فيُبقي التمرير الناتج عن الـ focus العنصرَ فوق الشريط."
      answer: 3
  s-css-4:
    - q: "أيّ زوج من الخصائص يستطيع المتصفّح تحريكه دون إعادة تشغيل التخطيط أو الرسم في كل إطار؟"
      options:
        - text: "`translate` و`opacity`"
          why: "صحيح. إنهما تغيّران طريقة تركيب طبقة مرسومة أصلًا، فيستطيع المتصفّح تخطّي التخطيط والرسم."
        - text: "`width` و`height`"
          why: "كلتاهما تغيّران الأبعاد، فيعمل التخطيط في كل إطار."
        - text: "`top` و`left`"
          why: "المواضع أبعاد أيضًا؛ وتغييرها يستدعي التخطيط."
        - text: "`background-color` و`box-shadow`"
          why: "هاتان تتخطّيان التخطيط لكنهما تعيدان الرسم في كل إطار."
      answer: 0
    - q: "أثناء view transition في الجدول، يتلاشى رأس الصفحة الثابت تقاطعيًا مع الصفحة، فيبدو كأنه يومض. كيف تُبقيه ثابتًا؟"
      options:
        - text: "اضبط `position: fixed` على الرأس."
          why: "العناصر الثابتة تُلتقط أيضًا في صورة الـ root، فتتلاشى تقاطعيًا هي الأخرى."
        - text: "اضبط `z-index: 1000` على الرأس."
          why: "ترتيب التراكب في الصفحة الحيّة لا يهمّ أثناء الانتقال؛ الرأس يظل جزءًا من صورة الـ root التي تتلاشى تقاطعيًا."
        - text: "أعطِ الرأس `view-transition-name: header` واضبط `animation: none` على `::view-transition-group(header)`."
          why: "صحيح. تسمية الرأس تعطيه مجموعة خاصة به، منفصلة عن التلاشي التقاطعي للـ root، وإزالة حركة تلك المجموعة تُبقيه ثابتًا."
        - text: "أضف `will-change: transform` إلى الرأس."
          why: "هذا تلميح للرسم ولا أثر له في طريقة التقاط الانتقال للرأس."
      answer: 2
    - q: "شريط تقدّم القراءة يستخدم `animation: grow ease both; animation-timeline: scroll(root);`. في منتصف الصفحة يكون الشريط ممتلئًا بنسبة 80% بالفعل. لماذا؟"
      options:
        - text: "`scroll(root)` تقيس الـ viewport لا المستند."
          why: "`scroll(root)` تتتبّع تقدّم حاوية تمرير المستند؛ والتشوّه يأتي من منحنى التسارع."
        - text: "نمط التعبئة `both` يجعل الشريط يقفز إلى الأمام."
          why: "`both` لا تفعل إلا تطبيق أول keyframe وآخرها خارج النطاق النشط."
        - text: "خطوط زمن التمرير تعمل دائمًا بسرعة مضاعفة في المنتصف."
          why: "التقدّم متناسب مع موضع التمرير؛ ومنحنى التسارع وحده هو الذي يغيّر طريقة ربطه بالـ keyframes."
        - text: "منحنى التوقيت `ease` يربط تقدّم التمرير بشكل غير خطي؛ استخدم `linear` ليتتبّع الشريط مسافة التمرير بدقّة."
          why: "صحيح. دوال التوقيت تظل تنطبق على خطوط زمن التمرير، فيشوّه المنحنى الربط."
      answer: 3
    - q: "أضاف مطوّر جديد `.session-card { margin-block-start: 24px; }` كي لا تتلامس البطاقات في الشريط الجانبي. ما الذي يجب أن تقترحه المراجعة بدلًا من ذلك؟"
      options:
        - text: "استخدم `margin-top` بدلًا منها، من أجل المتصفّحات الأقدم."
          why: "الخصائص المنطقية مدعومة في كل مكان؛ المشكلة في أن الـ component يضع مسافاته بنفسه."
        - text: "أضف `!important` لتصمد الـ margin في التخطيطات الأخرى."
          why: "هذا يجعل تعديل الـ margin لكل سياق مستحيلًا، وهو عكس المطلوب."
        - text: "انقل الـ margin إلى layer الـ utilities."
          why: "ستظل البطاقة تحمل مسافاتها في كل مكان؛ والشريط الجانبي هو المكان الذي يحتاج إليها."
        - text: "أعطِ تخطيط الشريط الجانبي `display: grid` (أو flex) مع `gap`، وأبقِ البطاقة خالية من الـ margins الخارجية."
          why: "صحيح. السياق يملك المسافات، فتبقى البطاقة قابلة لإعادة الاستخدام في الشبكة والشريط الجانبي والـ carousel."
      answer: 3
    - q: "أضفت `content-visibility: auto` إلى قسم كل يوم في جدول طويل ولا شيء غير ذلك. ماذا يلاحظ المستخدمون؟"
      options:
        - text: "يقفز شريط التمرير كلما رُسمت الأقسام، لأن الأقسام المتخطّاة لا ارتفاع لها حتى يُحسب تخطيطها."
          why: "صحيح. `contain-intrinsic-size: auto <length>` تعطي الأقسام المتخطّاة ارتفاعًا نائبًا وتعالج القفز."
        - text: "تختفي الأقسام الواقعة خارج الشاشة من نتائج البحث داخل الصفحة."
          why: "المحتوى الذي تتخطّاه `content-visibility: auto` يبقى قابلًا للبحث ولإمكانية الوصول."
        - text: "لا يتغيّر شيء، لأن content-visibility لا تعمل إلا مع JavaScript."
          why: "إنها CSS خالصة وتأخذ مفعولها فورًا."
        - text: "يُرسم كل قسم مرتين، فتبطؤ الصفحة."
          why: "يرسم المتصفّح القسم حين يقترب من الـ viewport؛ ولا يرسمه مرتين."
      answer: 0
final:
  - q: |
      ما لون الفقرة؟
      ```html
      <p style="color: red">Doors open at 08:30</p>
      ```
      ```css
      p { color: blue !important; }
      ```
    options:
      - text: "red، لأن الأنماط المضمّنة تفوز دائمًا."
        why: "الأنماط المضمّنة تتغلّب على قواعد ملف الأنماط العادية، لكن `!important` تُحسم في مرحلة أسبق من الـ cascade."
      - text: "red، لأنها أدقّ تحديدًا."
        why: "الأنماط المضمّنة لا تُقارَن بالـ specificity؛ والأهمية تُحسم قبل كليهما."
      - text: "blue، لأن قواعد ملف الأنماط تُحمَّل بعد الأنماط المضمّنة."
        why: "ترتيب التحميل ليس السبب؛ الأهمية تتفوّق على النمط المضمّن."
      - text: "blue، لأن التصريح المهمّ يتغلّب على النمط المضمّن العادي."
        why: "صحيح. الأهمية جزء من أول معايير الـ cascade، وتُفحص قبل الأنماط المضمّنة."
    answer: 3
  - q: |
      لعنصرٍ السمة `hidden` والـ class `card`. ما قيمة display فيه؟
      ```css
      @layer reset, components;
      @layer reset { [hidden] { display: none !important; } }
      @layer components { .card { display: grid !important; } }
      ```
    options:
      - text: "none، لأن التصريحات المهمّة في الـ layers الأسبق تفوز."
        why: "صحيح. مع `!important` ينعكس ترتيب الـ layers، فتتغلّب `reset` على `components`."
      - text: "grid، لأن `components` هي الـ layer اللاحقة."
        why: "هذا صحيح في التصريحات العادية؛ أما المهمّة فتعكس الترتيب."
      - text: "grid، لأن الـ class يتغلّب على selector السمة."
        why: "كلاهما درجته (0,1,0)، وعلى أيّ حال تُقارَن الـ layers قبل الـ specificity."
      - text: "القيمة الافتراضية للعنصر في المتصفّح."
        why: "القاعدتان تنطبقان؛ والـ cascade يختار إحداهما."
    answer: 0
  - q: "`--accent` غير معرّفة في أيّ مكان. ما الذي تُنتجه `color: var(--accent, teal)`؟"
    options:
      - text: "اللون الموروث، لأن التصريح غير صالح."
        why: "القيمة البديلة موجودة لهذه الحالة بالذات؛ ولا يكون التصريح غير صالح إلا إن لم توجد قيمة بديلة قابلة للاستخدام."
      - text: "black، القيمة الابتدائية لـ color."
        why: "حتى دون قيمة بديلة كانت `color` سترث من العنصر الأب لا أن تعود إلى الأسود؛ وهنا تنطبق القيمة البديلة على أيّ حال."
      - text: "teal"
        why: "صحيح. الـ custom property غير المعرّفة تحمل القيمة غير الصالحة حتمًا، فتستخدم `var()` قيمتها البديلة."
      - text: "سلسلة فارغة، فيصبح النص شفافًا."
        why: "الـ custom properties لا تُنتج الشفافية من تلقاء نفسها؛ والقيمة البديلة هي التي تنطبق."
    answer: 2
  - q: "شبكة من عمودين تستخدم `grid-template-columns: 1fr 1fr`. مثال كود فيه سطر طويل جدًا يجعل العمود الأول أعرض بكثير. أيّ تغيير يُبقي العمودين متساويين ويتيح للكود أن يتمرّر؟"
    options:
      - text: "`grid-template-columns: repeat(2, auto)`"
        why: "الـ tracks بقيمة `auto` تتحدّد بحسب المحتوى، فيزيد السطر الطويل الأمر سوءًا."
      - text: "`grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)` مع `overflow-x: auto` على كتلة الكود."
        why: "صحيح. إزالة الحدّ الأدنى التلقائي تُبقي الـ tracks متساوية؛ وكتلة الكود تعالج فيضانها بنفسها."
      - text: "`white-space: nowrap` على كتلة الكود."
        why: "هذا يمنع السطر من الالتفاف، وهو المشكلة أصلًا."
      - text: "`grid-auto-flow: column`"
        why: "هذا يغيّر اتجاه وضع العناصر، لا أحجام الـ tracks."
    answer: 1
  - q: "component يستخدم `font-size: clamp(1rem, 4cqi, 2rem)`، لكنه في إحدى الصفحات ليس داخل أيّ حاوية حجم. إلامَ تُحسب `4cqi` هناك؟"
    options:
      - text: "4% من الحجم الأفقي للـ viewport الصغير، وهو البديل الاحتياطي لوحدات الحاوية."
        why: "صحيح. في غياب حاوية مؤهّلة ترجع وحدات الحاوية إلى وحدات الـ viewport الصغيرة، فتظل القاعدة تعمل."
      - text: "صفر، فيستقرّ حجم الخط عند الحدّ الأدنى 1rem."
        why: "وحدات الحاوية لا تُحسب صفرًا؛ بل ترجع إلى وحدات الـ viewport."
      - text: "عرض العنصر الأب."
        why: "حاويات الحجم وحدها تُحسب؛ والعنصر الأب العادي لا يُقاس."
      - text: "التصريح غير صالح ويُتجاهل."
        why: "القيمة صالحة؛ لكنها تستخدم بديل الـ viewport فحسب."
    answer: 0
  - q: "أيّ تصريح يوسّط كتلة ثابتة العرض أفقيًا في الصفحات المكتوبة من اليسار إلى اليمين ومن اليمين إلى اليسار معًا؟"
    options:
      - text: "`margin-inline-start: auto;`"
        why: "جهة واحدة فقط تمتصّ المساحة، فتُدفع الكتلة إلى النهاية لا إلى المنتصف."
      - text: "`text-align: center;`"
        why: "هذا يوسّط المحتوى الـ inline داخل الكتلة، لا الكتلة نفسها."
      - text: "`inset-inline: 0;`"
        why: "خصائص الـ inset لا تؤثّر إلا في العناصر ذات التموضع، وهي تضبط المواضع لا margins التوسيط."
      - text: "`margin-inline: auto;`"
        why: "صحيح. الـ margin في جهتي الـ inline كلتيهما تمتصّان المساحة الحرّة بالتساوي، أيًّا كان الاتجاه."
    answer: 3
  - q: "ما الذي تُنتجه `background: color-mix(in oklch, var(--brand), transparent 80%)`؟"
    options:
      - text: "لون العلامة التجارية بعتامة 20%."
        why: "صحيح. يأخذ transparent نسبة 80% من المزيج، فيحتفظ لون العلامة التجارية بـ 20% من قناة alpha الخاصة به."
      - text: "لون العلامة التجارية بعتامة 80%."
        why: "الـ 80% تخصّ `transparent`، اللون الذي تليه، فلا يحصل لون العلامة التجارية إلا على 20%."
      - text: "رمادي، لأن المزج مع transparent يزيل التشبّع."
        why: "ليس لـ transparent درجة لون يجذب نحوها، فتُحفظ إضاءة لون العلامة التجارية وتشبّعه ودرجته."
      - text: "قيمة غير صالحة، لأن transparent لا يمكن مزجه."
        why: "`transparent` لون عادي في `color-mix()`، وهو الطريقة المعتادة لإضافة الشفافية."
    answer: 0
  - q: "الوضع الداكن لديك يبدّل كل token بشكل صحيح، لكن قوائم `<select>` في النماذج وأشرطة التمرير تبقى بيضاء ساطعة. ما الناقص؟"
    options:
      - text: "tokens داكنة لـ `--select-bg` و`--scrollbar-bg`."
        why: "واجهة المتصفّح الأصلية لا تقرأ الـ custom properties الخاصة بك افتراضيًا."
      - text: "media query `prefers-color-scheme` حول الـ tokens."
        why: "هذا يغيّر الـ tokens لديك، وهي تعمل أصلًا؛ أما عناصر التحكّم الأصلية فما زالت تحتاج إلى `color-scheme`."
      - text: "`appearance: none` على كل عنصر تحكّم."
        why: "هذا يرمي التنسيق الأصلي وميزات إمكانية الوصول لإصلاح شيء تعالجه خاصية واحدة."
      - text: "تصريح `color-scheme` يتضمّن `dark`، ليرسم المتصفّح واجهته الخاصة بالوضع الداكن."
        why: "صحيح. عناصر التحكّم المدمجة وأشرطة التمرير تتبع `color-scheme`، لا الـ custom properties الخاصة بك."
    answer: 3
  - q: "مستخدم الفأرة ينقر زرًّا فلا يرى حلقة focus؛ ومستخدم لوحة المفاتيح يصل إليه بـ Tab فيرى حلقة. الـ CSS تستخدم `:focus-visible`. هل هذا خطأ؟"
    options:
      - text: "نعم. يجب أن تظهر الحلقة لكل مستخدم مع كل focus."
        why: "تشترط WCAG مؤشّرًا ظاهرًا للتشغيل بلوحة المفاتيح، وهذا ما توفّره `:focus-visible`."
      - text: "لا. `:focus-visible` تستخدم قواعد المتصفّح التقديرية لتُظهر المؤشّر مع focus لوحة المفاتيح لا بعد نقرة فأرة على زر."
        why: "صحيح. هذا هو السلوك المقصود، وهو يستوفي معيار Focus Visible لمستخدمي لوحة المفاتيح."
      - text: "نعم. الـ focus البرمجي مطلوب لمستخدمي الفأرة."
        why: "مستخدمو الفأرة يرون أصلًا أين نقروا؛ ولا حاجة إلى focus برمجي."
      - text: "لا، لكن فقط لأن الزر بلا outline في ملف إعادة الضبط."
        why: "ملف إعادة الضبط لا علاقة له بالأمر؛ قواعد `:focus-visible` التقديرية هي ما يفسّر السلوك."
    answer: 1
  - q: "نافذة حوار تُعرض بـ `showModal()` يجب أن تظهر تدريجيًا من opacity صفر. الـ transition على `opacity` لا يعمل أبدًا عند الفتح. ما الإصلاح؟"
    options:
      - text: "زِد مدة الـ transition."
        why: "الـ transition لا يبدأ أصلًا، فمدّته لا تهمّ."
      - text: "أضف `@starting-style { dialog[open] { opacity: 0; } }` ليكون لأول نمط قيمة بداية."
        why: "صحيح. دون حالة سابقة لا يوجد ما ينطلق منه الـ transition حين تُرسم نافذة الحوار أول مرة."
      - text: "استخدم `animation-delay` بدل الـ transition."
        why: "التأخير لا يعطي المتصفّح نمط بداية هو الآخر."
      - text: "اضبط `will-change: opacity` على نافذة الحوار."
        why: "`will-change` تلميح للأداء ولا تُنشئ قيمة بداية."
    answer: 1
  - q: "بطاقات المتحدّثين تظهر تدريجيًا بحركة مرتبطة بالتمرير داخل `@supports (animation-timeline: view())`. ماذا يرى زائر يستخدم نسخة Firefox المستقرة في 2026؟"
    options:
      - text: "البطاقات ظاهرة بالكامل، بلا حركة ظهور تدريجي."
        why: "صحيح. كتلة `@supports` لا تنطبق، فتحتفظ البطاقات بأنماطها العادية الظاهرة."
      - text: "بطاقات غير مرئية، لأن الظهور التدريجي يبدأ من opacity صفر."
        why: "الـ keyframe ذو opacity صفر لا يُستخدم إلا داخل كتلة `@supports` التي يتخطّاها Firefox."
      - text: "ظهورًا تدريجيًا زمنيًا عند تحميل الصفحة."
        why: "لا شيء في الكتلة المحمية ينطبق، فلا حركة على الإطلاق."
      - text: "طبقة خطأ يعرضها المتصفّح."
        why: "المتصفّحات تتخطّى بصمت الـ CSS التي لا تدعمها."
    answer: 0
  - q: "خمسون بطاقة متحدّث تحرّك `box-shadow` عند المرور، وتحريك الفأرة عبر الشبكة يبدو ثقيلًا. ما الطريقة الأرخص للحصول على المظهر نفسه؟"
    options:
      - text: "أضف `will-change: box-shadow` إلى كل بطاقة."
        why: "رفع الطبقة لا يمنع الظلّ من إعادة الرسم في كل إطار، وخمسون طبقة تكلّف ذاكرة."
      - text: "قلّل مدة الـ transition إلى 50ms."
        why: "إطارات أقل من إعادة الرسم تظل إعادة رسم، ويصبح التأثير مفاجئًا."
      - text: "ضع الظلّ الأكبر على pseudo-element `::after` وحرّك الـ `opacity` الخاصة به بدلًا من ذلك."
        why: "صحيح. يُرسم الظلّ مرة واحدة؛ والمرور لا يغيّر إلا التركيب، فلا تعمل إعادة رسم في كل إطار."
      - text: "استخدم `filter: drop-shadow()` بدلًا منها."
        why: "تغيير ظلّ الـ filter يظل يتطلّب إعادة رسم العنصر المرشَّح في كل إطار."
    answer: 2
