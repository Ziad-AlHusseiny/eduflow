  - q: أيّ وصف لمعمارية Trailhead دقيق؟
    options:
      - text: تُرسم components من React كـ HTML يعرضه WebView.
        why: لا يوجد HTML ولا WebView في مسار الرسم في React Native.
      - text: يُولَّد كود Swift وKotlin من الـ JSX الخاص بك وقت البناء.
        why: لا يُترجَم الـ JSX إلى Swift أو Kotlin؛ بل يعمل بوصفه JavaScript.
      - text: تعمل JavaScript على الـ UI thread وترسم على الشاشة مباشرة.
        why: تعمل JavaScript على thread خاص بها؛ والـ UI thread يرسم الـ native views.
      - text: تعمل JavaScript في Hermes على thread خاص بها، وينشئ مُصيِّر Fabric الـ native views التي يرسمها الـ UI thread.
        why: صحيح. هذا هو مسار الـ New Architecture الذي يستخدمه كل تطبيق React Native حالي.
