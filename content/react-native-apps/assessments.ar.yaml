  - q: tab الإحصاءات في Trailhead جزء من مجموعة `(tabs)`، و`hikes/[id]` في الـ Stack الجذري. يفتح مستخدم في الإحصاءات رحلة ثم يسحب للرجوع. أين يصل؟
