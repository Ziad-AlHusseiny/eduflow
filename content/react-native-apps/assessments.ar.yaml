checkpoints:
  s-rn-1:
    - q: يسأل مدير منتج هل ستبدو قائمة Trailhead «أصلية» أم «كأنها موقع ويب داخل تطبيق». ما الإجابة الدقيقة؟
      options:
        - text: ستبدو كموقع ويب، لأن React Native يرسم HTML داخل WebView.
          why: لا يوجد WebView ولا HTML في الأمر. يرسم React Native عناصر المنصّة.
        - text: يعتمد ذلك على تفعيل الـ New Architecture في app.json.
          why: الـ New Architecture هي المعمارية الوحيدة في React Native الحالي؛ فلا شيء يُفعَّل، وهي لا تحدّد هل الـ views أصلية.
        - text: ستستخدم views حقيقية من المنصّة، فيتصرّف التمرير وتحديد النص وحقول الإدخال كما في التطبيقات الأخرى على الهاتف.
          why: صحيح. الـ components الخاصة بك تصف الواجهة؛ وينشئ React Native الـ native views ويحدّثها انطلاقًا من هذا الوصف.
        - text: ستبدو أصلية على iOS وكموقع ويب على Android.
          why: المنصّتان تحصلان على native views. وAndroid لا يُرسم بطريقة مختلفة.
      answer: 2
    - q: ثبّتّ `react-native-keyboard-controller` في Trailhead، وحفظت، فانهار التطبيق في Expo Go برسالة تقول إن وحدة أصلية غير موجودة. ما الذي يحدث؟
      options:
        - text: تحتاج المكتبة إلى إيقاف Fast Refresh.
          why: يستبدل Fast Refresh كود JavaScript فقط. والقطعة الناقصة كود أصلي.
        - text: تحتاج إلى تشغيل `npx expo start --clear` لإعادة بناء الكود الأصلي.
          why: مسح ذاكرة Metro المؤقتة يعيد ضبط تجميع JavaScript؛ ولا يترجم كودًا أصليًا أبدًا.
        - text: لا يدعم Expo Go إلا المكتبات المكتوبة بـ TypeScript.
          why: اللغة ليست المشكلة. لا يستطيع Expo Go تشغيل إلا الكود الأصلي الذي تُرجم داخل Expo Go نفسه.
        - text: تحتوي المكتبة على كود أصلي لا يتضمّنه Expo Go، فتحتاج إلى development build لتطبيقك الخاص.
          why: صحيح. يترجم الـ development build الوحدات الأصلية التي يستخدمها مشروعك، مع أدوات التطوير نفسها التي في Expo Go.
      answer: 3
    - q: أيّ مقطع يعرض إحصاءات الرحلة دون أن ينهار حين تكون `hike.elevationM` صفرًا؟
      options:
        - text: "`<View><Text>{hike.distanceKm} km</Text>{hike.elevationM > 0 && <Text>{hike.elevationM} m up</Text>}</View>`"
          why: صحيح. كل نص يقع داخل Text، والشرط قيمة منطقية حقيقية، فلا يرسم الصفر شيئًا.
        - text: "`<View><Text>{hike.distanceKm} km</Text>{hike.elevationM && <Text>{hike.elevationM} m up</Text>}</View>`"
          why: حين يكون الارتفاع صفرًا، تُقيَّم `0 && …` إلى 0، ويحاول React Native رسمها نصًّا مباشرة داخل الـ View.
        - text: "`<View>{hike.distanceKm} km<Text>{hike.elevationM} m up</Text></View>`"
          why: المسافة و"km" نصّ خام داخل View، وهذا يرمي خطأ مع كل رحلة.
      answer: 0
    - q: يقول مختبِر إن زرّ Save في نموذج التسجيل السريع في Trailhead «أحيانًا لا يلاحظ النقرات» أثناء المشي. الزر Pressable بارتفاع 28 نقطة. ما الذي يجب أن تغيّره أولًا؟
      options:
        - text: استبدل Pressable بالـ component المدمج Button.
          why: لا يمكن تنسيق Button ليناسب التصميم، ولا يحلّ مشكلة الحجم.
        - text: اجعل منطقة اللمس بارتفاع 44 نقطة على الأقل، عبر الحشو أو `hitSlop`، وأعطِ استجابة بصرية عند الضغط.
          why: صحيح. الأهداف الصغيرة صعبة الإصابة أثناء الحركة؛ والمنطقة الأكبر مع الاستجابة الفورية تصلحان نصفَي الشكوى.
        - text: انتقل إلى `onLongPress` لتُتجاهَل النقرات العرضية.
          why: هذا يجعل كل حفظ أبطأ، ولا يساعد المستخدمين على إصابة الهدف.
      answer: 1
    - q: يخزّن Trailhead حقل المسافة باستخدام `const [km, setKm] = useState(0)` و`onChangeText={(t) => setKm(Number(t))}`. لا يستطيع المستخدمون كتابة "8.4". لماذا؟
      options:
        - text: "`onChangeText` لا يُطلَق مع النقاط العشرية."
          why: يُطلَق مع كل تغيير، بما في ذلك النقطة.
        - text: "يجب ضبط `keyboardType` على `number` لتعمل الأعداد العشرية."
          why: هذه القيمة غير موجودة؛ والمشكلة في الـ state لا في لوحة المفاتيح.
        - text: كتابة "8." تصبح `Number("8.")`، أي 8، فتختفي النقطة من الحقل المضبوط قبل أن يستطيع المستخدم إضافة الـ 4.
          why: صحيح. احتفظ بالنص الخام في الـ state، وحلّله حين تحتاج إلى الرقم.
        - text: قيم TextInput محصورة في الأعداد الصحيحة على Android.
          why: قيم TextInput نصوص دائمًا، على المنصّتين.
      answer: 2
  s-rn-2:
    - q: "يكتب زميل `style={{ padding: '12px 16px', fontSize: '15px' }}` على بطاقة في Trailhead. ماذا يجب أن يقول تعليق المراجعة؟"
      options:
        - text: استخدم وحدات `rem` ليتكيّف النص مع إعدادات إمكانية الوصول.
          why: لا توجد وحدات rem في React Native. والنص يتكيّف أصلًا مع إعدادات الخط لدى المستخدم.
        - text: انقل هذه القيم إلى ملف CSS يُستورد في أعلى الـ component.
          why: لا يحمّل React Native ملفات CSS؛ التنسيقات كائنات JavaScript.
        - text: لا بأس؛ يحوّل React Native نصوص CSS تلقائيًا.
          why: لا يفعل. النصوص متعدّدة القيم ووحدات px إما أخطاء أو تُتجاهَل.
        - text: "استخدم أرقامًا بلا وحدات ومفاتيح مفصّلة: `paddingVertical: 12, paddingHorizontal: 16, fontSize: 15`."
          why: صحيح. رقم واحد بلا وحدة لكل خاصية، يُقاس بالنقاط.
      answer: 3
    - q: "شاشة تعرض ScrollView داخل View. محتوى الـ ScrollView مقطوع في الأسفل ولا يتمرّر. وعلى الـ ScrollView `style={{ flex: 1 }}`. ما الناقص؟"
      options:
        - text: "`overflow: 'scroll'` على الـ ScrollView."
          why: يتمرّر ScrollView وحده؛ وتنسيقات overflow لا تنشئ تمريرًا.
        - text: "`contentContainerStyle={{ flex: 1 }}`"
          why: هذا يمدّ المحتوى إلى ارتفاع منطقة العرض، وكثيرًا ما يوقف التمرير بدلًا من إصلاحه.
        - text: "`flex: 1` على الـ View الأب، ليرث الـ ScrollView ارتفاعًا محدودًا يتمرّر داخله."
          why: صحيح. دون أب محدود، يكبر الـ ScrollView بحجم محتواه فتقطعه الشاشة.
        - text: "`horizontal={false}`"
          why: هذه هي القيمة الافتراضية أصلًا.
      answer: 2
    - q: شاشة الإعدادات في Trailhead ليس لها ترويسة، وعلى هاتف Android حديث يقع العنوان تحت ساعة شريط الحالة. ما الإصلاح الصحيح؟
      options:
        - text: أضف حشوًا للمحتوى بقيمة `useSafeAreaInsets().top` من react-native-safe-area-context.
          why: صحيح. يرسم Android التطبيقات من الحافة إلى الحافة، فيجب على الشاشات التي ليس لها ترويسة أن تطبّق الهامش العلوي بنفسها.
        - text: استخدم `SafeAreaView` من react-native.
          why: إنه مُهمَل، ولم يطبّق الحشو يومًا إلا على iOS.
        - text: "أضف `marginTop: 24`، وهو ارتفاع شريط الحالة في Android."
          why: ارتفاعات شريط الحالة تختلف بحسب الجهاز والإعداد؛ والقيمة الثابتة خاطئة على هواتف كثيرة.
        - text: أخفِ شريط الحالة على Android.
          why: يفقد المستخدمون الساعة ومستوى البطارية، وتبقى مناطق الإيماءات في الأسفل متداخلة.
      answer: 0
    - q: لكل صفّ في قائمة Trailhead مفتاح «موسَّع» مخزّن في `useState` داخل الصف. أيّ خطأ سيبلّغ عنه المستخدمون في النهاية؟
      options:
        - text: تتوسّع الصفوف على iOS لا على Android.
          why: الـ state تعمل بالطريقة نفسها على المنصّتين؛ ولا شيء هنا خاص بمنصّة.
        - text: تنطوي الصفوف الموسَّعة وحدها بعد التمرير بعيدًا ثم العودة.
          why: صحيح. يُزيل FlatList الصفوف البعيدة لتوفير الذاكرة، وتضيع الـ state المحلية معها.
        - text: ينهار التطبيق حين يُوسَّع صفّان.
          why: يمكن لعدّة صفوف أن تحمل state في الوقت نفسه دون مشكلات.
      answer: 1
    - q: أيّ تغيير يحسّن أكثر من غيره FlatList فيه 800 رحلة، يعرض كل صف فيها صورة بعرض 4000 بكسل مصغّرة إلى صورة مصغّرة بعرض 56 نقطة؟
      options:
        - text: زِد `windowSize` لإبقاء صفوف أكثر مركّبة.
          why: صفوف مركّبة أكثر تعني صورًا بحجمها الكامل أكثر في الذاكرة، وهذا يزيد الأمر سوءًا.
        - text: غلّف الـ FlatList بـ ScrollView ليُرسم مرة واحدة.
          why: هذا يعطّل الـ virtualization ويرسم كل صفّ بصورته الضخمة.
        - text: استبدل FlatList بـ SectionList.
          why: SectionList قائمة افتراضية (virtualized) أيضًا؛ والصور ستكلّف الشيء نفسه.
        - text: حمّل نسخًا مصغّرة من الصور للقائمة، ويُفضَّل مع component صور يدعم التخزين المؤقت مثل expo-image.
          why: صحيح. فكّ ترميز صور ضخمة لصور مصغّرة صغيرة يهدر الذاكرة والوقت في كل صفّ مرئي.
      answer: 3
  s-rn-3:
    - q: يحتاج Trailhead إلى شاشة على `/hikes/42/photos`. أيّ ملف ينشئها؟
      options:
        - text: "`src/app/hikes/photos/[id].tsx`"
          why: هذا يخدم `/hikes/photos/42`، والأجزاء بترتيب خاطئ.
        - text: "`src/app/(hikes)/[id]/photos.tsx`"
          why: المجموعة بين قوسين لا تضيف جزءًا إلى الـ URL، فهذا يخدم `/42/photos`.
        - text: "`src/app/hikes/[id]/photos.tsx`"
          why: صحيح. كل مجلّد جزء، و`[id]` يلتقط الـ 42.
        - text: "`src/components/HikePhotos.tsx`"
          why: الملفات خارج `src/app` ليست مسارات أبدًا.
      answer: 2
    - q: "في شاشة التفاصيل، `const { id } = useLocalSearchParams<{ id: string }>()` ثم يُستدعى `useHike(Number(id))`. يصل رابط إلى `/hikes/abc`. ماذا يجب أن تعرض الشاشة؟"
      options:
        - text: شاشة خطأ حمراء، لأن Number("abc") يرمي خطأ.
          why: Number("abc") لا يرمي خطأ؛ بل يُرجع NaN، ولا تطابقه أي رحلة.
        - text: حالة ودودة «الرحلة غير موجودة»، لأن البحث لا يُرجع شيئًا والشاشة تتعامل مع هذه الحالة.
          why: صحيح. الـ params نصوص غير موثوقة، فكل شاشة لها params تحتاج إلى حالة «غير موجود».
        - text: أول رحلة في القائمة، كحلّ احتياطي.
          why: عرض الرحلة الخطأ أسوأ من قول إنها غير موجودة.
        - text: لا شيء؛ يرفض Expo Router مطابقة المعرّفات غير الرقمية.
          why: الجزء الديناميكي يطابق أي قيمة؛ والتحقّق مهمّتك أنت.
      answer: 1
    - q: بعد حذف رحلة في شاشة تفاصيلها، يستدعي الكود `router.push('/')`. ما المشكلة التي ينشئها هذا؟
      options:
        - text: تُضاف نسخة ثانية من السجلّ فوق الأولى، فتعيد إيماءة الرجوع المستخدمَ إلى شاشة الرحلة المحذوفة.
          why: صحيح. استخدم `router.back()` (أو `replace`) لتغادر الشاشة المحذوفة الـ stack.
        - text: يختفي شريط الـ tabs نهائيًا.
          why: إضافة مسار لا تُزيل layout الـ tabs.
        - text: يعمل reducer الرحلات مرتين.
          why: التنقّل لا يرسل actions؛ والتكرار في الـ stack لا في الـ state.
      answer: 0
    - q: أيّ عبارة عن `HikesProvider` في Trailhead، مع اثنين من الـ contexts منفصلَين للـ state والـ dispatch، صحيحة؟
      options:
        - text: الـ components التي تقرأ الرحلات لا يُعاد رسمها أبدًا حين تتغيّر الرحلات.
          why: يُعاد رسمها؛ وهكذا تعرض القائمة الجديدة.
        - text: يجعل الـ reducer يعمل على thread في الخلفية.
          why: الـ reducers تعمل على الـ JS thread مثل كل كود React.
        - text: يُلغي الحاجة إلى إرجاع مصفوفات جديدة من الـ reducer.
          why: عدم التعديل المباشر ما زال مطلوبًا؛ فـ React تقارن المراجع.
        - text: زرّ حذف لا يستخدم إلا dispatch لا يُعاد رسمه حين تتغيّر القائمة، لأن context الـ dispatch لا يتغيّر أبدًا.
          why: صحيح. `dispatch` ثابت، فالـ components التي لا تقرأ غيره تتخطّى تحديثات القائمة.
      answer: 3
    - q: على iOS، يضطر مستخدمو نموذج إضافة رحلة في Trailhead إلى النقر على Save مرتين كلما كانت لوحة المفاتيح مفتوحة. أيّ prop يصلح ذلك؟
      options:
        - text: "`autoFocus` على زرّ Save."
          why: الأزرار لا تأخذ التركيز بهذه الطريقة؛ والنقرة الأولى ستظل تُبتلع.
        - text: '`behavior="height"` على الـ KeyboardAvoidingView.'
          why: هذا يغيّر طريقة تجنّب التخطيط للوحة المفاتيح، لا طريقة معالجة النقرات.
        - text: '`keyboardShouldPersistTaps="handled"` على الـ ScrollView الذي يحوي النموذج.'
          why: صحيح. عندها تمرّ النقرات على الأزرار بينما لوحة المفاتيح مفتوحة.
        - text: '`submitBehavior="blurAndSubmit"` على آخر حقل.'
          why: هذا يؤثّر في مفتاح الإدخال، لا في النقرات على زرّ Save.
      answer: 2
  s-rn-4:
    - q: تعرض شاشة الاستكشاف في Trailhead "Could not load trails" مع أن الـ API يستجيب. يسجّل الخادم 200. ويُظهر التصحيح أن `res.ok` قيمتها true لكن القائمة فارغة. أيّ حالة كان يجب أن تعرضها الشاشة؟
      options:
        - text: خطأ، لأن الاستجابة الفارغة فشل.
          why: الطلب نجح؛ لم يفشل شيء.
        - text: تحميل، حتى يصل درب واحد على الأقل.
          why: انتهى الطلب؛ والبقاء في حالة التحميل سيدور إلى الأبد.
        - text: خطأ، مع زرّ إعادة محاولة، لتجربة خادم آخر.
          why: إعادة طلب ناجح تُرجع القائمة الفارغة نفسها.
        - text: نجاح بصفر عناصر، يُعرض حالةَ فراغ مثل "No trails within 50 km".
          why: صحيح. الفراغ نتيجة ناجحة تستحق رسالة مصمّمة خاصة بها.
      answer: 3
    - q: أين يجب أن يحتفظ Trailhead بالوحدات التي اختارها المستخدم (km أو mi)؟
      options:
        - text: في expo-secure-store، لأن كل إعداد بيانات شخصية.
          why: SecureStore للأسرار مثل الـ tokens؛ وتفضيل الوحدات ليس حسّاسًا.
        - text: في AsyncStorage (أو expo-sqlite/kv-store)، ضمن قيمة JSON صغيرة للتفضيلات.
          why: صحيح. التفضيلات الصغيرة غير السرّية هي ما وُجد تخزين المفتاح-القيمة من أجله.
        - text: في جدول SQLite جديد بصفّ واحد وعمود واحد.
          why: ينجح، لكنه أثقل من اللازم لتفضيل واحد.
        - text: في متغيّر بيئة يبدأ بـ `EXPO_PUBLIC_`.
          why: هذه ثابتة وقت البناء لكل المستخدمين؛ ولا تستطيع تخزين اختيار مستخدم.
      answer: 1
    - q: رفض مستخدم في Trailhead الموقع رفضًا دائمًا، ثم فعّله لاحقًا في الإعدادات، وعاد إلى التطبيق. ما زالت شاشة التتبّع تقول إن الموقع مُطفأ. ما الخطأ المرجّح؟
      options:
        - text: تحقّقت الشاشة من الإذن مرة واحدة فقط عند تركيبها، بدلًا من التحقّق مجددًا حين استعادت التركيز.
          why: صحيح. أعِد التحقّق باستخدام `getForegroundPermissionsAsync()` داخل `useFocusEffect` أو حين يعود التطبيق إلى المقدّمة.
        - text: يحتاج iOS إلى إعادة تثبيت التطبيق قبل أن يُطبَّق تغيير الإذن.
          why: تغييرات الأذونات في الإعدادات تُطبَّق فورًا على التطبيق المثبّت.
        - text: "يجب إعادة ضبط `canAskAgain` على true في تخزين التطبيق."
          why: نظام التشغيل هو مالك هذه القيمة؛ وتطبيقك يقرؤها فقط.
      answer: 0
    - q: يضيف الإصدار الثالث من Trailhead عمود `difficulty` إلى جدول الرحلات. يعدّل زميل كتلة الإصدار 0 في الـ migration لتتضمّن العمود الجديد. ماذا يحدث للمستخدمين الحاليين؟
      options:
        - text: يحصلون على العمود الجديد تلقائيًا في التشغيل التالي.
          why: قاعدة بياناتهم تجاوزت الإصدار 0 أصلًا، فلا تعمل تلك الكتلة لديهم أبدًا.
        - text: يُحذف سجلّ رحلاتهم ويُعاد إنشاؤه.
          why: لا شيء يحذفه؛ الكتلة المعدّلة ببساطة لا تعمل.
        - text: لا يتغيّر شيء لديهم، فتفشل الاستعلامات التي تستخدم `difficulty` بالخطأ "no such column".
          why: صحيح. أضف خطوة جديدة مرقّمة (`ALTER TABLE … ADD COLUMN`) بدلًا من تعديل خطوة أُطلقت.
        - text: يرفض SQLite ملف قاعدة البيانات عند بدء التشغيل.
          why: الملف صالح؛ كل ما في الأمر أنه يفتقد العمود الجديد.
      answer: 2
    - q: تُظهر رحلة متتبَّعة 14 km لمشي يعرف المتنزّه أنه كان 9 km. وفي المسار تعرّجات حادّة كثيرة تحت غطاء الغابة. ما أفضل إصلاح؟
