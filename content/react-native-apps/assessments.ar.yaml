  - q: "بطاقة رحلة جديدة تبدو منضغطة: العنوان يفيض ويدفع شارة التاريخ خارج الشاشة. الصف `flexDirection: 'row'`. أيّ تغيير هو الأسلوب المعتاد؟"
    options:
