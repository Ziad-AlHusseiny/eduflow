      - text: أول إصدار مستقر لتقرير من W3C Community Group، تطبّقه أدوات مثل Style Dictionary واستيراد المتغيّرات وتصديرها في Figma.
        why: صحيح. إنه مستقر ومطبّق على نطاق واسع، لكنه ليس توصية رسمية من W3C.
      - text: توصية رسمية من W3C تطبّقها المتصفّحات مباشرة.
        why: تقارير المجموعات المجتمعية ليست توصيات رسمية، والمتصفّحات لا تقرأ ملفات الـ tokens.
      - text: مسودّة مبكرة بلا أي دعم من الأدوات بعد.
        why: 2025.10 هو الإصدار المستقر، وتدعمه عدّة أدوات.
      - text: صيغة مملوكة لـ Figma.
        why: الصيغة محايدة تجاه الشركات وتطوّرها مجموعة مجتمعية.
    answer: 0
  - q: يعرض تطبيق الـ dispatch قسمين لـ Northwind وTidewater جنبًا إلى جنب، وما زالت أقسام Tidewater تستخدم Inter للعناوين رغم أن `[data-brand="tidewater"]` يحدّد `--nw-brand-font-heading`. ما الإصلاح؟
    options:
      - text: إضافة `!important` إلى token الخط في Tidewater.
        why: لا يفيد `!important` هنا؛ فالـ semantic token حُسب مسبقًا عند الجذر.
      - text: تحميل ملف خط Georgia.
        why: Georgia خط نظام هنا؛ المشكلة في القيمة التي يستقبلها العنوان.
      - text: إعادة تعريف الروابط الدلالية، بما فيها `--nw-font-heading`، تحت `[data-brand]` إضافة إلى `:root`.
        why: صحيح. حينها يحسب كل قسم علامة الـ semantic tokens الخاصة به من طبقة علامته.
      - text: إعطاء عناوين Tidewater class خاصًا بها.
        why: classes العلامة على المكوّنات تتجاوز معمارية الـ tokens.
    answer: 2
  - q: أيّ مجموعة من الإشارات تعطي أوثق صورة عن صحّة نظام التصميم؟
    options:
      - text: عدد المكوّنات في المكتبة.
        why: المكتبة الكبيرة قد تكون غير مستخدمة أو غير متّسقة؛ الحجم ليس صحّة.
      - text: عدد النجوم على مستودع موقع التوثيق.
        why: الشعبية خارج الشركة لا تقول الكثير عن التبنّي الداخلي.
      - text: إجمالي الـ pull requests المدموجة شهريًا.
        why: النشاط قد يكون عاليًا بينما تنسخ الفرق النظام بصمت؛ إنه يقيس فريق النواة لا المستخدمين.
      - text: تبنّي المكوّنات، وتغطية الـ tokens، وتأخّر الإصدارات، ورضا الفرق، متابَعة معًا كاتّجاهات.
        why: صحيح. عدّة إشارات معًا تقاوم التلاعب وتُظهر أين يخذل النظام مستخدميه.
    answer: 3
