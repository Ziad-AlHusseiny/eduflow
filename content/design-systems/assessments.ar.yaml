checkpoints:
  s-ds-1:
    - q: يقترح قائد التصميم في شركة ناشئة «جولة نظام تصميم» مدّتها ثلاثة أشهر تنتهي بحفل إطلاق، دون أي مالك بعدها. بناءً على تاريخ Northwind، ما أقوى اعتراض؟
      options:
        - text: بعد الإطلاق لا يملك أحد الأخطاء والطلبات والإصدارات، فتبدأ الفرق بترقيع نسخها الخاصة.
          why: صحيح. هكذا فشل نظام Northwind لعام 2021، فقد كان «منتهيًا»، والأنظمة المنتهية تنحرف.
        - text: ثلاثة أشهر مدّة أقصر من أن يُبنى فيها أي مكوّن.
          why: يمكن بناء مكوّنات مفيدة كثيرة في ثلاثة أشهر؛ المشكلة فيما يحدث بعدها.
        - text: حفلات الإطلاق تجعل التبنّي إلزاميًا، وهذا يزعج الفرق.
          why: الإعلانات لا تفرض التبنّي؛ الفجوة الحقيقية هي الملكية بعد الإطلاق.
        - text: يجب أن تبني فرق المنتجات أنظمة التصميم، لا قادة التصميم.
          why: مَن يبدأ النظام أقل أهمية من وجود مَن يُبقيه محدَّثًا.
      answer: 0
    - q: كشف جرد الواجهة لديك 9 أشكال للجداول في 31 شاشة، و4 أشكال للـ tooltips في 6 شاشات، و52 درجة رمادي مستخدمة في كل مكان. بأيّ ترتيب يجب أن يملكها النظام؟
      options:
        - text: الـ tooltips أولًا، لأنها أسرع مكسب.
          why: المكاسب السريعة في ست شاشات لا تعالج الانحراف الأوسع انتشارًا.
        - text: الجداول أولًا، لأنها أصعب مكوّن.
          why: الصعوبة لا تحدّد الأولوية؛ ما يحدّدها هو التكرار مضروبًا في عدم الاتّساق.
        - text: الثلاثة معًا لإظهار النطاق الكامل للنظام.
          why: توزيع فريق صغير على كل شيء يؤخّر عملية التوحيد الأعلى قيمة.
        - text: الرماديات أولًا، ثم الجداول، ثم الـ tooltips.
          why: صحيح. الرماديات في كل مكان وغير متّسقة إلى حدّ كبير، والجداول شائعة ومتنوّعة، والـ tooltips نادرة.
      answer: 3
    - q: أيّ مبدأ مقترح سيحسم على أفضل وجه نقاشًا حول إضافة variant رابع للأزرار في الموقع التسويقي؟
      options:
        - text: واجهتنا نظيفة وعصرية.
          why: لا أحد يدافع عن واجهة فوضوية وقديمة، فلا يمكن لهذا أن يحسم شيئًا.
        - text: نقدّر التعاون بين التصميم والهندسة.
          why: قيمة جيدة، لكنها لا ترشد إلى قرار إضافة الـ variant أو عدمها.
        - text: مكوّنات أقل لكن أفضل، فوسّع مكوّنًا موجودًا قبل أن تضيف نسخة شبه مكرّرة منه.
          why: صحيح. ينحاز إلى طرف في مفاضلة حقيقية ويشير مباشرة إلى قرار.
        - text: يجب أن يشعر كل فريق منتج بملكية النظام.
          why: الملكية تتعلّق بالعملية، لا بما إذا كان هذا الـ variant ينتمي إلى النظام.
      answer: 2
    - q: شركة لديها ثمانية فرق منتجات. يصون نظامَ التصميم فيها مصمّمان من فريق الـ dispatch في أوقات فراغهما، والفرق السبعة الأخرى تنسخ ما يبنيه فريق الـ dispatch. أيّ نموذج فريق هذا، وما فشله المعتاد؟
      options:
        - text: المركزي؛ يصبح فريق النظام عنق زجاجة.
          why: لا يوجد هنا فريق نظام متفرّغ؛ النظام يعيش داخل فريق منتج واحد.
        - text: المنفرد؛ يعكس النظام احتياجات فريق واحد، وتنحرف الفرق الأخرى وهي تكيّف نسخها.
          why: صحيح. النموذج المنفرد ينجح مع فريق واحد ويتفكّك بمجرّد أن تعتمد عليه عدّة فرق.
        - text: الفيدرالي؛ تتعثّر المساهمات لأن أحدًا لا يراجعها.
          why: الفيدرالي يعني أن فرقًا كثيرة تساهم؛ وهنا فريق واحد فقط يبني.
        - text: الهجين؛ تختلف النواة والمساهمون حول الاتجاه.
          why: النموذج الهجين يحتاج نواة متفرّغة، وهذه الشركة لا تملكها.
      answer: 1
    - q: يُبلغ سكربت التدقيق عن `#1F2933` و`#1f2933` و`#222b35` كثلاث درجات رمادي. ماذا يجب أن يقول تقرير التدقيق؟
      options:
        - text: ثلاث درجات رمادي مختلفة، تمامًا كما كُتبت.
          why: القيمتان الأوليان قيمة واحدة بحالة أحرف مختلفة؛ وعرضهما منفصلتين يضخّم الأرقام.
        - text: درجة رمادي واحدة، لأنها كلها تبدو متشابهة.
          why: القيمة `#222b35` مختلفة؛ يجب أن تُعرض كقيمة شبه مكرّرة، لا أن تُدمج بصمت.
        - text: لا شيء بعد؛ الرماديات لا تهمّ قبل وجود المكوّنات.
          why: انحراف الألوان غالبًا أوسع النتائج انتشارًا، وهو ما يشكّل عمل الـ tokens الذي يأتي أولًا.
        - text: قيمتان بعد توحيد حالة الأحرف، معلَّمتان كمجموعة واحدة شبه مكرّرة ليوحّدها المصمّمون.
          why: صحيح. وحّد الصيغة آليًا؛ ودع المصمّمين يقرّرون أيّ القيم شبه المكرّرة تصبح token واحدًا.
      answer: 3
  s-ds-2:
    - q: "يكتب فريق منتج `.order-card { border-color: var(--nw-gray-200); }` في الـ CSS الخاص به. والوضع الداكن يُطلق الأسبوع القادم. ماذا سيحدث لذلك الحدّ؟"
      options:
        - text: سيتكيّف تلقائيًا، لأن كل الـ tokens تتغيّر في الوضع الداكن.
          why: الوضع الداكن يعيد ربط الـ semantic tokens؛ أما الـ primitives فتحتفظ بقيمها.
        - text: سيصبح شفافًا، لأن الـ primitives تُحذف في الوضع الداكن.
          why: الـ primitives تبقى معرّفة؛ هي فقط لا يُعاد ربطها.
        - text: سيختار المتصفّح مقابلًا داكنًا عبر `color-scheme`.
          why: الخاصية `color-scheme` تؤثّر في واجهة المتصفّح المرسومة، لا في الـ custom properties الخاصة بك.
        - text: سيحتفظ بالرمادي الفاتح، لأنه يشير إلى primitive لا يعيد الوضع الداكن ربطه.
          why: صحيح. استخدام `--nw-color-border` بدلًا منه سيسمح للـ theme بتغييره.
      answer: 3
    - q: أيّ مما يلي dimension token مكتوب بشكل صحيح وفق DTCG 2025.10؟
      options:
        - text: '`"inset-md": { "$type": "dimension", "$value": { "value": 1, "unit": "rem" } }`'
          why: صحيح. قيمة الـ dimension كائن فيه `value` رقمية و`unit` قيمتها `px` أو `rem`.
        - text: '`"inset-md": { "$type": "dimension", "$value": "16px" }`'
          why: المسودّات الأقدم استخدمت النصوص، لكن 2025.10 تشترط صيغة الكائن بـ `value` و`unit`.
        - text: '`"inset.md": { "$type": "dimension", "$value": { "value": 16, "unit": "px" } }`'
          why: القيمة سليمة، لكن النقاط غير مسموحة في الأسماء لأنها تفصل مسارات المراجع.
        - text: '`"inset-md": { "$type": "dimension", "$value": { "value": 1, "unit": "em" } }`'
          why: الوحدتان الصالحتان الوحيدتان لـ dimension tokens هما `px` و`rem`.
      answer: 0
    - q: "يحتوي الـ CSS المولَّد في Northwind على `--nw-color-action-bg: var(--nw-color-blue-600);` على `:root`. وملف الأنماط الخاص بصفحة حملة يحدّد قيمة أسطع لـ `--nw-color-blue-600` على `:root`، فتتبعها كل أزرار الإجراء في تلك الصفحة. ما الذي جعل هذا ممكنًا؟"
      options:
        - text: ينجح لأن الـ primitives تُحسب دائمًا في النهاية؛ لا علاقة لأي إعداد بذلك.
          why: ترتيب الحساب لا علاقة له بالأمر؛ كان يجب أن يحتفظ الإخراج بالمراجع.
        - text: احتُفظ بالمراجع في الـ CSS المولَّد، فما زال الـ semantic token يشير إلى الـ primitive وقت التشغيل.
          why: صحيح. مع `outputReferences` تصل الصلة بين الـ semantic والـ primitive إلى المتصفّح، فيسري تخصيص الـ primitive على العنصر نفسه.
        - text: خط الإنتاج يولّد ملفًا لكل صفحة.
          why: تولّد Northwind ملفًا لكل theme لا لكل صفحة؛ والتخصيص يحدث في المتصفّح.
        - text: يراقب Style Dictionary الصفحة ويعيد البناء حين تتغيّر القيم.
          why: أدوات البناء تعمل وقت البناء؛ والتخصيص يعمل بالكامل داخل الـ cascade في المتصفّح.
      answer: 1
    - q: يسمّي مصمّم token جديدًا `--nw-color-tidewater-teal-button`. ما المشكلة الرئيسية؟
      options:
        - text: إنه أطول من اللازم لـ CSS.
          why: أسماء الـ custom properties لا حدّ عمليًا لطولها؛ والأسماء الطويلة لا بأس بها إن كانت ذات معنى.
        - text: ينقصه جزء الحالة من القواعد.
          why: ليس كل token يحتاج حالة؛ المشكلة فيما يصفه الاسم.
        - text: يحشر علامة ولونًا ومكوّنًا في اسم دلالي، فينكسر حين يتغيّر أيٌّ منها.
          why: صحيح. اسم مبني على الدور مثل `--nw-color-action-bg` يسمح لكل علامة بربط لونها الخاص.
        - text: أسماء الـ tokens لا يمكن أن تحتوي أسماء علامات في صيغة DTCG.
          why: الصيغة تسمح بأي اسم خالٍ من `$` و`{` و`}` و`.`؛ هذه مشكلة تصميم لا مشكلة صياغة.
      answer: 2
    - q: كتلة الـ theme الداكن هي `[data-theme="dark"] { … }` والكثافة هي `[data-density="compact"] { … }`. تحدّد صفحة السمتين معًا على `<html>`. ماذا تحتاج أن تضيف لتعمل التركيبة؟
      options:
        - text: لا شيء، لأن كل محور يعيد ربط tokens مختلفة والـ cascade يجمعها.
          why: صحيح. المحاور المستقلة التي تملك tokens منفصلة تتركّب دون selectors مركّبة.
        - text: كتلة مركّبة `[data-theme="dark"][data-density="compact"]`.
          why: لا تلزم إلا حين يتفاعل محوران فعلًا على الـ tokens نفسها؛ والـ theme والكثافة لا يتفاعلان.
        - text: دالة JavaScript تدمج مجموعتي الـ tokens.
          why: الـ cascade في CSS يدمج التعريفات أصلًا؛ لا حاجة إلى سكربت.
        - text: سمة ثالثة، مثل `data-mode="dark-compact"`.
          why: دمج الـ modes في سمة واحدة يعيد التضاعف الذي كنت تتجنّبه.
      answer: 0
  s-ds-3:
    - q: الـ API الخاص بمكوّن Select فيه القيم المنطقية `isSmall` و`isLarge` و`isCompact`. ما أفضل إعادة تصميم؟
      options:
        - text: enum واحد باسم `size` (`sm`، `md`، `lg`) يطابق المكوّنات الأخرى، مع ترك الإحكام لـ mode الكثافة.
          why: صحيح. الأحجام المتنافية تصبح enum واحدًا، والكثافة تنتمي إلى محور الـ theme لا إلى كل مكوّن.
        - text: إبقاء القيم المنطقية مع توثيق التركيبات غير الصالحة.
          why: التوثيق لا يمنع التركيبات غير الصالحة؛ النوع هو الذي يجب أن يمنعها.
        - text: استبدالها بـ prop باسم `className` لتحدّد الفرق الحجم بنفسها.
          why: هذا يتخلّى عن سيطرة النظام على الأحجام ويخلق انحرافًا.
        - text: إضافة `isMedium` ليكون لكل حجم قيمة منطقية.
          why: مزيد من القيم المنطقية يعني مزيدًا من التركيبات المستحيلة.
      answer: 0
    - q: يمرّر `<Tabs>` القيمة المحدّدة إلى الـ triggers عبر نسخ `children`. يغلّف فريق أحد الـ triggers بـ `<Tooltip>`. ماذا يحدث، وما الإصلاح؟
      options:
        - text: ينكسر الـ tooltip؛ فالـ tooltips لا يمكنها تغليف الأزرار.
          why: الـ tooltips تغلّف الأزرار طوال الوقت؛ المشكلة في طريقة عثور Tabs على الـ triggers.
        - text: لا شيء؛ النسخ يصل إلى العناصر المتداخلة تلقائيًا.
          why: النسخ لا يلمس إلا الأبناء المباشرين، فيُفوَّت الـ trigger المغلَّف.
        - text: تُزال لوحة التبويب؛ أضف `key` إلى الـ tooltip.
          why: المفاتيح تتحكّم بالهوية في القوائم، لا بكيفية وصول الحالة إلى trigger متداخل.
        - text: لم يعد الـ trigger المغلَّف يستقبل الـ props الخاصة به؛ شارك الحالة عبر الـ context بدلًا من ذلك.
          why: صحيح. الـ context يصل إلى الـ trigger مهما كان عمق تداخله.
      answer: 3
    - q: تُظهر تصاميم مصمّم مربّع اختيار مخصّصًا مرسومًا بـ `<div>`. على أيّ أساس يجب أن يُبنى Checkbox في النظام؟
      options:
        - text: على الـ `<div>` مع إضافة `role="checkbox"` و`tabindex` ومعالجات المفاتيح.
          why: ممكن، لكنه يعيد بناء ما يفعله عنصر الإدخال الأصلي بشكل صحيح أصلًا، يدويًا.
        - text: على `<img>` يتبدّل بين صورتي المحدّد وغير المحدّد.
          why: الصور لا تحمل حالة ولا سلوك لوحة مفاتيح للتقنيات المساعدة.
        - text: على `<input type="checkbox">` أصلي، منسَّق بصريًا، ومرتبط بالـ label الخاص به.
          why: صحيح. العناصر الأصلية تجلب التركيز ولوحة المفاتيح والحالة مجانًا؛ نسّقها بدل أن تستبدلها.
        - text: على `<button>` مع `aria-pressed`.
          why: هذا نمط زر التبديل، ويُعلَن بشكل مختلف عن مربّع الاختيار.
      answer: 2
    - q: صفحة توثيق Dialog تسرد كل prop بدقّة، لكن الفرق تستمرّ في استخدام Dialog لرسائل النجاح. أيّ جزء من الصفحة ناقص؟
      options:
        - text: جدول props أكثر تفصيلًا.
          why: جدول الـ props دقيق أصلًا؛ ولا يستطيع أن يخبر الناس متى لا يستخدمون Dialog.
        - text: رابط إلى الـ changelog.
          why: التاريخ لا يساعد أحدًا على تقرير أيّ مكوّن يستخدم اليوم.
        - text: وصف أطول لحركة الطبقة المعتمة.
          why: تفاصيل الحركة لا تعالج اختيار المكوّن الصحيح.
        - text: إرشاد «متى لا تستخدمه» مع البديل، Toast، ومثال افعل/لا تفعل.
          why: صحيح. إساءة الاستخدام تأتي من غياب الحكم، ولا يقدّمه إلا الإرشاد المكتوب.
      answer: 3
    - q: زرّ Button معطّل بـ `aria-disabled="true"` حتى يشرح tooltip السبب. نقره مختبِر فحُفظ النموذج رغم ذلك. ما الذي فات؟
      options:
        - text: 'يجب أن تكون القيمة `aria-disabled="disabled"`.'
          why: القيمتان الصالحتان هما `true` و`false`؛ والقيمة ليست المشكلة.
        - text: السمة `aria-disabled` تعلن الحالة فقط؛ ويجب أن يمنع المكوّن الإجراء بنفسه.
          why: صحيح. على عكس السمة `disabled`، لا توقف `aria-disabled` النقرات.
        - text: اعترض الـ tooltip النقرة.
          why: الـ tooltips لا تغيّر سلوك النقر؛ عمل معالج الزر لأن شيئًا لم يوقفه.
        - text: قارئات الشاشة تتجاهل `aria-disabled` على الأزرار.
          why: قارئات الشاشة تعلنها؛ المشكلة في غياب الحارس على الإجراء.
      answer: 1
  s-ds-4:
    - q: ملف JSON الخاص بالـ tokens هو مصدر الحقيقة، لكن مصمّمًا نشر أزرق إجراء جديدًا مباشرة في مكتبة Figma. ماذا يجب أن يحدث بعد ذلك؟
      options:
        - text: نسخ القيمة من Figma إلى JSON حتى يتطابقا.
          why: هذا يقبل تغييرًا غير مُراجَع ويتخطّى فحوص التباين والتسمية.
        - text: ترك الاثنين؛ الفروق الصغيرة لا تهمّ.
          why: الفروق الصغيرة هي بالضبط ما انتهى بمنتجين إلى لونين أزرقين مختلفين.
        - text: إعادة المكتبة إلى القيم المعتمدة في آخر إصدار وتحويل التغيير إلى pull request على ملف JSON.
          why: صحيح. يمرّ التغيير عبر المراجعة والفحوص المعتادة، ثم يُزامَن إلى Figma عند الإصدار.
        - text: قفل مكتبة Figma حتى لا يستطيع أحد تعديل المتغيّرات.
          why: يحتاج المصمّمون إلى التجريب في الـ branches؛ العملية، لا القفل، هي ما يمنع التباعد.
      answer: 2
    - q: الحزمة `@northwind/tokens` في الإصدار 2.3.1. إصدار جديد يضيف ثلاثة tokens جديدة ويعيد تسمية token موجود دون إبقاء اسم مستعار. ما الإصدار الصحيح؟
      options:
        - text: 3.0.0، لأن إعادة التسمية بلا اسم مستعار تكسر كل من يستخدم الاسم القديم.
          why: صحيح. الإضافات وحدها كانت ستعطي 2.4.0، لكن الرفع الأعلى هو الذي يفوز، والحذف major.
        - text: 2.4.0، لأن معظم التغييرات إضافات.
          why: الأغلبية لا تقرّر؛ تغيير كاسر واحد يجعل الإصدار major.
        - text: 2.3.2، لأن تغييرات الـ tokens دائمًا patches.
          why: إعادة التسمية والحذف تغيّران الـ API العام، وهذا لا يكون patch أبدًا.
