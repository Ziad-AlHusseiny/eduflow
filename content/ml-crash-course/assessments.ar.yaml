          why: تعديل العتبة بشكل أعمى يُخفي الانجراف بدل أن يفهمه.
      answer: 2
    - q: أيّ ممارسة تحميك أكثر من غيرها عند تحميل `model.joblib` في بيئة الإنتاج؟
      options:
