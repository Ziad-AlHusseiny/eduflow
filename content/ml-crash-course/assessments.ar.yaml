          why: الامتداد لا يغيّر شيئًا مما يستطيع التحميل تنفيذه.
        - text: حمّله بأحدث إصدار متاح من scikit-learn.
          why: عدم تطابق الإصدار مع إصدار التدريب قد يكسر السلوك أو يغيّره؛ ثبّت إصدار التدريب بدلًا من ذلك.
        - text: لا تحمّل إلا الملفات القادمة من مخزن النماذج الخاص بك المحكوم الصلاحيات، وبإصدار scikit-learn المسجّل وقت التدريب.
          why: صحيح. ملفات joblib قد تشغّل كودًا عند التحميل، وتثبيت الإصدار يُبقي السلوك متطابقًا.
