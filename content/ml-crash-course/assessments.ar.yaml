    - q: "الـ ROC AUC بالتحقق المتقاطع: الانحدار اللوجستي 0.807 ± 0.034، والـ gradient boosting 0.815 ± 0.055، على الطيّات نفسها. والـ boosting أبطأ وأصعب في الشرح. ما القرار القابل للدفاع عنه؟"
      options:
