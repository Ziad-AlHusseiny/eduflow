        - text: عاملهما على أنهما متعادلان وأطلق الانحدار اللوجستي، مع إعادة النظر حين تصل بيانات أكثر.
          why: صحيح. حين يتعادل الأداء ضمن هامش الضجيج، يفوز النموذج الأبسط والأرخص والأسهل في الشرح.
