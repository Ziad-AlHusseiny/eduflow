    - q: تُظهر فحوص المدخلات لنموذج انقطاع مُطلَق أن `mobile_share` ينجرف بحدّة بعد إطلاق تطبيق جديد، لكن نتائج الـ 90 يومًا لم تصل بعد. ما الاستجابة المعقولة؟
      options:
        - text: لا تفعل شيئًا حتى تُثبت النتائج أن الأداء انخفض.
          why: انتظار ربع سنة يتجاهل إنذارًا مبكرًا يمكنك التحقيق فيه الآن.
        - text: احذف `mobile_share` من النموذج فورًا.
          why: حذف feature دون دليل على أنه يضرّ قد يجعل الأمور أسوأ، ويحتاج على أي حال إلى إعادة تدريب وتحقق.
        - text: حقّق في الانزياح، وافحص نِسب العملاء المُعلَّمين في كل مجموعة، وخطّط لإعادة التدريب والفحص حين تتوفر بيانات جديدة ذات labels كافية.
          why: صحيح. الانجراف إشارة للنظر والاستعداد والتأكد، لا سبب للذعر أو التجاهل.
