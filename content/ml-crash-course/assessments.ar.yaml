      - text: املأ القيم المفقودة ورمّز الـ DataFrame كله، ثم مرّر الناتج والنموذج إلى `cross_val_score`.
        why: تعلّم الـ imputer والـ encoder من صفوف التحقق قبل إنشاء الطيّات.
      - text: املأ القيم المفقودة في بيانات التدريب والاختبار كلٍّ على حدة بوسيطاتها الخاصة.
