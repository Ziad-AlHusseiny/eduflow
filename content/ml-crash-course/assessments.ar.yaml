      - text: "`C=1` هي القيمة المثلى بوضوح ويجب توثيقها كأمر أساسي."
        why: إنها الأفضل بفارق شعرة، ضمن هامش الضجيج بوضوح.
      - text: قيمة `C` الصغيرة تقع في الـ overfitting، فتجنّبها.
        why: قيمة `C` الصغيرة تعني عقوبة أقوى، وهذه تقع في الـ underfitting إن وقعت في شيء.
      - text: النموذج معطوب، فالضبط يجب أن يغيّر النتيجة كثيرًا.
        why: المنحنى المسطّح نتيجة شائعة وصحية لنموذج محدّد جيدًا.
