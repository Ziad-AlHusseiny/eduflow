  - q: لماذا تحقق شجرة قرار مكتملة النمو عادةً نتيجة أسوأ على البيانات الجديدة من غابة عشوائية من مثل هذه الأشجار؟
    options:
      - text: لأن كل شجرة في الغابة أضحل.
        why: أشجار الغابة تُنمّى عميقة عادةً أيضًا.
      - text: لأن الغابة ترى بيانات تدريب أكثر.
        why: كل شجرة تسحب من بيانات التدريب نفسها.
      - text: لأن أخذ متوسط أشجار كثيرة ذات أخطاء مستقلة جزئيًا يُلغي جزءًا كبيرًا من تباين كل شجرة.
        why: صحيح. كل شجرة تقع في الـ overfitting بشكل مختلف؛ والمتوسط أثبت.
      - text: لأن الغابة تستخدم الـ gradient descent لضبط أشجارها.
        why: أشجار الغابة تُدرَّب مستقلة، دون gradient descent.
    answer: 2
  - q: "الانحدار اللوجستي على الانقطاع: `C=0.01` يعطي AUC بالتحقق المتقاطع 0.797، و`C=1` يعطي 0.807، و`C=100` يعطي 0.806، مع تشتّت للطيّات في حدود 0.035. ماذا تستنتج؟"
