  - q: أيّ pipeline خالٍ من التسرّب للتحقق المتقاطع لنموذج على بيانات فيها قيم مفقودة وفئات نصية؟
    options:
      - text: "`make_pipeline(ColumnTransformer([...imputer, scaler..., ...OneHotEncoder...]), model)` مُمرَّرًا إلى `cross_val_score` مع الـ DataFrame الخام."
