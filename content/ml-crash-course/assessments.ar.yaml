    - q: شغّلت k-means بـ k=5 على بيانات العملاء دون توحيد المقاييس. أحد الأعمدة الإنفاق السنوي بالدولار؛ والبقية أعداد تحت 20. ماذا ستعكس العناقيد في الغالب؟
      options:
        - text: مزيجًا متوازنًا من كل الأعمدة.
          why: تستخدم k-means المسافات الخام، فيهيمن العمود صاحب النطاق الأكبر.
        - text: أعمدة الأعداد، لأنها أكثر عددًا.
