        why: هذا يحدث بعد تاريخ التنبؤ، ومن المرجّح أن النموذج نفسه هو من أطلقه.
      - text: إجمالي المبالغ المستردّة في الربع الرابع.
        why: "الربع الرابع يقع داخل نافذة النتيجة: تسرّب للهدف."
      - text: متوسط الأيام بين الطلبات عبر تاريخ العميل حتى 30 سبتمبر.
        why: صحيح. إنه لا يستخدم إلا معلومات متاحة عند اللقطة.
    answer: 3
  - q: تحتاج إلى تجميع 50,000 تذكرة دعم نصية حرّة في موضوعات دون أي labels. أيّ نهج هو الأنسب؟
    options:
      - text: درّب انحدارًا لوجستيًا على التذاكر مع `churned` كهدف.
        why: هذا يتنبأ بالانقطاع، لا بالموضوعات، ويتجاهل ما يقوله النص.
      - text: حوّل التذاكر إلى embeddings بنموذج embedding، ثم جمّع المتّجهات بـ k-means وارسم ملامح العناقيد.
        why: صحيح. تحوّل الـ embeddings النص إلى متّجهات تلتقط المعنى؛ والعنقدة تجد المجموعات دون labels.
      - text: عُدّ الكلمات بـ TF-IDF واختر الكلمة الأكثر تكرارًا كموضوع لكل تذكرة.
        why: الكلمات المتكرّرة المفردة تفوّت إعادة الصياغة والمترادفات التي تلتقطها الـ embeddings.
      - text: أرسل التذاكر الخمسين ألفًا إلى LLM واحدة تلو الأخرى وثق بالـ labels التي يعطيها.
        why: ممكن، لكنه مكلف، وستظل بحاجة إلى عيّنة ذات labels لتتحقق منه.
    answer: 1
  - q: أيّ عبارة عن الشبكات العصبية دقيقة؟
    options:
      - text: تتفوّق دائمًا على الـ gradient boosting في البيانات الجدولية.
        why: في الجداول الصغيرة والمتوسطة، كثيرًا ما تجاريها الأشجار المعزّزة والنماذج الخطية أو تتفوّق عليها.
      - text: لا تحتاج إلى توحيد مقاييس الـ features لأنها تتعلّم features خاصة بها.
        why: المدخلات غير الموحّدة تبطّئ التدريب القائم على التدرّج وتزعزع استقراره؛ فوحّد مقاييسها.
      - text: دون دوال تنشيط غير خطية، لا يضيف تكديس الطبقات أي قدرة تعبيرية.
        why: صحيح. الطبقات الخطية تتركّب في تحويل خطي واحد.
      - text: الـ epoch تحديث واحد للأوزان.
        why: الـ epoch مرور كامل على بيانات التدريب، ويتضمّن عادةً تحديثات كثيرة.
    answer: 2
  - q: الـ recall لنموذج 0.85 في منطقة و0.65 في أخرى، مع 900 و40 عميلًا على الترتيب. ما الخطوة التالية الأكثر مسؤولية؟
    options:
      - text: استنتج أن النموذج منحاز ضد المنطقة الأصغر واستبعدها من الإطلاق.
        why: مع 40 عميلًا فقط، قد تكون الفجوة ضجيجًا؛ والتصرّف بناءً عليها بشكل أعمى قد يسبّب أضرارًا أخرى.
      - text: تجاهل الفجوة لأن المنطقة الأصغر حصة صغيرة من الإيرادات.
        why: المجموعات الصغيرة تستحق الفحص أيضًا؛ وحصة الإيرادات لا تحسم مسألة الإنصاف.
      - text: احذف المنطقة من الـ features.
        why: قد تعمل features أخرى كبدائل، وستفقد القدرة على الفحص بحسب المنطقة.
      - text: أبلِغ عن الفجوة مع درجة عدم اليقين فيها، وراقبها مع تراكم البيانات، وقرّر مع أصحاب القرار في الشركة ما إذا كانت تحتاج إلى معالجة بالعتبة أو بالبيانات.
        why: صحيح. اجعل نقطة الضعف مرئية، وحدّد مقدار الثقة، واتّخذ قرارًا مدروسًا.
    answer: 3
  - q: يُطلق نموذج انقطاع مع عروض لكل عميل مُعلَّم، فينخفض الانقطاع بين العملاء المُعلَّمين من 70% إلى 55%. ما المطلوب للادّعاء بأن النموذج والعرض هما سبب الانخفاض؟
    options:
      - text: مجموعة محجوزة عشوائيًا من العملاء المُعلَّمين لم تتلقَّ أي عرض، تُقارَن على الفترة نفسها.
        why: صحيح. لا شيء إلا المقارنة مع مجموعة ضابطة عشوائية يفصل أثر العرض عن الموسمية والحظ.
      - text: ROC AUC أعلى على الاختبار.
        why: يقيس الـ AUC جودة الترتيب، لا ما إذا كان التدخّل يغيّر السلوك.
      - text: إعادة التدريب على البيانات الجديدة.
        why: إعادة التدريب لا تقيس أثر العرض.
      - text: نافذة نتيجة أطول.
        why: النافذة الأطول تغيّر التعريف، لا غياب مجموعة المقارنة.
    answer: 0
