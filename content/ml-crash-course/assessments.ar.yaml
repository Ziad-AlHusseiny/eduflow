    - q: نموذج موافقات له نِسب اختيار متساوية لمجموعتين، لكن الـ recall 0.85 للمجموعة A و0.60 للمجموعة B. المتقدّمون في B الذين كانوا سيسدّدون يُرفضون أكثر. أيّ معيار إنصاف يُنتهك؟
      options:
        - text: الـ demographic parity (تساوي نِسب الاختيار).
          why: نِسب الاختيار متساوية هنا؛ فهذا المعيار متحقق.
        - text: الـ equal opportunity (تساوي معدّلات الإيجابيات الصحيحة).
          why: صحيح. المؤهَّلون في المجموعة B يُوافَق عليهم أقل مما في المجموعة A.
        - text: المعايرة، لأن الـ recall مقياس للمعايرة.
          why: تقيس الـ recall عدد الإيجابيات الصحيحة التي يُعثر عليها، لا ما إذا كانت الاحتمالات تطابق التكرارات.
        - text: لا شيء؛ فالإنصاف لا يتعلّق إلا بنِسب الاختيار.
          why: نِسب الاختيار تعريف واحد من عدة تعريفات؛ وهذه الحالة تبيّن لماذا لا تكفي.
