checkpoints:
  s-tj-1:
    - q: يبلّغ مستخدم أن تقسيم عشاء بقيمة $100.00 بين ثلاثة أشخاص يترك الأرصدة منحرفة بسنت واحد. أيّ اختبار تكتبه أولًا؟
      options:
        - text: اختبار Playwright يضيف العشاء في المتصفّح ويقرأ الأرصدة.
          why: سيعيد إنتاج الخطأ، لكن ببطء ومع تدخّل النظام كله؛ وحين يفشل ما زال عليك أن تجد كود التقريب.
        - text: اختبار لقطة شاشة لشاشة الأرصدة.
          why: قد تُظهر لقطة الشاشة الرقم الخاطئ لكنها لا تقول شيئًا عن الحساب الذي أنتجه، وتنكسر مع أي تغيير بصري.
        - text: نوع TypeScript أكثر صرامة لمعامل المبلغ.
          why: القيم أرقام أصلًا؛ ولا يستطيع النوع التمييز بين 3333 و3334 سنتًا.
        - text: unit test يقسّم 10000 سنت على 3 أشخاص ويتحقّق من أن مجموع الحصص يساوي 10000.
          why: صحيح. الخطأ في منطق صافٍ، فأرخص اختبار يفشل تمامًا حين يكون خاطئًا هو unit test يستغرق جزءًا من الثانية مع ثابت المجموع.
      answer: 3
    - q: |-
        بافتراض أن الاستيرادات موجودة، ماذا يحدث حين يعمل هذا الاختبار؟
        ```js
        test('formats cents', () => {
          expect(formatMoney(1234)).toEqual('$12.34');
          expect(formatMoney(5)).toBe('$0.05');
        });
        ```
      options:
        - text: "ينجح إن كانت `formatMoney` صحيحة: فـ `toEqual` يقارن القيم البدائية بقيمتها، تمامًا مثل `toBe`."
          why: صحيح. الفرق بين هذين الـ matchers لا يظهر إلا مع الكائنات والمصفوفات.
        - text: "يفشل، لأن `toEqual` لا يُستخدم إلا مع الكائنات."
          why: "يعمل `toEqual` مع أي قيمة؛ ومع النصوص يتصرّف مثل `toBe`."
        - text: "يفشل، لأن الاختبار لا يجوز أن يحتوي إلا على `expect` واحد."
          why: لا توجد قاعدة كهذه؛ سلوك واحد لكل اختبار هو التوجيه، والسطران هنا يفحصان التنسيق.
        - text: "لا يعمل إلا حين يكون `globals: true` مضبوطًا في الإعدادات."
          why: "مع الاستيراد الصريح من `vitest`، لا حاجة إلى الـ globals."
      answer: 0
    - q: 'في `package.json` لديك `"test": "vitest"`، ومهمّة GitHub Actions تشغّل `npm test`. ماذا يحدث بعد انتهاء الاختبارات في CI؟'
      options:
        - text: تعلق المهمّة في وضع المراقبة حتى تصل إلى مهلة الخادم.
          why: "هذا ما كان سيحدث لولا اكتشاف CI؛ فـ Vitest تفحص متغيّر البيئة `CI`."
        - text: "تخرج Vitest بخطأ تطلب فيه الخيار `--run`."
          why: لا تشترط Vitest هذا الخيار في CI؛ بل تختار وضع التشغيل الواحد بنفسها.
        - text: "تلاحظ Vitest متغيّر البيئة `CI`، فتعمل مرة واحدة وتخرج بالنتيجة."
          why: صحيح. وضع المراقبة لا يكون افتراضيًا إلا في طرفية محلية تفاعلية.
        - text: تتخطّى Vitest الاختبارات لأنه لا توجد طرفية متّصلة.
          why: تعمل الاختبارات بشكل طبيعي في CI؛ والمراقبة وحدها هي التي تُطفأ.
      answer: 2
    - q: |-
        يفشل اختبار بهذه المخرجات. ما الخطأ الأرجح؟
        ```text
        FAIL  src/tip.test.js > withTip > adds a 15% tip
        AssertionError: expected { tipCents: 300, totalCents: 2000 }
          to deeply equal { tipCents: 300, totalCents: 2300 }
        ```
      options:
        - text: البقشيش يُقرَّب في الاتجاه الخطأ.
          why: "قيمة `tipCents` المستلمة 300، كما هو متوقّع تمامًا، فحساب البقشيش سليم."
        - text: "يجب أن يستخدم الاختبار `toBe` بدل `toEqual`."
          why: "سيفشل `toBe` حتى مع نتيجة صحيحة، لأن الدالة تعيد كائنًا جديدًا."
        - text: النسبة تُقسم على 1000 بدل 100.
          why: عندها سيكون البقشيش 30 لا 300؛ والبقشيش في الكائن المستلم صحيح.
        - text: المجموع يُعاد دون إضافة البقشيش.
          why: "صحيح. `totalCents` يساوي المجموع الفرعي (2000)، فقد نسيت الدالة إضافة `tipCents`."
      answer: 3
    - q: في مشروعك 300 اختبار لمنطق مالي صافٍ و5 ملفات اختبار تعرض DOM. كيف تضبط البيئة؟
      options:
        - text: "اضبط `environment: 'jsdom'` على مستوى المشروع كي يستطيع كل اختبار استخدام الـ DOM."
          why: عندها تدفع الاختبارات الصافية الـ 300 كلها ثمن بناء متصفّح مزيّف، ويمرّ الاستخدام غير المقصود للـ DOM في الكود الصافي دون أن يُلاحظ.
        - text: "أبقِ بيئة Node الافتراضية وأضف `// @vitest-environment jsdom` في أعلى ملفات اختبار الـ DOM الخمسة."
          why: صحيح. فعّل الـ DOM لكل ملف على حدة حيث يُحتاج إليه، وأبقِ البقية سريعة وصادقة.
        - text: "استبدل `document` بكائن عادي في ملف إعداد."
          why: البديل المصنوع يدويًا يفوته معظم سلوك الـ DOM؛ وjsdom أو happy-dom موجودان بالضبط لتوفيره.
        - text: انقل اختبارات الـ DOM الخمسة إلى Playwright.
          why: اختبارات الـ end-to-end أبطأ بكثير؛ وسلوك الـ DOM مثل عرض قائمة يخدمه jsdom جيدًا.
      answer: 1
  s-tj-2:
    - q: يمنح Splitwise-lite اشتراكًا مميّزًا مجانيًا للمجموعات التي تنفق $50.00 (5000 سنت) أو أكثر. أيّ مدخلين يختبران القاعدة على أفضل وجه؟
      options:
        - text: 4999 و5000
          why: "صحيح. يقعان على جهتي الحدّ، وهما الزوج الوحيد الذي يميّز `>=` من `>`."
        - text: 1000 و10000
          why: كلاهما بعيد عن الحدّ، فالخطأ بفارق واحد في المقارنة ينجح فيهما معًا.
        - text: 0 و5000
          why: الصفر حالة إضافية مفيدة، لكن بدون 4999 لا تستطيع معرفة إن كان الحدّ في مكانه الصحيح.
        - text: 5000 و5001
          why: كلاهما يجب أن يستحقّ الاشتراك، فالخطأ الذي يقبل 4999 أيضًا لن يُلتقط.
      answer: 0
    - q: |-
        ما الذي يجب تغييره في هذا الاختبار؟
        ```js
        test('rejects a negative amount', async () => {
          expect(saveExpense({ description: 'Taxi', amountCents: -100 }, api))
            .rejects.toThrow('positive');
        });
        ```
      options:
        - text: لا شيء؛ إنه صحيح كما هو مكتوب.
          why: "الـ assertion من نوع `rejects` لا يُنتظَر أبدًا، فلا ينتظره الاختبار؛ وتعلّم Vitest 4 هذه الاختبارات بأنها فاشلة."
        - text: "استبدل `toThrow` بـ `toThrowError`."
          why: "هما اسمان للشيء نفسه؛ المشكلة في `await` المفقودة."
        - text: "لفّ الاستدعاء في `try/catch` وأكّد داخل `catch`."
          why: "هذا لا ينجح إلا مع `expect.assertions(1)`، وهو أثقل من انتظار `rejects`."
        - text: "ضع `await` قبل `expect(...)` كي ينتظر الاختبار الرفض."
          why: "صحيح. كل assertion من نوع `resolves` أو `rejects` يجب أن يُنتظَر بـ await."
      answer: 3
    - q: "أثناء اختبار `computeBalances`، يستبدل اختبارٌ `splitEvenly` بـ `vi.fn().mockReturnValue([500, 500])`. لاحقًا يظهر خطأ تقريب في `splitEvenly`. ماذا يحدث لذلك الاختبار؟"
      options:
        - text: "يفشل، لأن `computeBalances` تحصل الآن على حصص خاطئة."
          why: "لا تستدعي `computeBalances` الدالة `splitEvenly` الحقيقية أبدًا في ذلك الاختبار، فلا ترى الخطأ أبدًا."
        - text: "يبقى أخضر، لأن `splitEvenly` الحقيقية لا تعمل فيه أبدًا."
          why: صحيح. استخدام الـ mocks مكان كودك الصافي يُلغي بالضبط التكامل الذي كان سيلتقط هذا.
        - text: تحذّر Vitest من أن الـ mock لم يعد يطابق التطبيق الحقيقي.
          why: لا تقارن Vitest الـ mocks بالكود الحقيقي؛ فالـ mock هو ما تقول له أن يكونه.
        - text: يتعطّل الاختبار لأن الـ mocks للوحدات الداخلية غير مسموح بها.
          why: تسمح بها Vitest، ولهذا يبقى القرار لك.
      answer: 1
    - q: |-
        يفشل الصف الثاني في هذا الجدول. ما اسم الاختبار الذي تبلّغ عنه Vitest؟
        ```js
        test.each([
          { total: 1000, people: 3, first: 334 },
          { total: 1001, people: 4, first: 251 },
        ])('splits $total between $people', ({ total, people, first }) => {
          expect(splitEvenly(total, people)[0]).toBe(first);
        });
        ```
      options:
        - text: "`splits $total between $people`"
          why: "العناصر النائبة `$field` تُملأ من كائن كل صف."
        - text: "`splits 1001 between 4 (row 2)`"
          why: "لا تضيف Vitest رقم الصف ما لم تستخدم `%#` في الاسم."
        - text: "`splits 1001 between 4`"
          why: صحيح. يصبح كل صف اختبارًا مستقلًّا مع استبدال القيم، فيسمّي الفشل المدخل.
        - text: "`splits [object Object] between undefined`"
          why: "يقرأ `$total` و`$people` هاتين الخاصيتين من كائن كل صف، فتظهر القيم الحقيقية في الاسم."
      answer: 2
    - q: "تذكير مجدول بـ `setTimeout` ليُرسَل بعد 24 ساعة من إضافة مصروف. مع تفعيل `vi.useFakeTimers()`، أيّ سطر يجعل التذكير يُطلق في الاختبار؟"
      options:
        - text: "`await new Promise((r) => setTimeout(r, 86_400_000))`"
          why: "مع المؤقّتات المزيّفة يكون `setTimeout` هذا مزيّفًا أيضًا، فلا يُطلق أبدًا وتنتهي مهلة الاختبار."
        - text: "`vi.useRealTimers()`"
          why: العودة إلى المؤقّتات الحقيقية تعني انتظار يوم حقيقي.
        - text: "`vi.setSystemTime(tomorrow)`"
          why: "يحرّك الساعة التي يقرؤها `Date`، لكنه لا يشغّل المؤقّتات التي حان موعدها."
        - text: "`vi.advanceTimersByTime(24 * 60 * 60 * 1000)`"
          why: صحيح. تقديم الساعة المزيّفة يشغّل فورًا كل مؤقّت يحين موعده خلال تلك الفترة.
      answer: 3
  s-tj-3:
    - q: 'يعرض النموذج أخطاء التحقّق في `<p role="alert">Amount must be greater than zero</p>`. أيّ query هو الأنسب؟'
      options:
        - text: "`screen.getByRole('alert')`"
          why: صحيح. الدور هو ما تعلنه قارئات الشاشة، فيفشل الاختبار إن توقّف إعلان الرسالة.
        - text: "`container.querySelector('.error-text')`"
          why: الصنف تنسيق؛ وإعادة تسميته تكسر الاختبار دون أن تكسر شيئًا يراه المستخدمون.
        - text: "`screen.getByTestId('amount-error')`"
          why: الـ test ids هي الملاذ الأخير، ولا تثبت شيئًا عن طريقة وصول الرسالة إلى المستخدمين.
        - text: "`screen.getByDisplayValue('Amount must be greater than zero')`"
          why: استعلامات display value تطابق القيمة الحالية لحقول النماذج، لا نص الفقرات.
      answer: 0
    - q: |-
        يُحلّ `load` بالقيمة `{ Ben: -500 }`. يفشل هذا الاختبار بالرسالة "Unable to find an element with the text". ما الإصلاح؟
        ```jsx
        test('shows balances', () => {
          render(<BalancePanel loadBalances={load} />);
          expect(screen.getByText('Ben owes $5.00')).toBeInTheDocument();
        });
        ```
      options:
        - text: "لفّ `render` داخل `waitFor`."
          why: "يعيد `waitFor` محاولة الـ assertions؛ وتكرار الـ render داخله لا يفيد ويسبّب آثارًا جانبية."
        - text: ارفع مهلة الاختبار في Vitest.
          why: "يفشل الاختبار فورًا، لا بعد انتهاء مهلة: يفحص `getByText` مرة واحدة، قبل أن يُحلّ الـ promise."
        - text: "اجعل الاختبار `async` واستخدم `expect(await screen.findByText('Ben owes $5.00')).toBeInTheDocument()`."
          why: "صحيح. ينتظر `findByText` ظهور النص بعد تحميل البيانات."
        - text: "استخدم `screen.queryByText('Ben owes $5.00')` بدلًا من ذلك."
          why: "يفحص `queryBy` أيضًا مرة واحدة فقط؛ سيعيد `null` ويظلّ الـ assertion يفشل."
      answer: 2
    - q: "تستخدم اختبارات المكوّنات MSW مع `server.listen({ onUnhandledRequest: 'error' })`. إعادة هيكلة تغيّر عن غير قصد الـ URL في الطلب من `/groups/:id` إلى `/group/:id`. ماذا يحدث؟"
      options:
        - text: تنجح الاختبارات، لأن MSW يجيب عن كل طلب بـ 200 فارغ.
          why: لا يجيب MSW إلا عن الطلبات التي تطابق معالِجًا؛ وليس لديه استجابة نجاح شاملة.
        - text: تفشل الاختبارات، لأن الطلب لا يطابق أي معالِج، والطلبات غير المعالَجة أخطاء.
          why: صحيح. هذا الخيار يحوّل الـ URL الخاطئ إلى فشل صاخب بدل تعليق صامت أو استدعاء شبكة حقيقي.
        - text: يمرّر MSW الطلب بصمت إلى الشبكة الحقيقية.
          why: "مع `onUnhandledRequest: 'error'`، يُبلَّغ عن الطلبات غير المطابقة كأخطاء، ولا تُمرَّر بهدوء."
        - text: تتخطّى Vitest الاختبارات المتأثّرة.
          why: لا شيء يُتخطّى؛ الطلب الفاشل يظهر على شكل فشل في الاختبار.
      answer: 1
    - q: "أيّ استخدام لـ `waitFor` مناسب؟"
      options:
        - text: "`await waitFor(() => user.click(screen.getByRole('button', { name: 'Save' })))`"
          why: "النقر داخل دالة يُعاد تشغيلها قد يحدث عدة مرات؛ والتفاعلات مكانها خارج `waitFor`."
        - text: "`await waitFor(() => screen.findByText('Saved'))`"
          why: "ينتظر `findBy` أصلًا؛ ولفّه داخل `waitFor` يضاعف الانتظار ويُربك المهلة."
        - text: "`await waitFor(() => {})`"
          why: الدالة الفارغة تنجح فورًا ولا تنتظر شيئًا بعينه.
        - text: "`await waitFor(() => expect(onSave).toHaveBeenCalledTimes(1))`"
          why: صحيح. assertion لا يتعلّق بظهور عنصر، يُعاد حتى يتحقّق.
      answer: 3
    - q: 'في `ExpenseList` مربّع اختيار "Hide settled". ما أفضل اختبار له؟'
      options:
        - text: انقر مربّع الاختيار بـ user-event وأكّد أيّ عناصر القائمة ما زالت على الشاشة.
          why: صحيح. يختبر ما يراه المستخدم، ويصمد أمام أي تغيير في طريقة تخزين الـ state.
        - text: "أكّد أن `useState` استُدعي بالقيمة `false` في البداية."
          why: هذا يفحص الأجزاء الداخلية لـ React، لا السلوك؛ وقد تظلّ القائمة تُعرض بشكل خاطئ.
        - text: التقط snapshot قبل النقر وبعده.
          why: الـ snapshots تسجّل كل شيء ولا تشرح شيئًا؛ ولا يستطيع المراجعون معرفة ما الذي كان يجب أن يتغيّر.
        - text: استدعِ المكوّن كدالة وافحص الـ JSX المُعاد.
          why: استدعاء المكوّنات مباشرة يتخطّى الـ render في React وقواعد الـ hooks؛ اعرضه بالـ render بدلًا من ذلك.
      answer: 0
  s-tj-4:
    - q: 'حقل المبلغ هو `<label for="amount">Amount</label><input id="amount" name="amount" placeholder="0.00">`. أيّ locator في Playwright هو الأفضل؟'
      options:
        - text: "`page.locator('input[name=amount]')`"
          why: يعمل، لكنه يعتمد على خاصية لا يراها المستخدمون أبدًا ولا يفحص شيئًا عن التسمية.
        - text: "`page.getByPlaceholder('0.00')`"
          why: النصوص النائبة إشارة أضعف من التسميات، وكثيرًا ما تتغيّر أو تختفي.
        - text: "`page.getByLabel('Amount')`"
          why: صحيح. يجد الحقل بتسميته، بالطريقة التي يجده بها المستخدمون والتقنيات المساعدة.
        - text: "`page.locator('#amount')`"
          why: المعرّفات تفاصيل داخلية قد تتغيّر في إعادة هيكلة.
      answer: 2
    - q: يستغرق تسجيل الدخول 3 ثوانٍ. أربعون اختبارًا تحتاج إلى مستخدم مسجّل الدخول لكنها لا تغيّر الحساب أبدًا. ما أفضل نهج؟
      options:
        - text: "سجّل الدخول عبر الواجهة داخل `beforeEach`."
          why: هذا يضيف دقيقتين من تسجيلات الدخول ويُرهق خدمة المصادقة دون أي ثقة إضافية.
        - text: دع اختبارًا واحدًا يسجّل الدخول وشغّل البقية بعده في الوضع التسلسلي.
          why: الاختبارات المتسلسلة لا يمكن تشغيلها بالتوازي ولا منفردة، وفشل واحد يتتالى.
        - text: "شارك كائن `page` واحدًا بين كل الاختبارات في متغيّر على مستوى الوحدة."
          why: مشاركة الصفحة تكسر العزل؛ فقد يترك اختبار حالة تغيّر اختبارًا آخر.
        - text: سجّل الدخول مرة واحدة في setup project، واحفظ حالة التخزين، ودع الاختبارات تعيد استخدامها.
          why: صحيح. ما زال كل اختبار يحصل على سياقه الخاص، مصادَقًا عليه مسبقًا.
      answer: 3
    - q: 'في trace لاختبار فاشل، نجح النقر على "Settle up"، ولقطة الـ DOM بعده مباشرة تُظهر رسالة منبثقة "Session expired, please sign in". ما الذي تحقّق فيه أولًا؟'
      options:
        - text: إعداد المصادقة في الاختبار، مثل حالة تخزين محفوظة منتهية الصلاحية.
