    answer: 1
  - q: "الـ HPA الخاص بـ notes-api يستهدف استخدامًا للمعالج بنسبة 60% مع request للمعالج قدره 200m. أربعة Pods يبلغ متوسط كل منها 240m. كم نسخة تقريبًا سيريد الـ HPA؟"
    options:
      - text: "4، لأن الـ HPA لا يوسّع إلا حين يتجاوز الاستهلاك الـ request."
        why: "الهدف 60% من الـ request ‏(120m). و240m ضعف ذلك."
      - text: "5"
        why: "المطلوب = 4 × 240 / 120 = 8، لا 5."
      - text: "8"
        why: "صحيح. الاستهلاك 200% من الهدف البالغ 120m لكل Pod، فيضاعف الـ HPA النسخ (ضمن `maxReplicas`)."
      - text: "2، لأنه يأخذ متوسط الـ request والاستهلاك."
        why: "يوسّع الـ HPA حسب نسبة الاستهلاك إلى الهدف؛ ولا يأخذ متوسطهما."
    answer: 2
  - q: "الـ controller ‏ingress-nginx الذي كان الـ cluster لديك يستخدمه تقاعد ولم يعد يتلقّى إصلاحات أمنية. ما الاتجاه الموصى به لإعدادات توجيه HTTP الجديدة؟"
    options:
      - text: "اعرض كل خدمة بـ NodePort خاص بها."
        why: "الـ NodePorts ليست نقطة دخول عامة؛ وستخسر إنهاء TLS والتوجيه."
      - text: "أبقِ على الـ controller المتقاعد؛ ستصونه نواة Kubernetes."
        why: "التقاعد يعني لا إصدارات ولا إصلاحات أمنية."
      - text: "استبدل الـ Ingress بـ Service من نوع LoadBalancer لكل تطبيق."
        why: "يصلح لخدمة واحدة؛ لكنه مكلف ولا يمكن التوجيه فيه حسب المضيف أو المسار مع خدمات كثيرة."
      - text: "‏Gateway API: ‏Gateway يملكه فريق المنصّة، وHTTPRoutes يملكها فريق كل تطبيق."
        why: "صحيح. ‏Gateway API هو الخليفة الموصى به من المشروع، بموارد موجّهة حسب الأدوار وأدوات تنفيذ (implementations) كثيرة."
    answer: 3
  - q: "‏Pod من notes-api يُظهر `CrashLoopBackOff` و`Last State: Terminated, Exit Code: 137`. والأمر `kubectl logs --previous` يعرض سجلات طلبات عادية، ثم لا شيء. ما السبب المرجّح والحل؟"
    options:
      - text: "تجاوز الـ container حدّ ذاكرته فقُتل بسبب نفاد الذاكرة؛ تحقّق في `describe` من `OOMKilled`، ثم ارفع الحدّ أو أصلح التسرّب وضع سقفًا للـ heap في V8."
        why: "صحيح. الخروج بالرمز 137 دون مخرجات خطأ يشير إلى SIGKILL، والذاكرة هي السبب المعتاد في حلقة الانهيار."
      - text: "استثناء JavaScript أسقط العملية."
        why: "الاستثناء غير الملتقَط يطبع stack trace ويخرج بالرمز 1، لا 137."
      - text: "لا يمكن سحب الـ image."
        why: "فشل السحب لا يصل أبدًا إلى تشغيل التطبيق أو تسجيل الطلبات."
      - text: "فشل الـ readiness probe."
        why: "إخفاقات الـ readiness لا تقتل الـ containers إطلاقًا."
    answer: 0
  - q: "أي مجموعة تعطي notes-api عمليات نشر دون توقّف؟"
    options:
      - text: "استراتيجية `Recreate` مع liveness probe على `/readyz`."
        why: "‏`Recreate` يوقف كل شيء أولًا، والـ liveness probe الذي يفحص الاعتماديات يضيف عواصف إعادة تشغيل."
      - text: "لا probes، و`maxUnavailable: 25%`، وقيمة عالية لـ `terminationGracePeriodSeconds`."
        why: "دون readiness تأخذ الـ Pods الجديدة الحركة قبل أن تجهز، وتنخفض السعة أثناء الـ rollout."
      - text: "‏readiness probe، و`maxUnavailable: 0`، وتوقّف `preStop` قصير، ومعالج SIGTERM يفرّغ الطلبات الجارية."
        why: "صحيح. الـ Pods الجديدة لا تأخذ الحركة إلا حين تجهز، والسعة لا تنخفض أبدًا، والـ Pods القديمة تغادر دون إسقاط الطلبات."
      - text: "‏`replicas: 1` مع `kubectl rollout restart` بعد كل تغيير."
        why: "النسخة الواحدة تعني أن أي إعادة تشغيل توقّف للخدمة."
    answer: 2
