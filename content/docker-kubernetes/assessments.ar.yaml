checkpoints:
  s-dk-1:
    - q: "تشغّل notes-api بالأمر `docker run --memory 256m`. تحت اختبار حمل يموت الـ container ويعرض `docker ps -a` الحالة `Exited (137)`. ما الذي فرض الحدّ؟"
      options:
        - text: "الـ PID namespace، التي تضع سقفًا لما تستطيع شجرة العمليات حجزه."
          why: "الـ namespaces تتحكّم فيما تراه العملية، لا في مقدار ما تستهلكه."
        - text: "‏Node.js نفسه، الذي يقرأ `--memory` ويخرج بالرمز 137."
          why: "لا يقرأ Node خيارات Docker. الحدّ يُفرض من خارج العملية."
        - text: "حدّ ذاكرة في الـ cgroups؛ أنهى الـ OOM killer في النواة العملية بإشارة SIGKILL ‏(128 + 9 = 137)."
          why: "صحيح. الـ cgroups تفرض حدود الموارد، والقتل بسبب نفاد الذاكرة يظهر كرمز الخروج 137."
        - text: "الـ layers المخصّصة للقراءة فقط في الـ image، التي لا تتّسع لأكثر من 256 ميغابايت."
          why: "الـ layers على القرص ولا علاقة لها بمقدار الذاكرة الذي تستخدمه العملية."
      answer: 2
    - q: |
        تغيّر سطرًا واحدًا في `src/server.ts` وتعيد بناء هذه الـ image. كم يستغرق البناء تقريبًا مقارنة بإعادة بناء دون تغييرات؟
        ```dockerfile
        FROM node:24-slim
        WORKDIR /app
        COPY . .
        RUN npm ci
        RUN npm run build
        ```
      options:
        - text: "أطول بكثير، لأن `COPY . .` تُخفق في الـ cache، فتُعاد كل خطوة بعدها، بما فيها `npm ci` الكامل."
          why: "صحيح. تغيير الكود يُبطل `COPY`، والتثبيت المكلف يأتي بعدها. انسخ ملفات الحزم أولًا."
        - text: "المدة نفسها تقريبًا، لأن `npm run build` وحده يحتاج إلى الإعادة."
          why: "كان هذا سيصحّ لو ثُبّتت الاعتماديات قبل نسخ الكود. وهذا ليس الحال هنا."
        - text: "أسرع، لأن Docker يعيد استخدام مجلد `node_modules` السابق."
          why: "حالما تُخفق `COPY . .`، يُعاد `npm ci` من الصفر على الـ layer الجديدة."
        - text: "يفشل، لأن الملفات المتغيّرة لا يمكن نسخها فوق layers مخزّنة."
          why: "الملفات المتغيّرة تنتج ببساطة layer جديدة. لا شيء يفشل؛ الأمر بطيء فقط."
      answer: 0
    - q: "يعمل notes-api بـ `CMD [\"node\", \"dist/server.js\"]` ولا معالج SIGTERM فيه. ماذا يفعل `docker stop`؟"
      options:
        - text: "يخرج Node فورًا بالرمز 143، لأن الإجراء الافتراضي لـ SIGTERM هو إنهاء العملية."
          why: "هذا ما يحدث مع العملية العادية. أما في موقع PID 1 فلا يُطبَّق الإجراء الافتراضي، فتُتجاهل الإشارة."
        - text: "يعيد Docker تشغيل الـ container بدلًا من إيقافه."
          why: "الأمر `docker stop` لا يعيد التشغيل أبدًا. قد تعيد سياسة إعادة التشغيل تشغيله لاحقًا، لكن ليس كجزء من الإيقاف."
        - text: "ينهي Node الطلبات الجارية ويخرج بالرمز 0."
          why: "التفريغ الآمن لا يحدث إلا إذا عالج كودك SIGTERM. ودون معالج لا يوجد تفريغ."
        - text: "تُتجاهل الإشارة لأن Node في موقع PID 1 دون معالج، فبعد 10 ثوانٍ يرسل Docker إشارة SIGKILL ويخرج الـ container بالرمز 137."
          why: "صحيح. أضف معالج SIGTERM يغلق الخادم ومجمّع اتصالات قاعدة البيانات، فيستغرق الإيقاف أقل بكثير من ثانية."
      answer: 3
    - q: "تشغّل `docker run -d -p 3000:3000 notes-api:dev`. السجلات تقول `listening on 3000`، لكن `curl localhost:3000` من حاسوبك يحصل على `connection reset`. ما الذي تتحقّق منه أولًا؟"
      options:
        - text: "هل في الـ image سطر `EXPOSE 3000`."
          why: "التعليمة `EXPOSE` توثيق؛ والخيار `-p` نشر المنفذ أصلًا."
        - text: "هل يرتبط التطبيق بـ `127.0.0.1` داخل الـ container بدلًا من `0.0.0.0`."
          why: "صحيح. الحركة المنشورة تصل إلى واجهة الشبكة الخاصة بالـ container، والمستمع على الـ loopback وحده لا يراها أبدًا."
        - text: "هل المنفذ 3000 مفتوح في جدار الحماية على المضيف."
          why: "المنفذ المحجوب سيرفض الاتصال أو تنتهي مهلته من البداية؛ أما إعادة الضبط بعد الاتصال فتشير إلى أن لا شيء يستمع على تلك الواجهة داخل الـ container."
        - text: "هل Docker Desktop محدّث."
          why: "مشاكل الإصدارات نادرًا ما تكون السبب؛ وعنوان الاستماع متّهم أكثر شيوعًا بكثير."
      answer: 1
    - q: "أي عبارة عن الـ images والـ containers صحيحة؟"
      options:
        - text: "يحصل كل container على نسخة كاملة خاصة به من ملفات الـ image على القرص."
          why: "الـ containers تتشارك layers الـ image المخصّصة للقراءة فقط، ولا يضيف كل منها إلا layer رقيقة قابلة للكتابة."
        - text: "حذف الـ container يحذف الـ image الخاصة به أيضًا."
          why: "الـ images تبقى حتى تحذفها بـ `docker image rm` أو بعملية prune."
        - text: "يمكن تشغيل containers كثيرة من image واحدة؛ ولكل منها layer خاصة قابلة للكتابة تُحذف مع الـ container."
          why: "صحيح. ولهذا توضع البيانات التي يجب أن تبقى في volume."
        - text: "تغييرات الـ container الذي يعمل تُكتب عائدةً إلى الـ image حين يتوقّف."
          why: "الـ images غير قابلة للتغيير. التغييرات تبقى في الـ layer القابلة للكتابة في الـ container، والتي يمكن أن يلتقطها `docker commit`، لكن لا ينبغي لك فعل ذلك."
      answer: 2
  s-dk-2:
    - q: "مرحلة التشغيل في notes-api فيها `COPY --from=build /app/dist ./dist` و`COPY --from=deps /app/node_modules ./node_modules`، لكن بدء الـ container يفشل برسالة `Cannot use import statement outside a module`. ما الناقص؟"
      options:
        - text: "‏TypeScript، الذي يجب تثبيته في مرحلة التشغيل."
          why: "بيئة التشغيل تشغّل JavaScript مترجَمة. ولا حاجة إلى TypeScript إلا في مرحلة البناء."
        - text: "الملف `package.json`، الذي يخبر الحقل `\"type\": \"module\"` فيه Node بمعاملة ملفات `.js` كـ ES modules."
          why: "صحيح. انسخ `package.json` إلى مرحلة التشغيل بجوار `dist` و`node_modules`."
        - text: "المجلد `src/`، الذي يقرؤه Node عند البدء."
          why: "يشغّل Node الملف `dist/server.js`؛ ولا يقرأ مصادر TypeScript أبدًا."
        - text: "تعليمة `ENTRYPOINT`."
          why: "‏`CMD` وحدها تبدأ التطبيق. والخطأ يأتي من طريقة تحليل Node للملف، لا من طريقة تشغيله."
      answer: 1
    - q: "يشترط فريق الأمن لديكم ألا تستطيع عملية notes-api تعديل كودها حتى لو حصل مهاجم على تنفيذ كود عن بُعد. أي خيار في الـ Dockerfile يحقّق ذلك؟"
      options:
        - text: "استخدم `COPY --chown=node:node` لكل الملفات حتى يملكها التطبيق."
          why: "هذا يعطي مستخدم التطبيق صلاحية الكتابة على كوده، وهو عكس المطلوب."
        - text: "شغّل كـ root لكن ركّب نظام الملفات للقراءة فقط."
          why: "الجذر المخصّص للقراءة فقط يساعد، لكن التشغيل كـ root يُضعف كل ما عداه. اجمع بين المستخدم غير الـ root والقراءة فقط، ولا تقايض أحدهما بالآخر."
        - text: "استخدم الـ image الكاملة `node:24` حتى تتحقّق أدوات النظام من سلامة الملفات."
          why: "أدوات أكثر تعني مساحة هجوم أكبر، لا حماية."
        - text: "اترك الملفات المنسوخة مملوكة لـ root وانتقل إلى `USER node` في النهاية، فيستطيع التطبيق قراءتها لا الكتابة فيها."
          why: "صحيح. ملفات مملوكة لـ root وقابلة للقراءة من الجميع، مع مستخدم بلا صلاحيات، تعني أن الكود للقراءة فقط بالنسبة للعملية."
      answer: 3
    - q: "مهمّة في الـ CI تبني `notes-api` على runner من نوع amd64 وتنشرها على cluster من nodes ‏arm64. تفشل الـ Pods برسالة `exec format error`. ما الحل؟"
      options:
        - text: "ابنِ بـ `docker buildx build --platform linux/amd64,linux/arm64` وادفع، حتى يشير الـ tag إلى فهرس يضمّ المعماريّتين."
          why: "صحيح. كل node يسحب الـ manifest الخاص بمعماريّته من الـ tag نفسه."
        - text: "ثبّت الـ base image بالـ digest."
          why: "التثبيت بالـ digest يثبّت البايتات، لكن إن كانت تلك البايتات لـ amd64 وحدها، فلن تستطيع nodes ‏arm64 تشغيلها."
        - text: "غيّر الـ base image إلى `node:24-alpine`."
          why: "images ‏Alpine أيضًا لكل معمارية على حدة. والبناء ما زال ينتج amd64 فقط."
        - text: "أضف `imagePullPolicy: Always`."
          why: "يسحب الـ image نفسها التي لا تدعم إلا amd64 مرة أخرى."
      answer: 0
    - q: "في الـ registry لديك `notes-api:1.4.0`. إصلاح عاجل جاهز. أي tag تعطيه؟"
      options:
        - text: "‏`1.4.0` مرة أخرى، حتى لا تحتاج الـ manifests إلى تغيير."
          why: "إعادة دفع tag منشور تعني أن الـ nodes تشغّل كودًا مختلفًا تحت الاسم نفسه حسب وقت سحبها. لا تُعِد استخدامه أبدًا."
        - text: "‏`latest`، لأنه أحدث بناء."
          why: "‏`latest` مجرد اسم افتراضي؛ لا يعطي أي قابلية للتتبّع ويتغيّر من تحتك."
        - text: "‏`1.4.1` مع tag ‏`sha-<commit>`، وتحديث الـ manifest (ويفضَّل إلى الـ digest الجديد)."
          why: "صحيح. المحتوى الجديد يحصل على إصدار جديد؛ وtag الـ SHA والـ digest يجعلانه قابلًا للتتبّع ودقيقًا."
        - text: "‏`1.4.0-fixed`، مع الكتابة فوقه إن جاء إصلاح آخر."
          why: "الكتابة فوق tag لها المشكلة نفسها التي لإعادة استخدام `1.4.0`."
      answer: 2
    - q: "يُبلغ `docker scout cves` عن CVE حرجة في حزمة npm يستخدمها notes-api، ويوجد إصدار مُصلَح. ما الاستجابة الصحيحة؟"
      options:
        - text: "غيّر الـ base image إلى distroless."
          why: "‏distroless تزيل حزم نظام التشغيل، لكن حزمة npm المعرّضة في `node_modules` لديك وتُشحن في الحالتين."
        - text: "ارفع الاعتمادية إلى الإصدار المُصلَح، وأعِد البناء، وأعِد الفحص، وأبقِ بوّابة الـ CVE في الـ CI."
          why: "صحيح. الاعتمادية القابلة للإصلاح تُصلَح، والبوّابة تمنع عودتها."
        - text: "أضف الـ CVE إلى قائمة التجاهل حتى ينجح البناء."
          why: "تجاهل نتيجة حرجة قابلة للإصلاح يخفي خطرًا حقيقيًا؛ قوائم التجاهل للحالات الموثّقة التي لا يمكن الوصول إليها أو لا يمكن إصلاحها."
        - text: "أعِد البناء بـ `--no-cache` حتى يرى الماسح layers جديدة."
          why: "البناء الجديد يثبّت الإصدار المقفل نفسه ويحصل على النتيجة نفسها."
      answer: 1
  s-dk-3:
    - q: "في Compose، قيمة `DATABASE_URL` لخدمة `api` هي `postgres://notes:notes@db:5432/notes`. تعيد تسمية الخدمة من `db` إلى `postgres` وتشغّل `docker compose up -d --remove-orphans`. ماذا يحدث؟"
      options:
        - text: "لا شيء يتغيّر؛ يحتفظ Compose باسم الـ DNS القديم كاسم بديل."
          why: "أسماء الـ DNS تأتي من أسماء الخدمات الحالية. الخيار `--remove-orphans` يزيل الـ container القديم `db`، فيذهب اسمه معه. (ودون هذا الخيار يبقى الـ container اليتيم يعمل ويجيب على الاسم `db`، فيُخفي الخلل.)"
        - text: "يعيد Compose كتابة `DATABASE_URL` ليطابق."
          why: "لا يعدّل Compose قيم متغيّرات البيئة نيابة عنك أبدًا."
        - text: "يُحلّ الاسمان كلاهما، لأن الـ volume ما زال اسمه `pgdata`."
          why: "أسماء الـ volumes لا علاقة لها بـ DNS الشبكة."
        - text: "لم يعد الـ API يستطيع حلّ `db` ويفشل في الاتصال حتى تحدّث المضيف في العنوان إلى `postgres`."
          why: "صحيح. الخدمات يجد بعضها بعضًا باسم الخدمة، فيجب أن يتبع نصّ الاتصال إعادة التسمية."
      answer: 3
    - q: "تشغّل `docker compose down`، وتعدّل `db/init/002-seed.sql`، ثم تشغّل `docker compose up -d`. لا تظهر البيانات الأولية. لماذا؟"
      options:
        - text: "‏`down` حذف الـ bind mount."
          why: "الـ bind mounts تشير إلى مجلد على مضيفك؛ ولا شيء يحذفه."
        - text: "سكربتات التهيئة تعمل بترتيب معكوس."
          why: "إنها تعمل بترتيب الأسماء، وليست هذه هي المشكلة هنا."
        - text: "الـ volume ‏`pgdata` صمد بعد `down`، فقاعدة البيانات مهيّأة أصلًا وتُتخطّى سكربتات التهيئة."
          why: "صحيح. استخدم migration للتغييرات على قاعدة بيانات موجودة، أو احذف volume التطوير عن قصد بـ `down -v`."
        - text: "لا يقرأ Postgres ملفات `.sql` إلا وقت بناء الـ image."
          why: "سكربتات التهيئة تعمل عند بدء الـ container، لكن فقط على مجلد بيانات فارغ."
      answer: 2
    - q: "خدمة `migrate` تشغّل migrations المخطّط ثم تخرج. تريد ألا تبدأ `api` إلا بعد أن يصبح Postgres سليمًا وتنجح الـ migration. أي `depends_on` صحيح لـ `api`؟"
      options:
        - text: "‏`db` مع `condition: service_healthy`، و`migrate` مع `condition: service_completed_successfully`."
          why: "صحيح. الأول ينتظر الـ healthcheck؛ والثاني ينتظر خروج المهمّة بالرمز 0."
        - text: "‏`db` و`migrate` بصيغة القائمة المختصرة."
          why: "الصيغة المختصرة لا تنتظر إلا بدء الـ containers، لا الجاهزية ولا الاكتمال."
        - text: "‏`migrate` مع `condition: service_healthy`."
          why: "المهمّة التي تخرج لا تصبح سليمة أبدًا، فلن تبدأ `api` أبدًا."
        - text: "‏`db` مع `condition: service_started` و`restart: true`."
          why: "هذا ما زال لا ينتظر أن يقبل Postgres الاتصالات ولا أن تنتهي الـ migration."
      answer: 0
    - q: "ملف `.env` في مشروعك يحتوي على `POSTGRES_PASSWORD=devpass`. والملف `compose.yaml` يضبط `POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}` تحت `db.environment`. تشغّل `POSTGRES_PASSWORD=other docker compose up -d` على volume جديد. أي كلمة مرور يحصل عليها Postgres؟"
      options:
        - text: "‏`devpass`، لأن `.env` يفوز دائمًا."
          why: "في الاستبدال، المتغيّر المضبوط أصلًا في الـ shell له الأولوية على `.env`."
        - text: "‏`other`، لأن متغيّرات بيئة الـ shell لها الأولوية على `.env` في الاستبدال."
          why: "صحيح. مفيد للتجاوزات لمرة واحدة، وسبب لفحص `docker compose config` حين تفاجئك القيم."
        - text: "الاثنتان، موصولتين بفاصلة."
          why: "للمتغيّرات قيمة واحدة؛ ولا يُوصل شيء بشيء."
        - text: "ولا واحدة؛ يُخرج Compose خطأ عند تعارض القيم."
          why: "لا يوجد خطأ تعارض؛ قواعد الأولوية هي التي تقرّر."
      answer: 1
    - q: "إعداد التطوير لدى زميلك يربط المشروع كاملًا (`.:/app`) بـ bind mount داخل container الـ API على macOS. يفشل التطبيق بخطأ في وحدة أصلية (native module)، وتبدو تغييرات الملفات بطيئة. بماذا توصي؟"
      options:
        - text: "أضف `:ro` إلى الـ bind mount."
          why: "القراءة فقط لا تمنع `node_modules` المبني لـ macOS على المضيف من حجب نظيره المبني لـ Linux في الـ container."
        - text: "انتقل إلى named volume للمشروع كاملًا."
          why: "الـ named volume لن يرى تعديلاته إطلاقًا."
        - text: "شغّل `npm ci` على جهاز Mac قبل كل بدء."
          why: "هذا ما زال ينتج ملفات تنفيذية لـ macOS، لا يستطيع Linux تحميلها."
        - text: "استخدم Compose watch لمزامنة `./src` إلى الـ container وإعادة البناء عند تغيّر الـ lockfile، مع إبقاء `node_modules` داخل الـ image."
          why: "صحيح. ملفات الكود وحدها تعبر حدود الآلة الافتراضية، وتبقى الاعتماديات مبنية لـ Linux."
      answer: 3
  s-dk-4:
    - q: "تطبّق Deployment بـ 3 نسخ، ثم تحذف الـ ReplicaSet الخاص به بالأمر `kubectl delete rs notes-api-6c8f9d7b5`. ماذا يحدث؟"
      options:
        - text: "ينشئ الـ controller الخاص بالـ Deployments كائن ReplicaSet جديدًا للقالب نفسه، فينشئ هذا 3 Pods من جديد."
          why: "صحيح. ما زال الـ Deployment يصرّح بـ 3 نسخ من ذلك القالب، فيعيد الـ controller الخاص به الـ ReplicaSet المفقود."
        - text: "يُحذف الـ Deployment أيضًا، لأنه كان يملك الـ ReplicaSet."
          why: "الملكية تسري إلى الأسفل: حذف الابن لا يحذف مالكه."
        - text: "تستمر الـ Pods في العمل دون مالك إلى الأبد."
          why: "حذف الـ ReplicaSet يحذف الـ Pods الخاصة به افتراضيًا، والـ Deployment يعيد إنشاء الاثنين على أي حال."
