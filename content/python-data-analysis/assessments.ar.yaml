checkpoints:
  s-pda-1:
    - q: |-
        ماذا يطبع هذا الكود؟
        ```python
        prices = {"Desk Mat XL": 29, "Laptop Stand": 49}
        prices["Desk Mat XL"] = prices.get("Desk Mat XL", 0) + 1
        print(len(prices), prices["Desk Mat XL"])
        ```
      options:
        - text: "`2 30`"
          why: صحيح. المفتاح موجود أصلًا، فتعيد `.get()` القيمة 29، ويُضاف إليها واحد، ويبقى في القاموس مفتاحان.
        - text: "`3 30`"
          why: الإسناد إلى مفتاح موجود يحدّثه؛ ولا يضيف مُدخلًا ثانيًا بالاسم نفسه.
        - text: "`2 1`"
          why: تعيد `.get()` القيمة المخزّنة، 29، لأن المفتاح موجود. القيمة الافتراضية 0 لا تُستخدم إلا مع المفاتيح المفقودة.
        - text: خطأ `KeyError`
          why: كل مفتاح يقرؤه الكود بالأقواس المربعة موجود، و`.get()` لا تُطلق خطأً لمفتاح مفقود أصلًا.
      answer: 0
    - q: |-
        تعيد دالة كتبها زميلك `3.3333333333333335` لـ `average([10, 20, 30])` بدلًا من `20.0`. ما الخطأ؟
        ```python
        def average(values):
            total = 0
            for v in values:
                total += v
                return total / len(values)
        ```
      options:
        - text: يجب أن يبدأ `total` من 1.
          why: البدء من 1 سيجعل كل متوسط أعلى قليلًا؛ ولن يفسّر نتيجة مبنية على القيمة الأولى وحدها.
        - text: "`len(values)` تعدّ الحروف بدلًا من العناصر."
          why: الدالة `len` على قائمة تعدّ عناصرها، وهي هنا 3.
        - text: السطر `return` مُزاح داخل الحلقة، فتعود الدالة بعد إضافة القيمة الأولى.
          why: صحيح. في الدورة الأولى يكون `total` يساوي 10، فتعيد الدالة فورًا 10 / 3. إعادة `return` إلى مستوى الدالة تصلح ذلك.
        - text: لا تستطيع Python قسمة الأعداد الصحيحة، فتعيد القيمة الأولى.
          why: تقسم Python الأعداد الصحيحة بـ `/` وتعيد عددًا عشريًا.
      answer: 2
    - q: "أيّ f-string تطبع `Share: 12.5%` حين تكون `share = 0.125`؟"
      options:
        - text: '`f"Share: {share:.1f}%"`'
          why: هذه تنسّق 0.125 بمنزلة عشرية واحدة، فتعطي `0.1%`. المواصفة `f` لا تضرب في 100.
        - text: '`f"Share: {share:%}"`'
          why: "المواصفة `%` تضرب في 100، لكنها تستخدم ست منازل عشرية افتراضيًا: `12.500000%`."
        - text: '`f"Share: {share:,.2f}%"`'
          why: "هذه تطبع `0.12%`: منزلتان عشريتان من الكسر الخام."
        - text: '`f"Share: {share:.1%}"`'
          why: صحيح. المواصفة `%` تضرب في 100 وتضيف علامة النسبة المئوية؛ و`.1` تحتفظ بمنزلة عشرية واحدة.
      answer: 3
    - q: "تتوقّف حلقة تمرّ على الصفوف بالخطأ `TypeError: unsupported operand type(s) for +: 'int' and 'str'` في السطر `total = total + row[\"quantity\"]`. ما الإصلاح الأرجح؟"
      options:
        - text: أعِد تسمية `total` إلى شيء آخر.
          why: الاسم سليم؛ الخطأ يتعلّق بنوعي القيمتين اللتين تُجمعان.
        - text: 'حوّل الكمية أولًا: `total = total + int(row["quantity"])`.'
          why: صحيح. وصلت الكمية نصًا، ولا تجمع Python أبدًا نصًا مع رقم ضمنيًا.
        - text: غلّف السطر بـ `try` / `except TypeError` وتخطَّ الصف.
          why: كل الكميات وصلت نصوصًا، فسيُتخطّى كل صف ويبقى المجموع 0، دون أي رسالة خطأ تنبّهك.
        - text: ابدأ `total` بـ `""` بدلًا من 0.
          why: هذا سيلصق الكميات ببعضها كنص، فيعطي شيئًا مثل `"121"` بدلًا من رقم.
      answer: 1
    - q: "`totals = [65.0, 18.0, 72.0]`. ماذا تنتج `[t > 50 for t in totals]`؟"
      options:
        - text: "`[True, False, True]`"
          why: صحيح. التعبير الذي قبل `for` مقارنة، فيصبح كل عنصر قيمة منطقية.
        - text: "`[65.0, 72.0]`"
          why: هذا شكل التصفية، `[t for t in totals if t > 50]`، حيث يأتي الشرط بعد الـ `for`.
        - text: "`2`"
          why: العدّ يحتاج `sum(t > 50 for t in totals)`؛ والـ list comprehension تبني قائمة دائمًا.
        - text: خطأ `SyntaxError`
          why: أيّ تعبير يمكن أن يأتي قبل `for`، ومنه المقارنة.
      answer: 0
  s-pda-2:
    - q: 'بعد `orders = pd.read_csv("orders.csv")`، يُطلق `orders["order_date"].dt.month` الخطأ `AttributeError: Can only use .dt accessor with datetimelike values`. ما الإصلاح؟'
      options:
        - text: استخدم `orders["order_date"].month` بدلًا من ذلك.
          why: أجزاء التاريخ في العمود تمرّ دائمًا عبر `.dt`؛ وبدونها تحصل على `AttributeError` آخر.
        - text: رتّب العمود أولًا.
          why: ترتيب التواريخ النصية لا يغيّر نوعها.
        - text: حمّل الملف مع `parse_dates=["order_date"]` (أو حوّل بـ `pd.to_datetime`) كي يصبح العمود `datetime64`.
          why: صحيح. قُرئ العمود نصًا (`object`)، و`.dt` لا تعمل إلا على أعمدة التواريخ.
        - text: احذف الصفوف التي تواريخها مفقودة.
          why: لا توجد تواريخ مفقودة؛ المشكلة في نوع العمود.
      answer: 2
    - q: ماذا تعيد `products.loc[products["unit_price"] > 100, "name"]`؟
      options:
        - text: DataFrame بكل الأعمدة للمنتجات التي يتجاوز سعرها 100 دولار
          why: تسمية عمود واحد بعد الفاصلة تعيد ذلك العمود فقط.
        - text: Series بأسماء المنتجات التي يتجاوز سعرها 100، مفهرسة بتسميات صفوفها
          why: صحيح. القناع يختار الصفوف و`"name"` يختار عمودًا واحدًا، فتكون النتيجة Series.
        - text: "`True` أو `False` لكل منتج"
          why: هذا هو القناع نفسه، `products["unit_price"] > 100`، قبل استخدامه في الاختيار.
        - text: عدد المنتجات التي يتجاوز سعرها 100
          why: العدّ يحتاج `.sum()` على القناع أو `len()` على النتيجة.
      answer: 1
    - q: أيّ سطر يرفع سعر المنتجات النشطة بنسبة 5% ويحدّث `products` نفسه بشكل موثوق؟
      options:
        - text: '`products[products["is_active"] == 1]["unit_price"] *= 1.05`'
          why: "إسناد متسلسل: التصفية تنشئ جدولًا جديدًا، والتغيير يُطبَّق على تلك النسخة فقط."
        - text: '`products["unit_price"][products["is_active"] == 1] *= 1.05`'
          why: متسلسل أيضًا؛ ومع Copy-on-Write لا يصل أبدًا إلى `products`.
        - text: "`products.unit_price * 1.05`"
          why: هذا يحسب أسعارًا جديدة لكل منتج ثم يرمي النتيجة.
        - text: '`products.loc[products["is_active"] == 1, "unit_price"] *= 1.05`'
          why: صحيح. استدعاء واحد لـ `.loc` يسمّي الصفوف والعمود، فيحدث الإسناد على `products`.
      answer: 3
    - q: |-
        ما نتيجة `s1 + s2`؟
        ```python
        s1 = pd.Series([10, 20], index=["a", "b"])
        s2 = pd.Series([1, 2], index=["b", "c"])
        ```
      options:
        - text: "`a: NaN, b: 21, c: NaN`"
          why: صحيح. تُطابَق القيم بحسب التسمية؛ وحدها `b` موجودة في الطرفين، والتسميات الموجودة في طرف واحد تعطي `NaN`.
        - text: "`a: 11, b: 22`"
          why: هذا جمع بحسب الموقع، ولا تفعله pandas مع Series لها تسميات مختلفة.
        - text: "`a: 10, b: 21, c: 2`"
          why: النظائر المفقودة لا تُعامَل كأصفار؛ استخدم `s1.add(s2, fill_value=0)` لهذا السلوك.
        - text: خطأ `ValueError` لأن الفهرسين مختلفان
          why: تحاذي pandas الفهارس المختلفة بدلًا من إطلاق خطأ.
      answer: 0
    - q: تريد كل الطلبات التي جاءت من الويب أو من تطبيق الهاتف. أيّ تصفية هي الخيار الصحيح الأوضح؟
      options:
        - text: '`orders[orders["channel"] == "web" or orders["channel"] == "mobile_app"]`'
          why: "الكلمة `or` تحتاج True/False واحدة، فتُطلق pandas الخطأ `ValueError: The truth value of a Series is ambiguous`."
        - text: '`orders[orders["channel"] == ["web", "mobile_app"]]`'
          why: مقارنة عمود بقائمة تجري مقارنة عنصرًا بعنصر مع قائمة بطول مختلف، وهذا يُطلق خطأً.
        - text: '`orders[orders["channel"].isin(["web", "mobile_app"])]`'
          why: صحيح. تفحص `isin` كل قيمة مقابل القائمة، وتُقرأ تمامًا مثل السؤال.
        - text: '`orders.loc["web":"mobile_app"]`'
          why: هذا يقطّع تسميات الصفوف، لا قيم القنوات؛ والفهرس هنا رقم الصف.
      answer: 2
  s-pda-3:
    - q: يُحمَّل عمود كمية على هيئة `float64` ويعرض قيمًا مثل `1.0` و`2.0`. ما التفسير، وما الذي يُبقي العمود أعدادًا صحيحة؟
      options:
        - text: بعض الكميات كسور؛ قرّبها بـ `round()`.
          why: الكميات هنا أعداد صحيحة؛ النوع يأتي من الخانات الفارغة لا من الكسور.
        - text: بعض الخلايا فارغة، و`NaN` الكلاسيكية عدد عشري، و`astype("Int64")` تحتفظ بالأعداد الصحيحة مع `<NA>` للفجوات.
          why: صحيح. النوع `Int64` القابل للقيم المفقودة صُنع لهذه الحالة بالضبط.
        - text: تحمّل `read_csv` الأرقام دائمًا كأعداد عشرية؛ استخدم `astype(int)`.
          why: الأعمدة التي بلا فجوات تُحمَّل على هيئة `int64`؛ و`astype(int)` تفشل ما دامت قيم `NaN` موجودة.
        - text: الملف تالف؛ أعِد تحميله مع `keep_default_na=False`.
          why: هذا يُبقي الخانات الفارغة نصوصًا فارغة، فيتحوّل العمود كله إلى نص.
      answer: 1
    - q: 'أنتجت `pd.to_numeric(cleaned, errors="coerce")` 12 قيمة `NaN` جديدة. ماذا تفعل بعد ذلك؟'
      options:
        - text: استخدم `fillna(0)` كي تكتمل المجاميع.
          why: هذا يحوّل 12 قيمة مجهولة إلى أصفار تبدو حقيقية، ويقلّل الإيراد عن حقيقته.
        - text: احذف الصفوف الـ 12.
          why: قد تكون مبيعات حقيقية بصيغة غير متوقّعة؛ وحذفها يُضيع إيرادًا دون أن تعرف السبب.
        - text: انتقل إلى `astype(float)`، فهي أكثر صرامة.
          why: ستُطلق خطأً عند أول قيمة سيئة، وهذا يخبرك بأقل مما تخبرك به قائمة بكل القيم.
        - text: اطبع النصوص الأصلية لتلك الصفوف ووسّع قاعدة التنظيف لكل صيغة تجدها.
          why: صحيح. الإجبار على التحويل وسيلة للعثور على القيم المشكلة، والنصوص الخام تخبرك بالقاعدة الناقصة.
      answer: 3
    - q: ماذا تعيد `pd.to_datetime(["03/04/2025", "15/04/2025"], format="%d/%m/%Y")`؟
      options:
        - text: 3 أبريل 2025 و15 أبريل 2025
          why: صحيح. الصيغة تقول إن اليوم أولًا، فتُحلَّل القيمتان، والصيغة الصريحة تزيل أي تخمين.
        - text: 4 مارس 2025 وخطأ
          why: هذه قراءة الشهر أولًا، `%m/%d/%Y`، التي تفشل مع الشهر 15.
        - text: 4 مارس 2025 و15 أبريل 2025
          why: مع صيغة صريحة تُقرأ كل القيم بالطريقة نفسها؛ ولا تبدّل pandas بين قيمة وأخرى.
        - text: قيمتا `NaT`
          why: 'لا تظهر `NaT` إلا مع `errors="coerce"` للقيم غير المطابقة؛ والقيمتان مطابقتان.'
      answer: 0
    - q: دالة التنظيف لديك تحذف المكرّرات أولًا ثم تحذف المسافات من الأسماء بعد ذلك. ما الذي قد يسوء؟
      options:
        - text: لا شيء؛ ترتيب الخطوات لا يهم.
          why: اكتشاف المكرّرات يقارن القيم مقارنة دقيقة، فالترتيب مهم.
        - text: ستحذف `strip()` حروفًا من الأسماء.
          why: لا تحذف `strip()` إلا المسافات البيضاء في البداية والنهاية.
        - text: النسخ التي لا تختلف إلا بالمسافات (`"Ali Evans"` و`"Ali Evans "`) لا تُعرَف كمكرّرات، فتنجو الاثنتان.
          why: صحيح. نظّف القيم أولًا، ثم ابحث عن المكرّرات.
        - text: ستُطلق `drop_duplicates` خطأً على الأعمدة النصية.
          why: إنها تعمل على أي نوع من الأعمدة.
      answer: 2
    - q: بعد `df["country"] = df["country"].str.title()`، ما زالت `nunique()` تعرض 9 دول بدلًا من 8. ما السبب الأرجح؟
      options:
        - text: لا تعمل `title()` مع الأحرف الكبيرة مثل `EGYPT`.
          why: 'تعطي `"EGYPT".title()` القيمة `"Egypt"`؛ فحالة الأحرف تُعالَج.'
        - text: بعض القيم فيها مسافات في البداية أو النهاية، فتبقى `"  Egypt"` و`"Egypt"` مختلفتين.
          why: صحيح. يجب أن تأتي `str.strip()` قبل إصلاح حالة الأحرف (أو معه).
        - text: تعدّ `nunique()` القيم المفقودة دولةً.
          why: تتجاهل `nunique()` القيم المفقودة افتراضيًا.
        - text: تحتفظ pandas بالقيم القديمة في الذاكرة المؤقتة حتى يُعاد تحميل الملف.
          why: الإسناد يستبدل العمود فورًا؛ ولا يُخزَّن شيء مؤقتًا.
      answer: 1
  s-pda-4:
    - q: دمجت `order_items` (3,991 صفًا) دمجًا أيسر مع `returns` على `order_item_id` مع `indicator=True`. 198 صفًا قيمتها `both`. ماذا تمثّل صفوف `left_only`؟
      options:
        - text: مرتجعات ليس لها بند طلب مطابق
          why: تلك ستكون `right_only`، والربط الأيسر لا يحتفظ بها على أي حال.
        - text: بنود طلبات أُرجعت مرتين
          why: البند المُرجَع مرتين سينتج صفّي `both`، لا صف `left_only`.
        - text: صفوف فشل الدمج في معالجتها
          why: عمليات الدمج لا تفشل بصمت؛ و`left_only` نتيجة طبيعية لها معنى.
        - text: بنود الطلبات الـ 3,793 التي لم تُرجَع أبدًا
          why: صحيح. كل بند يبقى، والبنود التي ليس لها مرتجع مطابق تُعلَّم بـ `left_only`.
      answer: 3
    - q: 'تعيد `sales.pivot_table(index="channel", columns="year", values="revenue")` أرقامًا أصغر بكثير من مجاميع الإيراد. لماذا؟'
      options:
        - text: القيمة الافتراضية لـ `aggfunc` هي `"mean"`، فكل خلية هي متوسط إيراد البند، لا المجموع.
          why: صحيح. مرّر `aggfunc="sum"` للمجاميع؛ وحدّد دالة التجميع صراحةً دائمًا.
        - text: تُسقط pivot_table الطلبات الملغاة تلقائيًا.
          why: لا تصفّي أبدًا بحسب الحالة؛ إنها تجمّع ما يُعطى لها فقط.
        - text: القيم بآلاف الدولارات.
          why: لا تغيّر pandas مقياس القيم من تلقاء نفسها أبدًا.
        - text: حُذفت الصفوف التي سنواتها مفقودة.
          why: حذف بضعة صفوف لا يمكن أن يقلّص كل خلية بهذا القدر، ولا توجد سنوات مفقودة.
      answer: 0
    - q: 'تُطلق `orders.resample("ME")["revenue"].sum()` الخطأ `TypeError: Only valid with DatetimeIndex, TimedeltaIndex or PeriodIndex`. ما الإصلاح؟'
      options:
        - text: استخدم `"M"` بدلًا من `"ME"`.
          why: الاسم المستعار سليم؛ و`"M"` هي الكتابة المُهمَلة وستصطدم بالخطأ نفسه.
        - text: رتّب الطلبات بحسب التاريخ أولًا.
          why: الترتيب لا يمنح الجدول فهرسًا من نوع datetime.
        - text: ضع التواريخ في الفهرس بـ `set_index("order_date")`، أو مرّر `on="order_date"` إلى `resample`.
          why: صحيح. تحتاج resample أن تعرف أيّ قيم التواريخ توزّعها على الحاويات.
        - text: حوّل الإيراد إلى أعداد صحيحة.
          why: الخطأ يتعلّق بالفهرس، لا بالقيم التي تُجمع.
      answer: 2
    - q: يريد فريق البضائع تقسيم المنتجات بحسب السعر إلى خمس مجموعات في كل منها العدد نفسه من المنتجات. أيّ استدعاء يناسب؟
      options:
        - text: '`pd.cut(products["unit_price"], 5)`'
          why: هذا يصنع خمسة نطاقات متساوية العرض؛ ومع وجود بضعة منتجات غالية، تقع معظم العناصر في المجموعة الأولى.
        - text: '`pd.qcut(products["unit_price"], 5)`'
          why: صحيح. تقطع `qcut` عند المئينات، فتحمل كل مجموعة نحو خُمس المنتجات.
        - text: '`products["unit_price"].rank(5)`'
          why: تُرقّم `rank` الصفوف؛ ووسيطها الأول ليس عدد مجموعات.
        - text: '`products.groupby("unit_price").ngroups`'
          why: هذا يعدّ الأسعار المختلفة؛ ولا يوزّع المنتجات على مجموعات.
      answer: 1
    - q: أيّ استدعاء يعيد الإيراد لكل دولة مع `country` عمودًا عاديًا بدلًا من الفهرس؟
      options:
        - text: '`sales.groupby("country")["revenue"].sum()`'
          why: هذا يعيد Series فهرسها الدولة.
        - text: '`sales.groupby("country").sum("revenue")`'
          why: هذا يجمع كل الأعمدة الرقمية ويبقى فهرسه الدولة.
        - text: '`sales.pivot(index="country", values="revenue")`'
