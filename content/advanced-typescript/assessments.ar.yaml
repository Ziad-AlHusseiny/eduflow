checkpoints:
  s-at-1:
    - q: |-
        يخشى مراجع أن يصل رقم البطاقة إلى `saveAddress`. ما الصحيح؟
        ```ts
        type Address = { line1: string; city: string };
        function saveAddress(a: Address) { /* sends a to the address service */ }
        const form = { line1: '12 Nile St', city: 'Cairo', cardNumber: '4242 4242 4242 4242' };
        saveAddress(form);
        ```
      options:
        - text: يفشل في الترجمة، لأن `cardNumber` خاصية زائدة.
          why: فحوص الخصائص الزائدة لا تنطبق إلا على الكائنات الحرفية الطازجة. و`form` متغيّر، فالحقل الإضافي مسموح.
        - text: يُزيل TypeScript الحقل `cardNumber` قبل الاستدعاء، لأن `Address` لا يعلنه.
          why: تُمحى الأنواع؛ لا تضيف خصائص ولا تُزيلها وقت التشغيل أبدًا.
        - text: لا يمرّ في الترجمة إلا إذا كتبت `form as Address`.
          why: لا حاجة إلى تأكيد. التنميط البنيوي يقبل `form` أصلًا، وهذا بالضبط مصدر الخطر.
        - text: يمرّ في الترجمة، ويُمرَّر الكائن كله وقت التشغيل بما فيه رقم البطاقة؛ انسخ الحقول التي تحتاجها صراحة.
          why: صحيح. التنميط البنيوي يسمح بالخصائص الإضافية، فالإصلاح الآمن الوحيد بناء كائن جديد فيه `line1` و`city`.
      answer: 3
    - q: |-
        قيمة `quantityInStock` هي `null` أثناء فحص المخزون، و`0` حين ينفد المنتج. أيّ تغيير يجعل هذه التسمية صحيحة؟
        ```ts
        function stockLabel(quantityInStock: number | null): string {
          if (!quantityInStock) return 'Checking stock…';
          return quantityInStock === 0 ? 'Sold out' : `${quantityInStock} left`;
        }
        ```
      options:
        - text: استبدل `!quantityInStock` بـ `quantityInStock === null`.
          why: صحيح. فحص الصدقية يلتقط `0` أيضًا، فلا يمكن الوصول إلى 'Sold out'. والمقارنة مع `null` تفصل بين المعنيين.
        - text: أضف `if (typeof quantityInStock === 'number')` بعد السطر الأول.
          why: بعد السطر الأول تكون `0` قد أعادت 'Checking stock…'؛ ولا يستطيع فحص لاحق إنقاذها.
        - text: اكتب `quantityInStock!` في المقارنة.
          why: تأكيد عدم الفراغ يغيّر النوع فقط، لا مسار التنفيذ. وتبقى `0` تأخذ الفرع الأول.
        - text: "احذف نوع الإرجاع `: string` كي يستنتجه TypeScript."
          why: نوع الإرجاع ليس المشكلة؛ فحص الصدقية هو المشكلة.
      answer: 0
    - q: يضيف Cartwheel المدفوعات. الدفعة المعلّقة ليس لها معرّف تحصيل؛ والمحصَّلة لها دائمًا `captureId`؛ والمستردّة لها دائمًا `captureId` و`refundedAt` و`refundCents`. أيّ نوع يجعل التركيبات المستحيلة تفشل في الترجمة؟
      options:
        - text: "`{ status: 'pending' | 'captured' | 'refunded'; captureId?: string; refundedAt?: string; refundCents?: number }`"
          why: الحقول الاختيارية مستقلة عن `status`، فما زالت الدفعة المستردّة دون `refundCents` تمرّ في الترجمة.
        - text: "`{ status: string; details: Record<string, unknown> }`"
          why: هذا يقبل أي حالة وأي تفاصيل، فلا يمنع شيئًا ويفرض التحويلات في كل مكان.
        - text: union من ثلاثة أنواع كائنات، لكلٍّ منها `status` حرفي والحقول التي تملكها تلك الحالة بالضبط، وكلها إلزامية.
          why: صحيح. كل شكل يحمل بياناته الإلزامية، و`status` الحرفي يتيح للـ narrowing إيجاد الشكل الصحيح.
        - text: "`Partial<{ status: string; captureId: string; refundedAt: string; refundCents: number }>`"
          why: جعل كل حقل اختياريًا يسمح بحالات مستحيلة أكثر حتى من الأصل.
      answer: 2
    - q: |-
        ما هو `ShippingMethod`؟
        ```ts
        const SHIPPING_FEES = { standard: 499, express: 1299 } satisfies Record<string, number>;
        type ShippingMethod = keyof typeof SHIPPING_FEES;
        ```
      options:
        - text: "`string`، لأن الكائن فُحص مقابل `Record<string, number>`"
          why: هذا ما سيعطيك إياه التعليق النوعي. أما `satisfies` فتفحص الكائن وتحتفظ بنوعه المستنتَج.
        - text: "`'standard' | 'express'`"
          why: صحيح. النوع المستنتَج فيه المفتاحان المكتوبان بالضبط، فتعطي `keyof` اسميهما الحرفيين.
        - text: "`number`، نوع القيم"
          why: "`keyof` تعطي أسماء الخصائص لا القيم؛ أما القيم فستكون `(typeof SHIPPING_FEES)[ShippingMethod]`."
        - text: "`'standard' | 'express' | string`"
          why: لا يوجد index signature في النوع المستنتَج، فليس `string` جزءًا من union المفاتيح.
      answer: 1
    - q: في `switch (order.status)` حالة `case 'canceled':` بحرف L واحد، ولا تتطابق أبدًا. أيّ تغيير يحوّل هذا الخطأ الإملائي إلى خطأ ترجمة؟
      options:
        - text: أضف فرع `default:` يسجّل الحالات المجهولة.
          why: هذا يساعد وقت التشغيل، لكن الـ compiler ما زال يقبل الحالة المكتوبة خطأً.
        - text: علّق `order` بنوع `any` كي يفحص TypeScript كل حالة.
          why: "`any` تُطفئ الفحص؛ ستُخفي الخطأ الإملائي أكثر."
        - text: أعِد كتابة الـ `switch` كسلسلة `if`/`else`.
          why: مع `status` من نوع `string`، تمرّ `=== 'canceled'` في الترجمة بالسرور نفسه الذي تمرّ به الـ `case`.
        - text: حدّد نوع `status` كـ union من الحالات الحرفية الخمس بدل `string`.
          why: صحيح. مقابل union حرفي، يُبلَّغ عن `case 'canceled':` بأنها غير قابلة للمقارنة مع `OrderStatus`.
      answer: 3
  s-at-2:
    - q: أيّ توقيع يجعل `firstWhere(orders, (o) => o.status === 'shipped')` تُعيد `Order | undefined`، و`firstWhere(products, …)` تُعيد `Product | undefined`، مع تحديد نوع `o` في الـ callback؟
      options:
        - text: "`function firstWhere<T>(items: T[], predicate: (item: T) => boolean): T | undefined`"
          why: صحيح. يُستنتج `T` من `items`، ثم يعطي الـ callback نوع معامله ويعطي النتيجة نوعها.
        - text: "`function firstWhere(items: unknown[], predicate: (item: unknown) => boolean): unknown`"
          why: دون معامل نوع، يكون `o` في الـ callback من نوع `unknown` وكذلك النتيجة؛ وسيضطر المستدعون إلى التحويل.
        - text: "`function firstWhere<T>(items: unknown[], predicate: (item: T) => boolean): T | undefined`"
          why: "لم يعد لـ `T` موقع استنتاج سوى الـ callback غير المعلَّق، فينتهي به الأمر `unknown`."
        - text: "`function firstWhere(items: any[], predicate: (item: any) => boolean): any`"
          why: هذا يمرّ في الترجمة في كل مكان ولا يفحص شيئًا؛ الأخطاء الإملائية في الـ callback تمرّ دون أن يلاحظها أحد.
      answer: 0
    - q: |-
        ما نوع `t.value`؟
        ```ts
        function tag<T>(value: T) {
          return { value };
        }
        const t = tag('shipped');
        ```
      options:
        - text: "`'shipped'`"
          why: كانت القيمة الحرفية ستنجو لو كان `T` مقيَّدًا بـ `string` أو معرَّفًا بـ `const`. هنا هي متداخلة في كائن فتتّسع.
        - text: "`unknown`"
          why: وجد TypeScript مرشّحًا، الوسيط النصي، فلا يلجأ إلى `unknown`.
        - text: "`any`"
          why: الـ inference لا ينتج `any` أبدًا من وسيط نصي حرفي.
        - text: "`string`"
          why: صحيح. `T` غير مقيَّد ويظهر داخل الكائن المُعاد، فيتّسع المرشّح الحرفي.
      answer: 3
    - q: "يجب أن تُرفض `setDefault(['standard', 'express'], 'overnight')` لأن `'overnight'` ليست أحد الخيارات. أيّ توقيع يفعل ذلك؟"
      options:
        - text: "`function setDefault<const T>(options: T[], fallback: T)`"
          why: "ما زال `fallback` موقع استنتاج، فتُضاف `'overnight'` إلى `T` بدل أن تُفحص."
        - text: "`function setDefault<T extends string>(options: T[], fallback: T)`"
          why: القيد يحتفظ بالقيم الحرفية، لكن `fallback` ما زال يساهم بمرشّح، فيكبر `T` ليشمل `'overnight'`.
        - text: "`function setDefault<T extends string>(options: T[], fallback: NoInfer<T>)`"
          why: صحيح. القيد يُبقي الخيارات حرفية، و`NoInfer` تجعل `fallback` للفحص فقط.
        - text: "`function setDefault<T>(options: T[], fallback: NoInfer<T>)`"
          why: دون قيد أولي، تُستنتج المصفوفة على أنها `string[]`، فيجتاز أي نص الفحص.
      answer: 2
    - q: مستدعو عميل Cartwheel يكتبون `api.get<Order>('/orders/1042')` في كل مكان، وفي الأسبوع الماضي كتب أحدهم `api.get<Order[]>('/orders/1042')`. ما الإصلاح الأفضل؟
      options:
        - text: اجعل العميل مفهرسًا بنوع خريطة مسارات، فيُبحث عن نوع الاستجابة من المسار ولا يمرّر المستدعون أي وسيط نوع.
          why: صحيح. يصبح المسار موقع الاستنتاج الوحيد، ولا يعود نوع الاستجابة الخاطئ شيئًا يستطيع المستدعي كتابته.
        - text: أضف قاعدة ESLint تتطلّب وسيط نوع في كل استدعاء لـ `get`.
          why: هذا يفرض كتابة وسيط نوع، لا كتابة الصحيح منه؛ والخطأ كان وسيط نوع خاطئًا.
        - text: غيّر معامل النوع الافتراضي لـ `get` إلى `any`.
          why: هذا يُزيل ما تبقّى من فحص ويجعل الاستخدام الخاطئ أكثر صمتًا.
        - text: اجعل `get` تُعيد `unknown` ودع كل مستدعٍ يحوّل بـ `as`.
          why: هذا ينقل الادّعاء غير المفحوص نفسه إلى `as` في كل موضع استدعاء؛ إنه أأمن من `any` لكنه ليس إصلاحًا.
      answer: 0
    - q: "تُستدعى `function useQuery<TData, TKey extends string>(key: TKey, fetcher: () => Promise<TData>)` هكذا `useQuery<Order>('order-1042', loadOrder)` فتفشل مع \"Expected 2 type arguments, but got 1\". ما الإصلاح الأفضل في موضع الاستدعاء؟"
      options:
        - text: اكتب `useQuery<Order, string>(…)` في كل مكان.
          why: يمرّ في الترجمة، لكن المفتاح يفقد نوعه الحرفي ويصبح كل موضع استدعاء أكثر ضجيجًا.
        - text: احذف `<Order>` ودع معاملَي النوع يُستنتجان، `TData` من نوع إرجاع `loadOrder`.
          why: صحيح. وسائط النوع الصريحة إمّا كلها أو لا شيء؛ ودون أيٍّ منها يستنتج TypeScript الاثنين من الوسائط.
        - text: غلّف المفتاح بـ `NoInfer`.
          why: "`NoInfer` تتحكّم في مواقع الاستنتاج؛ لا تجعل وسائط النوع الصريحة جزئية."
        - text: حوّل نتيجة الاستدعاء إلى `any`.
          why: الخطأ يتعلّق بوسائط النوع في الاستدعاء، ولا يستطيع تحويل على النتيجة إصلاحه.
      answer: 1
  s-at-3:
    - q: |-
        ما هو `F`؟
        ```ts
        type Flags<T> = { [K in keyof T as T[K] extends boolean ? K : never]: T[K] };
        type F = Flags<{ giftWrap: boolean; note: string; express: boolean }>;
        ```
      options:
        - text: "`{ giftWrap: boolean; note: never; express: boolean }`"
          why: تحويل مفتاح إلى `never` في جملة `as` يُزيله كليًا؛ لا يُبقيه بنوع `never`.
        - text: "`'giftWrap' | 'express'`"
          why: هذه ستكون نتيجة فهرسة الـ mapped type بـ `[keyof T]`. أما هذا النوع فيحتفظ بشكل الكائن.
        - text: "`{ note: string }`"
          why: الشرط يُبقي الخصائص من نوع boolean ويُسقط الباقي، لا العكس.
        - text: "`{ giftWrap: boolean; express: boolean }`"
          why: صحيح. جملة `as` ترسل المفاتيح التي ليست قيمها boolean إلى `never`، فتُسقط من النتيجة.
      answer: 3
    - q: |-
        ما هو `X`؟
        ```ts
        type IdOf<T> = T extends { id: infer I } ? I : never;
        type X = IdOf<{ id: number } | { id: string } | { name: string }>;
        ```
      options:
        - text: "`number | string`"
          why: "صحيح. يتوزّع الشرط على الـ union: عضوان يلتقطان نوع `id` لديهما، والثالث يصبح `never` ويختفي."
        - text: "`never`، لأن الـ union ككل ليس فيه `id` مشترك"
          why: هذه ستكون النتيجة غير التوزيعية. معامل النوع المجرّد يجعل الفحص يُنفَّذ لكل عضو.
        - text: "`number`، من العضو الأول فقط"
          why: كل عضو يُعالَج، وتُجمع النتائج.
        - text: "`unknown`، لأن `infer` لا تستطيع الالتقاط من union"
          why: "`infer` تعمل لكل عضو بعد التوزيع، فيكون كل التقاط دقيقًا."
      answer: 0
    - q: ما هو `` `on${Capitalize<'shipped' | 'cancelled'>}` ``؟
      options:
        - text: "`'onshipped' | 'oncancelled'`"
          why: "`Capitalize` تكبّر الحرف الأول من كل عضو قبل أن يُضمّ إلى `on`."
        - text: "`` `on${string}` ``"
          why: مع أعضاء حرفية في الداخل، يتوسّع القالب إلى نصوص محدّدة بدل نمط.
        - text: "`'onShipped' | 'onCancelled'`"
          why: صحيح. يتوزّع الـ union عبر القالب، ويُكبَّر الحرف الأول من كل عضو.
        - text: "`'onShipped | Cancelled'`"
          why: الـ unions لا تُضمّ في نص واحد؛ كل عضو ينتج نصه الحرفي الخاص.
      answer: 2
    - q: |-
        ما هو `Draft<{ readonly id: number; status: string }>`؟
        ```ts
        type Draft<T> = { -readonly [K in keyof T]?: T[K] };
        ```
      options:
        - text: "`{ readonly id: number; status: string }`، دون تغيير"
          why: المعدِّلان `-readonly` و`?` يغيّران الخاصيتين كلتيهما.
        - text: "`{ id: number; status: string }`"
          why: "تُطبَّق `-readonly`، لكن `?` تجعل أيضًا كل خاصية اختيارية."
        - text: "`{ readonly id?: number; status?: string }`"
          why: البادئة `-` تُزيل `readonly` من `id`؛ ولا يُضاف إلا معدِّل الاختيارية.
        - text: "`{ id?: number; status?: string }`"
          why: صحيح. `-readonly` تنزع معدِّل القراءة فقط و`?` تجعل كل خاصية اختيارية.
      answer: 3
    - q: |-
        ما هو `ElementOf<readonly string[]>`؟
        ```ts
        type ElementOf<T> = T extends (infer E)[] ? E : T;
        ```
      options:
        - text: "`string`"
          why: المصفوفة `readonly string[]` غير قابلة للإسناد إلى النمط القابل للتعديل `(infer E)[]`، فلا يُؤخذ الفرع الصادق.
        - text: "`readonly string[]`"
          why: صحيح. المصفوفات للقراءة فقط تفتقد methods التعديل، فلا تطابق نمط مصفوفة قابلة للتعديل؛ استخدم `readonly (infer E)[]` في النمط.
        - text: "`never`"
          why: الفرع الكاذب يُعيد `T` نفسه، لا `never`.
        - text: "`unknown`"
          why: لا شيء هنا ينتج `unknown`؛ النمط ببساطة لا يطابق.
      answer: 1
  s-at-4:
    - q: |-
        ما الخطأ في هذا الكود؟
        ```ts
        const id = JSON.parse(body).orderId as OrderId;
        cancelOrder(id);
        ```
      options:
        - text: لا شيء؛ يُفحص الوسم حين تُنفَّذ `cancelOrder`.
          why: الوسوم لا وجود لها وقت التشغيل، فلا شيء يفحص أي شيء حين تُنفَّذ الدالة.
        - text: "`JSON.parse` تُعيد نصًا دائمًا، فيكون `orderId` نصًا."
          why: "`JSON.parse` تُعيد ما يحتويه JSON أيًّا كان؛ والمشكلة هنا هي التحويل غير المفحوص."
        - text: التحويل يسِم قيمة لم يتحقّق منها أحد؛ حلّلها بالمُنشئ الذكي، مثل `toOrderId(…)`، بدلًا من ذلك.
          why: صحيح. الوسم لا معنى له إلا حين يُطبَّق بعد التحقّق، في مكان واحد.
        - text: الـ branded types لا يمكن استخدامها مع قيم أتت من JSON.
          why: يمكن ذلك، ما دامت قيمة JSON تمرّ بمُنشئ متحقِّق أولًا.
      answer: 2
    - q: "مستدعٍ لـ `charge(): Result<Receipt, PaymentError>` يكتب `if (result.error) showError(result.error)`. ماذا يحدث؟"
      options:
        - text: لا يمرّ في الترجمة، لأن `error` لا توجد إلا في عضو الإخفاق؛ افحص `result.ok` أولًا.
          why: صحيح. الوصول إلى خاصية في union يتطلّب وجودها في كل عضو، فتضيّق النوع بالمميِّز.
        - text: يمرّ في الترجمة ويعمل، لأن `error` تكون `undefined` عند النجاح.
          why: عضو النجاح لا يعلن `error` إطلاقًا، فيرفض TypeScript قراءتها قبل التضييق.
        - text: يمرّ في الترجمة، لكن الشرط كاذب دائمًا.
          why: لا يمرّ في الترجمة أصلًا.
        - text: يرمي خطأً وقت التشغيل حين تكون النتيجة نجاحًا.
          why: قراءة خاصية غائبة تعطي `undefined` في JavaScript، لكن TypeScript يوقف الكود قبل أن يُنفَّذ أصلًا.
      answer: 0
    - q: يعرض خادم Cartwheel السلة الأولية في الصفحة كـ JSON. البيانات السيئة هناك تعني نشرًا معطوبًا، لا شيئًا يستطيع العميل إصلاحه. كيف يجب أن يتعامل العميل معها؟
      options:
        - text: type predicate داخل `if`، مع الرجوع إلى سلة فارغة حين يفشل.
          why: عرض سلة فارغة بصمت يُخفي خطأ النشر عن الجميع، بما في ذلك أدوات المراقبة لديك.
        - text: "`const cart = JSON.parse(text) as Cart`."
          why: التحويل غير المفحوص يجعل النشر المعطوب يظهر كأخطاء مربكة بعيدة عن السبب.
        - text: محلّل يُعيد `Result`، مع إعادة المحاولة حين يفشل.
          why: إعادة المحاولة لا تُصلح بيانات عرضها الخادم خطأً؛ هذا ليس إخفاقًا متوقَّعًا قابلًا للتعافي.
