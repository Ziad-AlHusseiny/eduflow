      - text: "`checkoutPage.js`، نقطة الدخول التي تستورد 30 وحدة أخرى"
        why: إن حُوّل أولًا فسيستورد كودًا بلا أنواع وينتهي ممتلئًا بـ `any`.
      - text: "`money.js`، الذي يستورده 40 ملفًا ولا يستورد شيئًا داخليًا"
        why: صحيح. إنه ورقة، فيمكن تحديد أنواعه بالكامل اليوم، ويستفيد فورًا كل ملف يستورده.
      - text: أكبر ملف في المستودع، للتخلّص منه
        why: الحجم لا يقول شيئًا عن الاعتماديات؛ والملف الكبير الذي يستورد كودًا بلا أنواع يكسب القليل.
      - text: آخر ملف تغيّر
        why: الحداثة لا تخبرك إن كانت اعتمادياته قد حُدّدت أنواعها بعد.
    answer: 1
