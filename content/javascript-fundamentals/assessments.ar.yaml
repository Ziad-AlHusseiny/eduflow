checkpoints:
  s-js-1:
    - q: |-
        ماذا يطبع هذا الكود؟
        ```js
        let total = "0";
        total = total + 450;
        total = total + 1220;
        console.log(total);
        ```
      options:
        - text: "`1670`"
          why: 'هذا يحتاج إلى أرقام في الطرفين. يبدأ `total` نصًا هو "0"، لذلك تلصق كل `+` النصوص بدلًا من أن تجمع.'
        - text: '`"1670"`'
          why: 'لا تحدث أي عملية جمع هنا. فـ `+` مع نص في أحد طرفيها تلصق الأجزاء نصًا.'
        - text: "`NaN`"
          why: 'تأتي `NaN` من عملية حسابية تفشل. ولصق النصوص لا يفشل أبدًا، فلا تظهر `NaN`.'
        - text: "`04501220`"
          why: 'صحيح. "0" + 450 تساوي "0450"، و"0450" + 1220 تساوي "04501220". ابدأ المجموع بالرقم 0.'
      answer: 3
    - q: '`const count = 0;` ثم لاحقًا `count++;` يرمي `TypeError: Assignment to constant variable.` ما الإصلاح الصحيح؟'
      options:
        - text: 'صرّح به بـ `var` كي يعمل في كل مكان.'
          why: '`var` ستعمل، لكنها تجلب معها قواعد نطاق مربكة. و`let` هي الطريقة الحديثة للسماح بإعادة الإسناد.'
        - text: 'صرّح به بـ `let count = 0;` لأن القيمة يجب أن تتغيّر.'
          why: 'صحيح. `let` موجودة للأسماء التي يُعاد إسنادها؛ و`const` للأسماء التي لا يُعاد إسنادها أبدًا.'
        - text: 'استبدل `count++` بـ `count = count + 1`.'
          why: 'هذه أيضًا إعادة إسناد، فترفضها `const` بالطريقة نفسها تمامًا.'
        - text: 'ضع الزيادة بين قوسين: `(count)++`.'
          why: الأقواس لا تغيّر ما تفعله التعليمة. إنها ما زالت تحاول إعادة إسناد ثابت.
      answer: 1
    - q: 'تعرض صفحة الدفع "Total does not match" لأن `subtotal === 0.3` تساوي false بعد جمع `0.1` و`0.2`. ما أفضل إصلاح لتطبيق مالي؟'
      options:
        - text: 'قارن باستخدام `==` بدلًا من `===`.'
          why: '`==` لا تضيف إلا تحويل الأنواع. والطرفان رقمان أصلًا، وهما مختلفان فعلًا بفارق ضئيل.'
        - text: 'قارن `subtotal.toFixed(2) === 0.3`.'
          why: '`toFixed` تُرجع نصًا، والنص لا يساوي الرقم مساواةً صارمة أبدًا، لذلك تكون النتيجة false دائمًا.'
        - text: 'خزّن كل مبلغ سنتاتٍ صحيحة (integers)، فتصبح `10 + 20 === 30` صحيحة بالضبط.'
          why: صحيح. الحساب بالأعداد الصحيحة دقيق، فلا تنحرف المجاميع أبدًا. ولا تحوّل إلى الدولار إلا عند العرض.
        - text: 'استدعِ `parseFloat(subtotal)` قبل المقارنة.'
          why: '`subtotal` رقم أصلًا. وتحليله لا يغيّر شيئًا في خطأ التقريب الثنائي الضئيل.'
      answer: 2
    - q: |-
        ماذا يطبع هذا الكود؟
        ```js
        const label = "  Rent ";
        const clean = label.trim().toLowerCase();
        console.log(label.length, clean);
        ```
      options:
        - text: "`7 rent`"
          why: 'صحيح. دوال النصوص تُرجع نصوصًا جديدة، فيحتفظ `label` بحروفه السبعة، بما فيها المسافات، وتكون `clean` هي "rent".'
        - text: "`4 rent`"
          why: '`trim()` لم تغيّر `label`؛ بل أرجعت نصًا جديدًا خُزّن في `clean`. وما زال `label` بمسافاته.'
        - text: "`7 Rent`"
          why: '`clean` تأتي من `toLowerCase()`، لذلك حرفها الأول صغير.'
        - text: "`4 Rent`"
          why: 'لا جزء منهما صحيح: `label` لم يُمسّ (7 حروف) و`clean` حُوّلت إلى أحرف صغيرة.'
      answer: 0
    - q: 'مع `const cents = 1250;` و`const item = "lunch";`، أيّ تعبير يُنتج بالضبط `Spent $12.50 on lunch`؟'
      options:
        - text: '`"Spent $" + cents / 100 + " on " + item`'
          why: 'الأرقام تُسقط الأصفار في آخرها حين تتحوّل إلى نص، لذلك يعطي هذا "Spent $12.5 on lunch".'
        - text: "`` `Spent ${cents / 100} on ${item}` ``"
          why: هذا ينقصه رمز الدولار، ومثل الخيار الأول، يعرض 12.5 بدلًا من 12.50.
        - text: "`'Spent $${(cents / 100).toFixed(2)} on ${item}'`"
          why: 'العلامات المفردة تصنع نصًا عاديًا، فتُطبع أجزاء `${...}` حرفيًا بدلًا من أن تُملأ.'
        - text: "`` `Spent $${(cents / 100).toFixed(2)} on ${item}` ``"
          why: 'صحيح. علامات backtick تصنع template literal، و`$` الأولى حرف عادي، و`toFixed(2)` تحافظ على منزلتين عشريتين.'
      answer: 3
  s-js-2:
    - q: |-
        ماذا يطبع هذا الكود؟
        ```js
        function sizeLabel(amount) {
          if (amount > 100) return "big";
          if (amount > 1000) return "huge";
          return "small";
        }
        console.log(sizeLabel(5000));
        ```
      options:
        - text: "`huge`"
          why: 'أول `if` تطابق 5000 أصلًا وتُرجع، فلا يُوصل أبدًا إلى فحص "huge". ضع الفحص الأضيق أولًا.'
        - text: "`small`"
          why: 'لا تُرجَع `small` إلا حين لا يكون أيّ الشرطين صحيحًا، لكن 5000 أكبر من 100.'
        - text: "`big`"
          why: 'صحيح، وهذا خطأ برمجي: `return` تُنهي الدالة عند أول شرط صحيح، لذلك ترتيب الفحوص مهم.'
        - text: "`undefined`"
          why: 'كل مسار في الدالة يُرجع نصًا، لذلك لا تكون النتيجة `undefined` أبدًا.'
      answer: 2
    - q: 'تعرض دالة "No note" حين يكون `if (note)` خاطئًا. أيّ هذه الملاحظات تُعامَل على أنها مفقودة؟'
      options:
        - text: '`"0"`'
          why: النص غير الفارغ truthy، حتى لو كان يحتوي على حرف الصفر.
        - text: '`" "` (مسافة واحدة)'
          why: المسافة حرف، لذلك النص ليس فارغًا ويُعدّ truthy.
        - text: '`"false"`'
          why: 'هذا نص من خمسة حروف، لا القيمة المنطقية `false`، لذلك هو truthy.'
        - text: '`""` (نص فارغ)'
          why: صحيح. النص الفارغ إحدى القيم الثماني الـ falsy.
      answer: 3
    - q: |-
        ماذا يطبع هذا الكود؟
        ```js
        let count = 0;
        for (let i = 0; i < 5; i++) {
          if (i === 3) break;
          count++;
        }
        console.log(count);
        ```
      options:
        - text: "`3`"
          why: 'صحيح. الدورات التي تكون فيها `i` تساوي 0 و1 و2 تزيد `count`؛ وحين تكون `i` تساوي 3، تُنهي `break` الحلقة قبل أن تُنفَّذ `count++`.'
        - text: "`4`"
          why: '`break` تُنفَّذ قبل `count++` في الدورة التي تكون فيها `i` تساوي 3، لذلك لا تُحتسب تلك الدورة.'
        - text: "`5`"
          why: 'هذا صحيح لو لم توجد `break`. لكن الحلقة تتوقّف مبكرًا.'
        - text: "`2`"
          why: 'الدورة التي تكون فيها `i` تساوي 0 تُحتسب أيضًا، لذلك تكتمل ثلاث دورات قبل `break`.'
      answer: 0
    - q: |-
        ماذا يطبع هذا الكود؟
        ```js
        const add = (a, b = 10) => a + b;
        console.log(add(5), add(5, 0), add(5, null));
        ```
      options:
        - text: "`15 15 15`"
          why: 'القيمة الافتراضية لا تُطبَّق إلا حين يكون الوسيط مفقودًا أو `undefined`. أما 0 و`null` فوسائط حقيقية.'
        - text: "`15 5 5`"
          why: 'صحيح. الاستدعاء الأول وحده يستخدم القيمة الافتراضية. وفي الاستدعاء الأخير تُستخدم `null`، وفي العمليات الحسابية تتحوّل إلى 0.'
        - text: "`15 5 15`"
          why: 'تمرير `null` لا يُفعّل القيمة الافتراضية؛ وحدها `undefined` تفعل ذلك.'
        - text: "`15 15 5`"
          why: 'تمرير 0 وسيط حقيقي، لذلك تكون `b` تساوي 0، لا 10.'
      answer: 1
    - q: |-
        ماذا يطبع هذا الكود؟
        ```js
        function makeLimiter(max) {
          let used = 0;
          return () => {
            if (used >= max) return false;
            used++;
            return true;
          };
        }
        const canAdd = makeLimiter(2);
        console.log(canAdd(), canAdd(), canAdd());
        ```
      options:
        - text: "`true true true`"
          why: 'الـ closure يتذكّر `used` بين الاستدعاءات، لذلك يُبلغ الحدّ 2.'
        - text: "`false false false`"
          why: 'أول استدعاءين يجدان `used` أقل من `max`، لذلك يُرجعان `true`.'
        - text: "`true true false`"
          why: 'صحيح. الـ closure يُبقي `used` حيًا: تصبح 0 ثم 1 ثم 2، ويجد الاستدعاء الثالث أن الحدّ قد بُلغ.'
        - text: "`true false false`"
          why: 'الحدّ 2، لذلك ينجح استدعاءان قبل أن تصبح `used >= max` صحيحة.'
      answer: 2
  s-js-3:
    - q: '`const names = expenses.map((e) => { e.label.toUpperCase(); });` تعطي مصفوفة من `undefined`. ما الإصلاح؟'
      options:
        - text: 'استخدم `forEach` بدلًا من `map`.'
          why: '`forEach` نفسها تُرجع `undefined`، فلن تحصل على أي مصفوفة أصلًا.'
        - text: 'احذف الأقواس المعقوفة، `(e) => e.label.toUpperCase()`، أو أضف `return` داخلها.'
          why: 'صحيح. مع الأقواس المعقوفة يحتاج الـ callback إلى `return` صريحة؛ وإلا فإنه يُرجع `undefined` لكل عنصر.'
        - text: 'استخدم `filter` بدلًا من `map`.'
          why: '`filter` تحتفظ بالعناصر أو تُسقطها؛ ولا تحوّلها. ومع هذا الـ callback ستُرجع مصفوفة فارغة.'
        - text: 'صرّح بـ `names` باستخدام `let` بدلًا من `const`.'
          why: 'طريقة تخزين النتيجة لا تغيّر ما تُرجعه `map`.'
      answer: 1
    - q: 'ماذا تُرجع `[5, 25, 100].sort()`؟'
      options:
        - text: "`[5, 25, 100]`"
          why: 'هذا يحتاج إلى دالة مقارنة مثل `(a, b) => a - b`. الترتيب الافتراضي يقارن النصوص.'
        - text: "`[5, 100, 25]`"
          why: 'بصفتها نصوصًا، تُرتَّب "1" قبل "2" و"5"، لذلك تأتي "100" أولًا.'
        - text: "`[25, 5, 100]`"
          why: 'مقارنة النصوص تنظر إلى الحرف الأول أولًا: "1" < "2" < "5".'
        - text: "`[100, 25, 5]`"
          why: 'صحيح. دون دالة مقارنة، تُقارن الأرقام على أنها نصوص: "100" < "25" < "5".'
      answer: 3
    - q: |-
        ماذا يطبع هذا الكود؟
        ```js
        const settings = { currency: "USD", limits: { food: 400 } };
        const copy = { ...settings };
        copy.limits.food = 500;
        copy.currency = "EUR";
        console.log(settings.currency, settings.limits.food);
        ```
      options:
        - text: "`USD 400`"
          why: 'النشر سطحي: `copy.limits` و`settings.limits` هما الكائن الداخلي نفسه، لذلك يتغيّر حدّ الطعام لكليهما.'
        - text: "`EUR 500`"
          why: '`currency` خاصية في المستوى الأعلى، نُسخت قيمتها إلى الكائن الجديد، لذلك تغيير `copy.currency` يترك `settings` كما هو.'
        - text: "`USD 500`"
          why: 'صحيح. نُسخت خصائص المستوى الأعلى، لكن الكائن المتداخل `limits` مشترك. استخدم `structuredClone` لنسخة عميقة.'
        - text: "`EUR 400`"
          why: 'الجزءان معكوسان: تغيير المستوى الأعلى يبقى في النسخة، والتغيير المتداخل مشترك.'
      answer: 2
    - q: 'أيّ تعبير يُرجع خصمًا محفوظًا قيمته `0` على أنه 0، ولا يستخدم 10 إلا حين لا يكون هناك خصم محفوظ؟'
      options:
        - text: "`user.discount ?? 10`"
          why: 'صحيح. `??` لا تلجأ إلى البديل إلا مع `null` و`undefined`، فيُحتفظ بالصفر الحقيقي.'
        - text: "`user.discount || 10`"
          why: '`||` تلجأ إلى البديل مع كل قيمة falsy، و0 قيمة falsy، فيُستبدل الخصم المحفوظ بـ 10.'
        - text: "`user.discount ? user.discount : 10`"
          why: 'العامل الثلاثي يفحص إن كانت القيمة truthy، تمامًا مثل `||`، فيصبح 0 هو 10.'
        - text: "`user?.discount || 10`"
          why: '`?.` تحمي فقط من غياب `user`؛ أما `||` فما زالت تتخلّص من الصفر.'
      answer: 0
    - q: 'يعلّم Pocket المصاريف بأنها "reviewed" ويفحص `isReviewed(id)` لكل عنصر في كل عرض. أيّ بنية أنسب لمعرّفات المصاريف المُراجَعة؟'
      options:
        - text: نص فيه المعرّفات مفصولة بفواصل.
          why: 'النصوص يجب البحث فيها حرفًا حرفًا، وقد تطابق أجزاءً من معرّفات أخرى، مثل "exp-1" داخل "exp-12".'
        - text: Map من المعرّف إلى كائن المصروف الكامل.
          why: أنت تحتاج فقط إلى إجابة نعم/لا، لذلك تخزين المصاريف كاملة يكرّر بيانات موجودة أصلًا في القائمة.
        - text: مصفوفة تضيف إليها كل معرّف بـ push.
          why: 'هذا يعمل، لكنه يسمح بالتكرار، و`includes` تبحث في المصفوفة كلها مع كل فحص.'
        - text: Set من المعرّفات.
          why: 'صحيح. الـ Set تخزّن كل معرّف مرة واحدة، و`has(id)` تجيب بسرعة دون بحث.'
      answer: 3
  s-js-4:
    - q: 'سكربت في `<head>` ينفّذ `document.querySelector("#total").textContent = "$0.00";` ويرمي `Cannot set properties of null`. والـ id مكتوب بشكل صحيح. ما الذي يُصلح ذلك؟'
      options:
        - text: 'استخدم `getElementById("total")` بدلًا من ذلك.'
          why: 'أي بحث يُرجع `null` حين لا يكون العنصر موجودًا بعد. المشكلة في التوقيت، لا في الدالة.'
        - text: 'غلّف السطر بـ `try`/`catch`.'
          why: هذا يُخفي الخطأ، ويظل المجموع لا يُضبط أبدًا.
        - text: 'استخدم `innerHTML` بدلًا من `textContent`.'
          why: 'الفشل يحدث قبل ضبط أيّ من الخاصيتين: العنصر نفسه `null`.'
        - text: 'أضف `defer` إلى وسم السكربت (أو حمّله بـ `type="module"`)، كي يُنفَّذ بعد تحليل الصفحة.'
          why: صحيح. السكربت العادي في الـ head يُنفَّذ قبل وجود الـ body، فلا يكون العنصر موجودًا بعد.
      answer: 3
    - q: 'يضيف Pocket مستمع نقرات لكل `<li>` عند تحميل الصفحة. والمصاريف المضافة لاحقًا لا تستجيب للنقرات. ما أفضل إصلاح؟'
      options:
        - text: 'ضع مستمعًا واحدًا على حاوية القائمة واستخدم `event.target.closest("li")` لتجد العنصر المنقور.'
          why: صحيح. النقرات على العناصر الجديدة تنتشر للأعلى إلى الحاوية نفسها، لذلك يغطّي التفويض العناصر المضافة في أي وقت.
        - text: 'أضف المستمعين من جديد بعد ثانية باستخدام `setTimeout`.'
          why: العناصر المضافة بعد تلك الثانية ستفوتها أيضًا. التوقيت ليس المشكلة الحقيقية.
        - text: 'ضع سمة `onclick="..."` في نص HTML لكل عنصر.'
          why: هذا يخلط الكود بنصوص الوسوم، ويعرّضك لخطر الحقن، وما زال يتطلّب التعامل مع كل عنصر على حدة.
        - text: 'أعِد إضافة المستمعين إلى كل عنصر كل ثانية باستخدام `setInterval`.'
          why: إنه يهدر العمل ويكدّس مستمعين مكرّرين على عناصر كان لها مستمع أصلًا.
      answer: 0
    - q: 'بعد الضغط على Enter في نموذج Pocket، يُعاد تحميل الصفحة ويظهر في الرابط `?label=Tea`. ومعالج الحدث هو `form.addEventListener("submit", () => { addExpense(); });`. ما السبب؟'
      options:
        - text: 'حدث `submit` لا يُطلق إلا مع نقرات الفأرة، لا مع Enter.'
          why: '`submit` يُطلق أيًّا كانت طريقة إرسال النموذج، ولهذا بالضبط تستمع إليه.'
        - text: 'يجب أن تكون `addExpense` دالة `async`.'
          why: كونها غير متزامنة أو لا لا يؤثّر في إعادة التحميل. فالفعل الافتراضي للمتصفّح ما زال يحدث.
        - text: 'معالج الحدث لا يستدعي `event.preventDefault()` أبدًا، فيُجري المتصفّح الإرسال المعتاد.'
          why: صحيح. الفعل الافتراضي يرسل النموذج ويحمّل صفحة جديدة. ألغِه في أول سطر من معالج الحدث.
        - text: 'النموذج تنقصه السمة `action`.'
          why: 'دون `action` يُرسَل النموذج إلى الصفحة الحالية، وهذه إعادة التحميل التي تراها. والإصلاح هو إلغاء الإرسال.'
      answer: 2
    - q: 'بعد إعادة التحميل، تُرجع `localStorage.getItem("pocket")` النص `[object Object]`. ما الخطأ الذي وقع عند الحفظ؟'
      options:
        - text: كان التخزين ممتلئًا، فقُطعت البيانات.
          why: 'التخزين الممتلئ يرمي خطأ؛ ولا يستبدل البيانات بـ "[object Object]".'
        - text: 'مُرّر الكائن إلى `setItem` دون `JSON.stringify`، فحُوّل بـ `String()`.'
          why: 'صحيح. التخزين لا يحتفظ إلا بالنصوص. حوّل إلى نص بـ `JSON.stringify` واقرأ مجددًا بـ `JSON.parse`.'
        - text: 'استُدعيت `JSON.parse` مرتين عند التحميل.'
          why: التحليل يحدث عند التحميل ولا يستطيع تغيير ما خُزّن. النص كان خاطئًا أصلًا عند الحفظ.
        - text: كُتب المفتاح بشكل خاطئ عند التحميل.
          why: 'المفتاح المكتوب خطأً يُرجع `null`، لا "[object Object]".'
      answer: 1
    - q: |-
