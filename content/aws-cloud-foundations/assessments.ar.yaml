  - q: شركة في البرازيل تخدم مستخدمين في أنحاء أمريكا الجنوبية، لكن عقدًا يشترط بقاء كل بيانات العملاء داخل الاتحاد الأوروبي. أيّ اختيار للـ Region يتبع ترتيب الأولويات الوارد في الدرس؟
    options:
      - text: sa-east-1، لأنها الأقرب إلى المستخدمين.
        why: زمن الاستجابة مهم، لكنه يأتي بعد قواعد حماية البيانات الصارمة. وهذه الـ Region تخالف العقد.
      - text: us-east-1، لأنها تحصل عادةً على الخدمات الجديدة أولًا.
        why: توافر الخدمات يأتي ثالثًا، وهذه الـ Region تخالف أيضًا شرط البيانات الأوروبي.
      - text: أرخص Region في العالم أيًّا كانت.
        why: السعر آخر عامل للترجيح، وقد تكون أرخص Region خارج الاتحاد الأوروبي.
      - text: Region أوروبية توفّر كل خدمة مطلوبة، مع قبول زمن الاستجابة الإضافي واستخدام CDN للمحتوى الثابت.
        why: صحيح. قواعد حماية البيانات مرشّح صارم؛ وداخل حدوده تقلّل زمن الاستجابة بأدوات مثل CloudFront.
    answer: 3
  - q: تحتاج الـ instance الخاصة بـ Lantern في RDS for PostgreSQL إلى تحديث أمني ثانوي للمحرّك. من يطبّقه ومتى؟
    options:
      - text: تطبّقه AWS خلال نافذة الصيانة التي اختارها Lantern، أو يستطيع Lantern تطبيقه قبل ذلك.
        why: صحيح. تحديث المحرّك عمل AWS في RDS (مع تفعيل الترقيات التلقائية للإصدارات الثانوية، وهي مفعّلة افتراضيًا)، ويُجدوَل في نافذة تتحكّم فيها أنت.
      - text: يجب أن يتصل Lantern بمضيف قاعدة البيانات عبر SSH ويثبّته.
        why: لا يمنح RDS أي وصول على مستوى نظام التشغيل إلى المضيف. التحديث جزء من الخدمة المُدارة.
      - text: لا أحد؛ قواعد البيانات المُدارة لا تحتاج إلى تحديثات أبدًا.
        why: كل محرّك يحتاج إلى تحديثات. والفرق مع RDS هو من يثبّتها.
      - text: تطبّقه AWS فورًا في أي وقت دون إشعار.
        why: الصيانة مجدوَلة، ويمكنك رؤية إجراءات الصيانة المعلّقة قبل حدوثها.
    answer: 0
  - q: في الـ shell لديك المتغيّر `AWS_PROFILE=lantern-dev` مضبوط، وتشغّل `aws s3 ls --profile lantern-prod`. أيّ حساب يستخدمه الأمر؟
    options:
      - text: lantern-dev، لأن متغيّرات البيئة تنتصر دائمًا.
        why: خيارات سطر الأوامر لها الأسبقية على متغيّرات البيئة في AWS CLI.
      - text: لا هذا ولا ذاك؛ يرفض الـ CLI الإعدادات المتعارضة.
        why: يحسم الـ CLI التعارض بالأسبقية بدلًا من الفشل.
      - text: lantern-prod، لأن خيار سطر الأوامر يتجاوز متغيّر البيئة.
        why: صحيح. خيارات سطر الأوامر في أعلى ترتيب الأسبقية في الـ CLI، ولهذا يكون `--profile` الصريح الأكثر أمانًا في السكربتات.
      - text: أيّ profile اسمه `default` في `~/.aws/config`.
        why: لا يُستخدم الـ profile الافتراضي إلا حين لا يسمّي الخيار ولا متغيّر البيئة أيّ profile.
    answer: 2
  - q: تسمح سياسة مجموعة Sam بـ `s3:GetObject` على `arn:aws:s3:::lantern-posters/*`. وترفض سياسة الـ bucket كل إجراءات S3 حين يكون `aws:SecureTransport` بقيمة false. يطلب Sam ملصقًا عبر رابط HTTP عادي. ماذا يحدث؟
    options:
      - text: ينجح، لأن السماح القائم على الهوية مطابق.
        why: السماح مطابق فعلًا، لكن الرفض الصريح في أي سياسة منطبقة يتجاوزه.
      - text: يُرفض، لأن الطلب لم يستخدم TLS فينطبق الرفض الصريح في سياسة الـ bucket.
        why: صحيح. قيمة SecureTransport هي false في HTTP العادي، فيطابق الـ Deny، والرفض الصريح ينتصر دائمًا.
      - text: ينجح، لأن سياسات الـ buckets لا تنطبق إلا على المستخدمين المجهولين.
        why: تنطبق سياسات الـ buckets على كل principal تطابقه، بما في ذلك المستخدمون في الحساب نفسه.
      - text: يُرفض، لأن Sam لا يملك `s3:ListBucket`.
        why: تنزيل مفتاح معروف لا يحتاج إلى ListBucket. حاجز TLS هو ما يحجب هذا الطلب.
    answer: 1
  - q: دالة التقارير في Lantern تقرأ فقط جدول DynamoDB المسمّى `lantern-events-archive` في eu-west-1. أيّ عبارة سياسة تتبع أقل الصلاحيات؟
    options:
      - text: "`dynamodb:*` على `*`"
        why: هذه تسمح بكل إجراء في DynamoDB على كل جدول، بما في ذلك حذفها.
      - text: "`dynamodb:GetItem` و`dynamodb:Query` و`dynamodb:Scan` على `*`"
        why: الإجراءات للقراءة فقط، لكن الـ Resource يغطّي كل جدول في كل Region من الحساب.
      - text: "`dynamodb:*` على ARN الجدول"
        why: المورد صحيح، لكن الإجراءات تشمل الكتابة والحذف وتعديل الجدول، وهي أمور لا تفعلها الدالة أبدًا.
      - text: "`dynamodb:GetItem` و`dynamodb:Query` على `arn:aws:dynamodb:eu-west-1:111122223333:table/lantern-events-archive`"
        why: صحيح. إجراءات القراءة التي تستخدمها الدالة فقط، على ARN جدول واحد بالضبط.
    answer: 3
  - q: أيّ من موارد Lantern الخاملة التالية يظل يضيف إلى الفاتورة كل ساعة حتى حين لا تمرّ أي زيارات؟
    options:
      - text: بوابة NAT تُركت في شبكة فرعية عامة بعد الترحيل.
        why: صحيح. تُحتسب بوابات NAT بالساعة سواء مرّت زيارات أم لا، إضافة إلى كل غيغابايت حين تمرّ.
      - text: دالة Lambda لا يستدعيها أحد.
        why: تحاسب Lambda لكل طلب ولكل GB-second من وقت التشغيل، فوجود دالة خاملة لا يكلّف شيئًا.
      - text: نقطة نهاية من نوع gateway لـ S3.
        why: نقاط النهاية من نوع gateway لـ S3 وDynamoDB لا تحمل أي رسوم بالساعة أو لمعالجة البيانات.
      - text: role في IAM بلا سياسات مرفقة.
        why: لا رسوم على IAM إطلاقًا، أيًّا كانت الـ roles والسياسات التي تنشئها.
    answer: 0
  - q: الـ versioning مفعّل في الـ bucket الخاص بالملصقات، وشغّل أحدهم `aws s3 rm s3://lantern-posters/posters/2026/festival.jpg`. كيف تستعيد الملصق؟
    options:
      - text: لا يمكنك ذلك؛ يحذف `rm` الكائنات نهائيًا.
        why: مع تفعيل الـ versioning، لا يضيف الحذف البسيط إلا علامة حذف؛ والنسخة السابقة ما زالت مخزّنة.
      - text: استعده من S3 Glacier، حيث تذهب الكائنات المحذوفة.
        why: لا تُنقل الكائنات المحذوفة إلى فئة أخرى. إنها تبقى كنسخ غير حالية في الـ bucket نفسه.
      - text: احذف علامة الحذف، أو انسخ النسخة السابقة لتعود النسخة الحالية.
        why: صحيح. إزالة علامة الحذف تجعل النسخة السابقة هي الحالية من جديد.
      - text: اطلب من AWS Support استرجاعه.
        why: لا تستطيع AWS استعادة بيانات حذفتها أنت، ومع الـ versioning لا تحتاج إلى ذلك.
    answer: 2
  - q: يريد أمين الصندوق جدولًا شهريًا بالفعاليات الأكثر تأكيدًا للحضور، قابلًا للترشيح حسب المدينة والفئة، مع إضافة مرشّحات جديدة كلما طلب أحدهم. تأكيدات الحضور موجودة في DynamoDB. ما النهج الأكثر عملية؟
    options:
      - text: امسح جدول تأكيدات الحضور كل شهر ورشّح في الكود.
        why: عمليات المسح تقرأ الجدول كله وتحتسبه في كل مرة، وكل مرشّح جديد يعني مزيدًا من الكود المخصّص.
      - text: حمّل الأعداد الشهرية لتأكيدات الحضور إلى قاعدة بيانات RDS for PostgreSQL بجوار الفعاليات، وأجب عن الأسئلة بـ SQL.
        why: صحيح. الأسئلة المتنوّعة والمتغيّرة مع عمليات JOIN مع الفعاليات والمدن والفئات هي ما وُجدت قاعدة البيانات العلائقية من أجله.
      - text: أضف global secondary index جديدًا في DynamoDB لكل مرشّح يبتكره أمين الصندوق.
        why: كل index يكلّف تخزينًا وعمليات كتابة، والتركيبات المخصّصة من المرشّحات تتجاوز تصميم المفاتيح بسرعة.
      - text: انقل كل تأكيدات الحضور إلى S3 Express One Zone.
        why: Express One Zone تخزين كائنات سريع. لكنه لا ينفّذ استعلامات ولا عمليات تجميع.
    answer: 1
  - q: مجموعة أمان تسمح بـ TCP 443 الوارد من أي مكان، وأُزيلت كل قواعدها الصادرة. يرسل زائر طلب HTTPS إلى الـ instance. ماذا يحدث للاستجابة؟
    options:
      - text: تُسقط، لأنه لا توجد قاعدة صادرة.
        why: هذا صحيح بالنسبة إلى network ACL عديمة الحالة. أما مجموعات الأمان فتتتبّع الاتصالات.
      - text: تُرسَل فقط إذا كانت للـ network ACL الخاصة بالشبكة الفرعية قاعدة واردة للمنفذ 443 أيضًا.
        why: الـ network ACL مهمة أيضًا، لكن هذا السؤال عمّا تفعله مجموعة الأمان بالرد.
      - text: تُرسَل فقط بعد أن تعيد AWS إضافة قاعدة صادرة افتراضية.
        why: لا تعيد AWS إضافة قواعد أزلتها. ولا حاجة إلى قاعدة صادرة للردود.
      - text: تُرسَل، لأن مجموعات الأمان ذات حالة وتسمح بالردود على الزيارات الواردة المسموح بها.
        why: صحيح. القواعد الصادرة لا تتحكّم إلا في الاتصالات الجديدة التي تبدؤها الـ instance.
    answer: 3
  - q: بعد عملية نشر، رُفع ملف جديد ذو hash هو `assets/index-9c2e1f.css` وحُدِّث `index.html` بترويسة no-cache. أيّ مسار يحتاج إلى إبطال في CloudFront؟
    options:
      - text: "`/index.html` فقط، إن كان CloudFront قد يحتفظ بنسخة قديمة منه؛ أما ملف CSS الجديد فلم يُخزَّن مؤقتًا قط."
        why: صحيح. اسم الملف الجديد لا يحمل شيئًا قديمًا لإبطاله، و`index.html` قصير العمر يلتقط المرجع الجديد.
      - text: "`/*`، احتياطًا في كل عملية نشر."
        why: إبطال كل شيء يُفرغ الـ cache ويرسل الموجة التالية من الزوّار إلى الـ origin دفعة واحدة.
      - text: "`/assets/index-9c2e1f.css` فقط"
        why: لم يُطلب ملف CSS الجديد قط، فلا يملك CloudFront نسخة قديمة منه لإزالتها.
      - text: لا يمكن أبدًا إبطال أي شيء مع origins من S3.
        why: تعمل عمليات الإبطال مع أي نوع من الـ origins، بما في ذلك الـ buckets في S3.
    answer: 0
  - q: يجب أن يضع Lantern خدمة AWS WAF أمام الـ API الخاص بتأكيد الحضور لحجب الزيارات المسيئة عند الـ API نفسه. أيّ نوع من API Gateway يدعم ذلك مباشرة؟
    options:
      - text: HTTP API
        why: تستغني الـ HTTP APIs عن عدة ميزات كي تبقى رخيصة، والتكامل المباشر مع AWS WAF واحد منها.
      - text: Lambda function URL
        why: الـ function URL ميزة في Lambda، وليست نوعًا من API Gateway، ولا تكامل لها مع WAF.
      - text: REST API
        why: صحيح. تدعم الـ REST APIs خدمة AWS WAF، إلى جانب API keys وخطط الاستخدام والتحقّق من الطلبات.
      - text: WebSocket API
        why: تخدم الـ WebSocket APIs الاتصالات ثنائية الاتجاه، وليست النوع الذي يدعم WAF لهذا الاستخدام.
    answer: 2
  - q: تضاعفت فاتورة Lantern الشهرية. أيّ خطوة أولى تُظهر من أين جاءت الزيادة؟
    options:
      - text: احذف أحدث الموارد حتى ينخفض التوقّع.
        why: الحذف دون دليل قد يزيل شيئًا مهمًا وقد لا يمسّ السبب الحقيقي.
      - text: افتح AWS Cost Explorer وجمّع التكاليف حسب الخدمة وحسب الوسم `project`، مقارنًا هذا الشهر بالشهر السابق.
        why: صحيح. يُظهر Cost Explorer أيّ خدمة وأيّ مشروع موسوم نما، وهذا يشير مباشرة إلى السبب.
      - text: اخفض حد AWS Budgets كي ينطلق التنبيه مبكرًا.
        why: خفض الحد يجعل الرسائل تصل أبكر، لكنه لا يفسّر ما الذي يكلّف أكثر.
      - text: ارفع الـ reserved concurrency على كل دالة Lambda.
