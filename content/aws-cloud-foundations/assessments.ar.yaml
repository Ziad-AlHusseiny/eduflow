checkpoints:
  s-aws-1:
    - q: في المحاولة الأولى ينسخ Lantern الخادم القديم إلى instance واحدة في EC2 ضمن `eu-west-1a`، ويصفه أحد المتطوّعين بأنه «عالي التوافر لأنه في السحابة». أيّ تغيير يتيح فعلًا للتطبيق النجاة من خسارة منطقة توافر؟
      options:
        - text: الانتقال إلى نوع instance أكبر في منطقة التوافر نفسها.
          why: الآلة الأكبر تتحمّل حملًا أكبر، لكنها ما زالت تعيش في منطقة توافر واحدة وتسقط معها.
        - text: تشغيل instances في منطقتي توافر على الأقل، مع إبقاء البيانات خارج الـ instances في خدمة مُدارة متعدّدة مناطق التوافر.
          why: صحيح. الصمود يأتي من نسخ مستقلة في مناطق توافر منفصلة، ومن عدم تخزين النسخة الوحيدة من البيانات على خادم واحد.
        - text: نقل كل شيء إلى us-east-1 لأن فيها مناطق توافر أكثر.
          why: كثرة مناطق التوافر في الـ Region لا تفيد إلا إذا استخدمت أكثر من واحدة منها فعلًا، وقد يخالف النقل قواعد حماية البيانات التي يلتزم بها Lantern.
        - text: تفعيل المراقبة التفصيلية للـ instance.
          why: تخبرك المراقبة مبكرًا بأن منطقة التوافر تعطّلت. لكنها لا تُبقي التطبيق يعمل.
      answer: 1
    - q: أنت مسجّل الدخول بمستخدم IAM المدير الخاص بـ Lantern وله `AdministratorAccess`، ومع ذلك تقول صفحات Billing and Cost Management إنك غير مخوّل. ما السبب الأرجح؟
      options:
        - text: لا تتضمّن AdministratorAccess أي إجراءات فوترة.
          why: تسمح AdministratorAccess بكل الإجراءات. الحجب يأتي من إعداد على مستوى الحساب، لا من السياسة.
        - text: بيانات الفوترة لا تظهر إلا في us-east-1، والـ console مفتوح على Region أخرى.
          why: صفحات الفوترة عامّة ولا تعتمد على مُحدِّد الـ Region.
        - text: مستخدمو IAM لا يستطيعون رؤية بيانات الفوترة أبدًا؛ وحده مستخدم الجذر يستطيع.
          why: يستطيع مستخدمو IAM والـ roles رؤية الفوترة بمجرد أن يسمح الحساب بذلك. وهذا هو الإعداد الموصى به.
        - text: لم يفعّل مستخدم الجذر وصول مستخدمي IAM والـ roles إلى معلومات الفوترة.
          why: صحيح. هذا الإعداد من إعدادات الحساب مهمة حصرية بالجذر، وحتى يُفعَّل لا تستطيع صلاحيات IAM وحدها فتح صفحات الفوترة.
      answer: 3
    - q: وفق نموذج المسؤولية المشتركة، أيّ من التالي مهمة AWS بالنسبة إلى جدول DynamoDB الخاص بـ Lantern؟
      options:
        - text: تخزين بيانات الجدول بشكل مكرّر عبر مناطق التوافر في الـ Region.
          why: صحيح. DynamoDB خدمة مُدارة إقليمية، ونسخ بياناتها عبر مناطق التوافر جزء من الخدمة التي تشغّلها AWS.
        - text: تحديد أيّ roles في IAM يحق لها استدعاء `dynamodb:Scan` على الجدول.
          why: من يحق له الوصول إلى بياناتك قرارك أنت دائمًا، وتعبّر عنه في سياساتك.
        - text: تحديد أيّ السمات يجوز أن تحتوي على بيانات شخصية مثل عناوين البريد.
          why: ما تخزّنه، وهل يجب أن تخزّنه، من حوكمة بيانات العميل ويبقى مسؤوليتك.
        - text: تفعيل الاستعادة إلى نقطة زمنية (point-in-time recovery) للجدول.
          why: توفّر AWS الميزة، لكن تفعيلها خيار إعداد تتّخذه أنت لكل جدول.
      answer: 0
    - q: شغّل سكربت تنظيف الأمر `aws s3 rb s3://lantern-test --force` بينما كانت بيانات اعتماد الإنتاج نشطة في الطرفية أيضًا. أيّ تغيير يمنع السكربت على أفضل وجه من العمل في الحساب الخطأ أبدًا؟
      options:
        - text: إضافة `--dry-run` إلى الأمر.
          why: لا يحتوي الأمر `aws s3 rb` على خيار dry-run، والتشغيل التجريبي لن يتحقّق من الحساب النشط على أي حال.
        - text: تشغيل السكربت بمستخدم الجذر فقط كي يُسجَّل كل إجراء.
          why: الجذر يضخّم الأخطاء ولا يقلّلها، ولا يختار الحساب الصحيح نيابة عنك.
        - text: تمرير `--profile` صريح وإيقاف السكربت ما لم يُعِد `aws sts get-caller-identity` معرّف الحساب المتوقّع.
          why: صحيح. الـ profile الصريح يزيل الالتباس، وفحص الهوية يفشل بأمان قبل تشغيل أي شيء مدمّر.
        - text: ضبط `--output text` كي تسهل قراءة الأخطاء.
          why: تنسيق المخرجات يغيّر طريقة طباعة النتائج، لا الحساب الذي يستهدفه الأمر.
      answer: 2
    - q: متعلّم على خطة الحساب المجانية يريد التدرّب على شراء Savings Plan لـ instance تجريبية. ماذا يحدث؟
      options:
        - text: تتم عملية الشراء وتُدفع من الأرصدة الترويجية.
          why: الأرصدة لا تفتح ميزات تستثنيها الخطة المجانية. وشراء الالتزامات خارج نطاق الخطة.
        - text: تتم عملية الشراء لكنها تُلغى تلقائيًا بعد ستة أشهر.
          why: لا يوجد إلغاء تلقائي؛ عملية الشراء ببساطة غير معروضة في الخطة المجانية.
        - text: الـ Savings Plans مجانية خلال الأشهر الستة الأولى من أي حساب.
          why: الـ Savings Plans خصم مقابل التزام بالإنفاق، وليست مجانية أبدًا.
        - text: الـ Savings Plans غير متاحة في الخطة المجانية؛ ويجب ترقية الحساب إلى الخطة المدفوعة أولًا.
          why: صحيح. تستثني الخطة المجانية الخدمات والميزات التي قد تستهلك الأرصدة، مثل Savings Plans وReserved Instances.
      answer: 3
  s-aws-2:
    - q: |-
        هذه السياسة مرفقة بـ Sam، ومع ذلك يعيد `aws s3 ls s3://lantern-posters/` الخطأ AccessDenied. لماذا؟
        ```json
        {
          "Effect": "Allow",
          "Action": "s3:ListBucket",
          "Resource": "arn:aws:s3:::lantern-posters/*"
        }
        ```
      options:
        - text: "يعمل `s3:ListBucket` على الـ bucket، لذا يجب أن يكون الـ Resource هو `arn:aws:s3:::lantern-posters` دون `/*`."
          why: صحيح. السرد إجراء على مستوى الـ bucket؛ ونمط ARN الكائنات لا يطابقه أبدًا.
        - text: يحتاج السرد إلى `s3:GetObject` أيضًا.
          why: ينزّل GetObject الكائنات. أما سرد المفاتيح فلا يحتاج إلا إلى ListBucket على ARN الـ bucket.
        - text: تحتاج العبارة إلى عنصر Principal.
          why: السياسات القائمة على الهوية ليس فيها Principal؛ فالهوية المرفقة بها هي الـ principal.
        - text: السرد في S3 يتطلّب MFA دائمًا.
          why: لا يشترط MFA إلا شرطٌ في سياسة، وهذه السياسة ليس فيها شروط.
      answer: 0
    - q: ينشر الـ workflow الخاص بـ Lantern في GitHub Actions الموقعَ إلى S3. ما الطريقة الموصى بها لمنحه صلاحيات AWS؟
      options:
        - text: تخزين مفتاح وصول مستخدم IAM وسرّه كأسرار في المستودع.
          why: هذا يعمل، لكنه سرّ طويل الأمد قد يتسرّب من نظام الـ CI ويجب تدويره يدويًا.
        - text: استخدام جلسة `aws login` الخاصة بمستخدم المدير من حاسوب أحد القائمين على المشروع.
          why: جلسات تسجيل الدخول للأشخاص الجالسين أمام الطرفية وتنتهي خلال ساعات، فلا يمكن أن يعتمد عليها pipeline.
        - text: جعل الـ bucket الخاص بالموقع قابلًا للكتابة العامة كي لا يحتاج الـ workflow إلى بيانات اعتماد.
          why: الـ bucket القابل للكتابة العامة يتيح لأي أحد على الإنترنت استبدال موقع Lantern.
        - text: إضافة GitHub كمزوّد هوية OpenID Connect في IAM وترك الـ workflow يتقمّص role للنشر تسمّي سياسة الثقة الخاصة به المستودعَ.
          why: صحيح. يستبدل الـ workflow الـ token قصير العمر ببيانات اعتماد role مؤقتة، فلا يوجد أي سرّ مخزّن على الإطلاق.
      answer: 3
    - q: |-
        تتضمّن سياسات أحد المطوّرين Allow لـ `ec2:*` على `*` وهذه العبارة. ماذا يحدث حين يشغّل instance في `us-east-1`؟
        ```json
        {
          "Effect": "Deny",
          "Action": "ec2:*",
          "Resource": "*",
          "Condition": { "StringNotEquals": { "aws:RequestedRegion": "eu-west-1" } }
        }
        ```
      options:
        - text: ينجح، لأن الـ Allow لـ `ec2:*` كُتب أولًا.
          why: ترتيب العبارات لا يهمّ في IAM. كل العبارات المنطبقة تُقيَّم معًا.
        - text: ينجح، لأن الشروط لا تنطبق إلا على عبارات Allow.
          why: الشروط تعمل على عبارات Deny أيضًا، وهي طريقة شائعة لبناء حواجز الحماية.
        - text: يُرفض، لأن الـ Region في الطلب ليست eu-west-1، فتطابق عبارة الـ Deny الصريحة.
          why: صحيح. الشرط صحيح بالنسبة إلى us-east-1، فينطبق الـ Deny، والرفض الصريح ينتصر دائمًا.
        - text: يُرفض، لأن `ec2:*` ليس نمط إجراء صالحًا.
          why: الرموز البديلة على مستوى الخدمة مثل `ec2:*` صالحة. عبارة الـ Deny هي ما يحجب الطلب.
      answer: 2
    - q: غادر أحد المتطوّعين Lantern. الجميع يسجّلون الدخول عبر IAM Identity Center بحزم صلاحيات في حسابَي التطوير والإنتاج. ماذا تفعل؟
      options:
        - text: احذف الـ roles في IAM المسمّاة باسم المتطوّع في كل حساب.
          why: الـ roles في Identity Center لكل حزمة صلاحيات، لا لكل شخص، وحذفها سيمنع وصول كل من يستخدمها.
        - text: عطّل مستخدم المتطوّع في Identity Center أو احذفه، فيُزال وصوله إلى كل حساب مُسند إليه.
          why: صحيح. هوية واحدة، ومكان واحد لإلغائها. كما تتوقّف جلساته الحالية عن التجدّد.
        - text: دوّر مفاتيح الوصول لكل مستخدمي IAM في الحسابين.
          why: مع Identity Center لا يملك الأشخاص مفاتيح وصول لتدويرها. هذه الخطوة تنتمي إلى عالم المستخدمين المشتركين القديم.
        - text: غيّر كلمة مرور مستخدم الجذر في الحسابين.
          why: لم يكن للمتطوّع وصول إلى الجذر أصلًا، فتغيير كلمات مرور الجذر لا يزيل شيئًا كان لديه.
      answer: 1
    - q: يبلّغ ماسح أمني أن مفتاح وصول نشطًا لمستخدم IAM المسمّى `export-bot` في Lantern رُفع إلى مستودع عام على GitHub قبل ساعة. ما أول ما يجب أن تفعله؟
      options:
        - text: احذف المستودع كي لا يجد أحد آخر المفتاح.
          why: تنسخ البوتات المفاتيح المكشوفة خلال دقائق، فإخفاء المستودع لا يوقف من حصل عليه بالفعل.
        - text: تحقّق من تاريخ آخر استخدام للمفتاح وقرّر بناءً عليه.
          why: هذا الفحص جزء من التخلّص المخطّط له من مفتاح قديم. أما المفتاح المسرّب فحالة طوارئ، والانتظار يمنح المهاجم وقتًا.
        - text: افتح طلب دعم وانتظر أن تلغيه AWS.
          why: قد تساعد AWS وقد تطبّق سياسة حجر، لكن تعطيل مفتاحك بنفسك فوري وتحت سيطرتك.
        - text: عطّل المفتاح فورًا، ثم راجع CloudTrail لمعرفة فيمَ استُخدم، واستبدله بـ role.
          why: صحيح. التعطيل يوقف أي استخدام إضافي فورًا. ويأتي التحقيق والإصلاح البنيوي بعد ذلك.
      answer: 3
  s-aws-3:
    - q: يضيف Lantern خادم cache في الذاكرة يحتاج إلى كثير من الـ RAM وقليل من المعالج. أيّ عائلة instances تناسبه أكثر؟
      options:
        - text: "`c` (محسّنة للحوسبة)"
          why: الأنواع المحسّنة للحوسبة تمنح معالجًا أكثر لكل غيغابايت من الذاكرة، وهذا عكس ما يحتاجه حمل العمل هذا.
        - text: "`t` (قابلة للاندفاع)"
          why: الأنواع القابلة للاندفاع تناسب استخدام المعالج المنخفض المتقطّع مع ذاكرة متواضعة، لا cache كثيف الذاكرة.
        - text: "`r` (محسّنة للذاكرة)"
          why: صحيح. تمنح العائلة `r` أكبر قدر من الذاكرة لكل vCPU بين العائلات الشائعة.
        - text: "`g` (GPU)"
          why: الـ instances ذات الـ GPU للرسوميات وتعلّم الآلة، وهي مكلفة كـ cache.
      answer: 2
    - q: تُشاهَد ملصقات الفعاليات باستمرار خلال الشهر المحيط بالفعالية، ثم نادرًا، لكن صفحات الفعاليات القديمة يجب أن تظل تحمّلها فورًا. أيّ إعداد يخفّض التكاليف دون تعطيل الصفحات القديمة؟
      options:
        - text: أبقِ الملصقات الجديدة في S3 Standard وأضف قاعدة دورة حياة تنقلها إلى S3 Glacier Instant Retrieval بعد 90 يومًا.
          why: صحيح. تحافظ Glacier Instant Retrieval على الوصول بالمللي ثانية بسعر تخزين أقل للكائنات التي نادرًا ما تُقرأ.
        - text: انقل الملصقات إلى S3 Glacier Deep Archive بعد 30 يومًا.
          why: يجب استعادة كائنات Deep Archive قبل قراءتها، وهذا يستغرق ساعات، فستعرض الصفحات القديمة صورًا معطوبة.
        - text: خزّن كل الملصقات في S3 One Zone-IA من البداية.
          why: الملصقات الحديثة تُقرأ باستمرار، فستتراكم رسوم الاسترجاع، ومنطقة توافر واحدة مخاطرة بالنسبة إلى النسخة الوحيدة.
        - text: خزّن كل الملصقات في S3 Express One Zone.
          why: صُمِّمت Express One Zone لأحمال العمل فائقة الانخفاض في زمن الاستجابة، وليست مكانًا أرخص للملفات التي نادرًا ما تُقرأ.
      answer: 0
    - q: ينشئ Lantern جدول DynamoDB جديدًا لميزة تسجيل الحضور، زياراتها قريبة من الصفر معظم الأيام وهائلة في أيام المهرجانات. بأيّ نمط سعة يجب أن يبدأ؟
      options:
        - text: سعة provisioned بحجم ذروة المهرجان.
          why: ستدفع ثمن سعة الذروة كل يوم من أيام السنة، بما فيها الأيام الخاملة الكثيرة.
        - text: سعة provisioned بحجم يوم عادي، دون توسّع تلقائي.
          why: ستتجاوز زيارات المهرجان السعة المحجوزة وستُرفض الطلبات (throttled).
        - text: سعة محجوزة (reserved capacity) تُشترى لمدة سنة.
          why: السعة المحجوزة خصم على إنتاجية provisioned ثابتة، وهذا الجدول المتقطّع لا يملكها.
        - text: سعة on-demand، بالدفع لكل طلب.
          why: صحيح. يتبع on-demand الزيارات صعودًا وهبوطًا، والأيام الخاملة لا تكاد تكلّف شيئًا.
      answer: 3
    - q: دالة Lambda في شبكة فرعية خاصة تقرأ الملصقات من S3 وتكتب في DynamoDB. لا توجد في الـ VPC بوابة NAT. ما أرخص طريقة لتمكينها من الوصول إلى الخدمتين؟
      options:
        - text: أضف بوابة NAT في شبكة فرعية عامة.
          why: هذا يعمل، لكن بوابة NAT تُحتسب بالساعة ولكل غيغابايت، وهو ما تتجنّبه نقاط النهاية من نوع gateway لهاتين الخدمتين.
        - text: أضف نقاط نهاية من نوع gateway لـ S3 وDynamoDB إلى جدول التوجيه الخاص بالشبكات الفرعية الخاصة.
          why: صحيح. نقاط النهاية من نوع gateway تُبقي الزيارات إلى S3 وDynamoDB داخل AWS ولا تضيف رسومًا بالساعة أو لكل غيغابايت.
        - text: انقل الدالة إلى شبكة فرعية عامة.
          why: دوال Lambda داخل VPC لا تحصل على عناوين IP عامة، فالشبكة الفرعية العامة وحدها لا تمنحها وصولًا إلى الإنترنت.
        - text: افتح المنفذ 443 الصادر في مجموعة الأمان الخاصة بالدالة.
          why: تسمح مجموعات الأمان بكل الزيارات الصادرة افتراضيًا؛ والقطعة الناقصة مسار، لا قاعدة جدار حماية.
      answer: 1
    - q: دالة Lambda غير مرتبطة بأي VPC لا تستطيع الاتصال بقاعدة بيانات RDS الخاصة بـ Lantern في شبكة فرعية خاصة. ما المطلوب؟
      options:
        - text: اجعل الـ instance في RDS متاحة للعموم.
          why: هذا يكشف قاعدة البيانات للإنترنت، وهو ما وُجدت الشبكة الفرعية الخاصة لمنعه.
        - text: أضف `rds:*` إلى الـ execution role الخاص بالدالة.
          why: يتحكّم IAM في استدعاءات API الإدارية لـ RDS. أما الاتصال بقاعدة البيانات فزيارات شبكية لا تفتحها إجراءات IAM.
        - text: زِد مهلة الدالة.
          why: الاتصال لا يفشل لأنه بطيء؛ بل لا يوجد مسار شبكي على الإطلاق.
        - text: اربط الدالة بالشبكات الفرعية الخاصة في الـ VPC مع مجموعة أمان تسمح بها مجموعة أمان قاعدة البيانات على المنفذ 5432.
          why: صحيح. عندئذٍ تعمل الدالة داخل الـ VPC، وتستطيع القاعدة في مجموعة أمان قاعدة البيانات أن تسمّي مجموعة أمان الدالة كمصدر.
      answer: 3
  s-aws-4:
    - q: تسمح سياسة الـ bucket الخاص بموقع Lantern بـ `s3:GetObject` للـ service principal المسمّى `cloudfront.amazonaws.com`، لكن دون شرط `AWS:SourceArn`. ما الخطر؟
      options:
        - text: يمكن توجيه أي distribution في CloudFront، بما في ذلك distribution في حساب AWS آخر، إلى الـ bucket وقراءته.
          why: صحيح. شرط SourceArn هو ما يقصر الوصول على الـ distribution الخاص بـ Lantern.
        - text: يستطيع الزوّار رفع ملفات إلى الـ bucket عبر CloudFront.
          why: العبارة لا تسمح إلا بـ GetObject، فلا يوجد وصول كتابة لأي أحد.
        - text: سيتوقّف CloudFront عن تخزين الملفات مؤقتًا.
          why: التخزين المؤقت يعتمد على سياسات الـ cache والترويسات، لا على الشروط في سياسة الـ bucket.
        - text: سيُوقف Block Public Access تلقائيًا.
          why: إعدادات Block Public Access لا تتغيّر أبدًا من تلقاء نفسها حين تعدّل سياسة bucket.
      answer: 0
    - q: بعد تحويل الـ origin في الـ distribution إلى origin access control، أصبح كل ملف يعيد 403 من CloudFront. الـ bucket خاص وBlock Public Access مفعّل. ما السبب الأرجح؟
      options:
        - text: يجب إيقاف Block Public Access كي يعمل OAC.
          why: صُمِّم OAC للـ buckets الخاصة مع تفعيل Block Public Access. إيقافه غير مطلوب ولا مرغوب.
        - text: الشهادة ليست في us-east-1.
          why: مشكلة الشهادة تظهر كخطأ HTTPS أو خطأ إعداد للنطاق المخصّص، لا كـ 403 من S3 لكل ملف.
        - text: لا تحتوي سياسة الـ bucket على عبارة تسمح لهذا الـ distribution باستدعاء `s3:GetObject`.
          why: صحيح. يوقّع OAC الطلبات، لكن S3 ما زال يحتاج إلى سياسة تسمح للـ principal الخاص بـ CloudFront لهذا الـ distribution.
        - text: رُفعت الكائنات بترويسة no-cache.
          why: ترويسات الـ cache تؤثّر في مدة الاحتفاظ بالنسخ، لا في سماح S3 بالقراءة.
      answer: 2
    - q: لماذا يضبط Lantern الـ reserved concurrency على دالة تأكيد الحضور؟
      options:
        - text: لإبقاء نسخ دافئة تعمل كي لا يحدث تشغيل بارد (cold start).
          why: هذا هو الـ provisioned concurrency، وهو إعداد مختلف له رسومه الخاصة.
        - text: لجعل الدالة تعمل أسرع تحت الحمل.
          why: يحدّ الـ reserved concurrency من عدد النسخ العاملة؛ ولا يغيّر سرعة كل نسخة.
        - text: لخفض السعر لكل استدعاء.
          why: التسعير لكل طلب ولكل GB-second هو نفسه مع الـ reserved concurrency ومن دونه.
        - text: لوضع سقف لعدد النسخ التي يمكن تشغيلها في آنٍ واحد، فتُحَدّ التكلفة وتُحمى الخدمات التالية أثناء سيل من الطلبات.
          why: صحيح. الطلبات التي تتجاوز السقف تُرفض (throttled) بدلًا من تضخيم الفاتورة والحمل دون حدود.
      answer: 3
    - q: يستخدم إنذار الأخطاء في Lantern الخيار `--treat-missing-data notBreaching`. ماذا يعني ذلك في ليلة هادئة بلا استدعاءات؟
      options:
        - text: ينطلق الإنذار، لأن البيانات المفقودة قد تخفي توقّفًا للخدمة.
          why: هذا ما يفعله `breaching`. أما مع notBreaching فتُعَدّ البيانات المفقودة ضمن الحد.
        - text: الفترات التي لا بيانات فيها تُعَدّ سليمة، فيبقى الإنذار في حالة OK.
          why: صحيح. الدالة التي لا تُستدعى لا تنشر نقاط بيانات Errors، ولا يجب أن يوقظ ذلك أحدًا.
        - text: يُحذف الإنذار بعد فترة بلا بيانات.
          why: لا تُحذف الإنذارات تلقائيًا أبدًا. هذا الإعداد يحدّد فقط كيف تُعامَل البيانات المفقودة.
        - text: يتحوّل الإنذار إلى عدّ حالات الـ throttling بدلًا من ذلك.
          why: يراقب الإنذار المقياس الوحيد الذي ضبطته؛ وهذا الإعداد لا يغيّر المقياس.
      answer: 1
    - q: تلاحظ مراجعة Well-Architected أن جدول تأكيدات الحضور بلا point-in-time recovery، فقد يمسحه سكربت سيئ دون أي طريق للعودة. إلى أيّ ركيزة تنتمي هذه الملاحظة؟
      options:
        - text: الموثوقية (Reliability)
          why: صحيح. التعافي من الأعطال، بما فيها الخطأ البشري، هو جوهر ركيزة الموثوقية.
        - text: كفاءة الأداء (Performance efficiency)
          why: النسخ الاحتياطية لا تغيّر مدى كفاءة الجدول في خدمة الطلبات.
        - text: الاستدامة (Sustainability)
          why: الاستدامة تتعلّق بتقليل الأثر البيئي لحمل العمل، لا بالتعافي.
        - text: تحسين التكلفة (Cost optimization)
          why: يضيف PITR تكلفة صغيرة. والخطر الذي يعالجه هو فقدان البيانات، لا إنفاق المال.
      answer: 0
