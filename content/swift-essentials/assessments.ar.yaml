        why: "النماذج تعدّل الكائنات المراقَبة عبر `@Bindable` طوال الوقت؛ ليس هذا هو السبب."
      - text: "لأن `TextField` لا يعمل إلا مع `@State`."
        why: "`TextField` يقبل أي binding، بما في ذلك binding إلى داخل كائن مراقَب."
      - text: "لأن المخزن لا يقبل إلا قيم `Expense` مكتملة."
        why: كان يمكن للمخزن أن يقبل تحديثات جزئية؛ السبب الحقيقي يتعلّق بنيّة المستخدم.
      - text: "ليكون النموذج مسوّدة: Cancel يتجاهلها دون أن يمسّ البيانات المحفوظة."
        why: صحيح. المسوّدات من أنواع القيم تجعل الإلغاء مجانيًا وتُبقي البيانات نصف المكتوبة خارج المخزن.
