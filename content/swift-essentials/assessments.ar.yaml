  - q: عدة مهام تجلب الأسعار بالتوازي ويجب أن تحدّث كلها cache مشتركًا واحدًا. أيّ تعريف يُبقي الـ cache خاليًا من سباقات البيانات؟
    options:
      - text: "`actor RateCache { private var rates: [String: Decimal] = [:] }` مع methods للقراءة والحفظ."
        why: "صحيح. الـ actor ينفّذ استدعاءً واحدًا في كل مرة على الـ state الخاصة به، والمستدعون يجب أن يستخدموا `await`."
      - text: "`final class RateCache { var rates: [String: Decimal] = [:] }`"
        why: "الـ class العادي ذو الـ state القابلة للتغيير ليس `Sendable`؛ ولن تسمح Swift 6 للمهام بمشاركته."
      - text: "‏`struct RateCache { var rates: [String: Decimal] }` يُمرَّر إلى كل مهمة."
        why: كل مهمة تحصل على نسختها الخاصة، فلا تصل تحديثاتها أبدًا إلى cache مشترك.
      - text: "متغيّر عام `var rates: [String: Decimal]`."
        why: الـ state العامة القابلة للتغيير هي بالضبط ما تعتبره Swift 6 غير آمن بين المهام.
