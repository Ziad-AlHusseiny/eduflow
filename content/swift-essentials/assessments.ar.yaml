        why: لا يوجد عنوان، فلا شيء يُحوَّل إلى أحرف كبيرة؛ وتُستخدم القيمة الافتراضية بدلًا من ذلك.
      - text: '`"NONE"`'
        why: "صحيح. `first` تساوي `nil`، فتتوقّف السلسلة مبكرًا، وتقدّم `??` القيمة الافتراضية."
