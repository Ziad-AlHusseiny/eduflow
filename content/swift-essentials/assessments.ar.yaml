        why: "`some` لا تقول شيئًا عن الـ classes؛ والـ views في SwiftUI عادةً structs."
      - text: "أن `body` يعيد نوعًا واحدًا محدّدًا يتوافق مع `View`، يعرفه الـ compiler ولا تحتاج أنت إلى كتابته."
        why: صحيح. إنه نوع مُعتِم (opaque type) يُخفي اسم generic طويلًا.
      - text: أن الـ view سيُرسم على thread في الخلفية.
