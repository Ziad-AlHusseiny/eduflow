  - q: يحتاج Pocket Budget إلى إعداد لترتيب الفرز فيه ثلاثة خيارات بالضبط (الأحدث، الأقدم، الأكبر)، يُعرض في منتقٍ ويُحفظ على القرص. أيّ نوع هو الأنسب؟
    options:
      - text: "`enum SortOrder: String, CaseIterable { case newest, oldest, largest }`"
        why: "صحيح. لا توجد إلا القيم الصالحة، و`allCases` تغذّي المنتقي، والقيمة الخام تُحفظ بسهولة."
      - text: "`let sortOrder: String`"
        why: أي نص يُترجَم، بما في ذلك الأخطاء الإملائية، والمنتقي لا يملك قائمة خيارات.
      - text: "`struct SortOrder { var isNewest: Bool; var isLargest: Bool }`"
        why: القيم المنطقية تسمح بتركيبات مستحيلة، مثل أن تكون العلامتان صحيحتين معًا.
      - text: "‏`class SortOrder` مع ثلاثة أصناف فرعية."
        why: الوراثة أثقل بكثير مما تحتاجه مجموعة ثابتة من الخيارات، وأصعب في الحفظ.
