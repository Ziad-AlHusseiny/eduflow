  - q: "يحتوي الـ JSON على `\"total_spent\": 12.5` وفي الـ struct الخاص بك `let totalSpent: Decimal`. يرمي فكّ الترميز `keyNotFound`. ما أنظف إصلاح؟"
    options:
      - text: "أعد تسمية الخاصية إلى `total_spent`."
        why: يعمل، لكنه يُدخل أسلوب التسمية الخاص بالخادم إلى كود Swift الخاص بك.
      - text: "غيّر النوع إلى `Double`."
        why: النوع ليس المشكلة؛ اسم المفتاح هو الذي لا يتطابق.
      - text: اجعل الخاصية optional.
