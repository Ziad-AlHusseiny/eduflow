    options:
      - text: "لا، لأن `settings` ثابت معرّف بـ `let`."
        why: "في الـ class، `let` تثبّت الكائن الذي يشير إليه الاسم، لا خصائص الكائن."
      - text: "لا، لأن خصائص `@Observable` للقراءة فقط."
        why: "الخصائص المراقَبة متغيّرات `var` عادية؛ والماكرو يضيف التتبّع فقط."
      - text: "نعم، لكن التغيير يضيع لأن `settings` نُسخ."
        why: الـ classes لا تُنسخ عند الإسناد؛ هناك كائن واحد وقد تغيّر.
      - text: "نعم؛ المرجع ثابت، لكن خاصية `var` في الكائن ما زالت قابلة للتغيير."
        why: "صحيح. هذا هو سلوك المرجع: `let` تجمّد المرجع فقط."
