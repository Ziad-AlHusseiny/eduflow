checkpoints:
  s-sw-1:
    - q: |-
        ماذا يطبع هذا الكود؟
        ```swift
        let input = "abc"
        let amount = Int(input) ?? 0
        print(amount + 5)
        ```
      options:
        - text: "لا شيء؛ لا يُترجَم لأن `Int(input)` قيمة optional."
          why: "العامل `??` يفكّ الـ optional بقيمة افتراضية، فيصبح التعبير `Int` عاديًا ويُترجَم."
        - text: يتعطّل التطبيق، لأن "abc" ليست رقمًا.
          why: "`Int(_:)` تعيد `nil` للمدخلات السيئة بدل أن تُسقط التطبيق؛ الفكّ القسري وحده هو ما يُسقطه."
        - text: "`abc5`"
          why: "لا تجمع Swift أبدًا `String` مع `Int` بالعامل `+`؛ والطرفان هنا كلاهما `Int` أصلًا."
        - text: "`5`"
          why: "صحيح. `Int(\"abc\")` تساوي `nil`، و`?? 0` تضع 0 مكانها، و0 + 5 تساوي 5."
      answer: 3
    - q: "لديك `func convert(_ amount: Decimal, to currency: String) -> Decimal`. أيّ استدعاء يُترجَم؟"
      options:
        - text: '`convert(12, to: "EUR")`'
          why: "صحيح. تسمية المعامل الأول هي `_` فتُحذف؛ والثاني يستخدم التسمية `to`."
        - text: '`convert(amount: 12, to: "EUR")`'
          why: "`amount` هو اسم المعامل المستخدم داخل الدالة؛ و`_` تعني أن المستدعي لا يكتب تسمية."
        - text: '`convert(12, "EUR")`'
          why: "للمعامل الثاني تسمية الوسيط `to`، وSwift تشترطها في موضع الاستدعاء."
        - text: '`convert(12, currency: "EUR")`'
          why: "`currency` هو الاسم الداخلي. أما المستدعي فيجب أن يستخدم التسمية الخارجية `to`."
      answer: 0
    - q: "يجب أن تعيد `func monthlyAverage(_ amounts: [Decimal]) -> Decimal?` القيمة `nil` لمصفوفة فارغة. أيّ سطر أول هو الطريقة المعتادة في Swift للتعامل مع ذلك؟"
      options:
        - text: "`let first = amounts[0]`"
          why: "الوصول بالفهرس في مصفوفة فارغة يُسقط التطبيق مع \"Index out of range\" قبل أن تستطيع إعادة أي شيء."
        - text: "`if amounts.isEmpty { amounts = [0] }`"
          why: معاملات الدوال ثوابت، فلا يُترجَم هذا؛ كما أنه سيُخفي الحالة الفارغة.
        - text: '`guard amounts.count > 0 else { print("empty") }`'
          why: "فرع `else` في الـ `guard` يجب أن يغادر النطاق، فـ `print` وحدها خطأ ترجمة."
        - text: "`guard !amounts.isEmpty else { return nil }`"
          why: صحيح. الـ guard تنصّ على القاعدة وتخرج مبكرًا، ويستطيع باقي الدالة افتراض وجود بيانات.
      answer: 3
    - q: "تمرّ على المصاريف وتريد عدّ ما يقع منها في كل تصنيف، بدءًا من قاموس فارغ `var counts: [String: Int] = [:]`. أيّ سطر يوضع داخل الحلقة؟"
      options:
        - text: "`counts[category] += 1`"
          why: "البحث بالمفتاح يعيد `Int?`، ولا يمكنك إضافة 1 إلى optional دون فكّه."
        - text: "`counts.append(category)`"
          why: "القواميس ليس فيها `append`؛ هذه method خاصة بالمصفوفات."
        - text: "`counts[category, default: 0] += 1`"
          why: "صحيح. الصيغة `default:` تقرأ 0 للمفتاح الجديد، وتضيف 1، وتخزّن النتيجة."
        - text: "`counts.insert(category)`"
          why: "`insert` هي method خاصة بالـ `Set`؛ وستسجّل العضوية لا العدد."
      answer: 2
    - q: |-
        ما قيمة `result`؟
        ```swift
        let values = [5, 12, 30]
        let result = values.filter { $0 > 10 }.map { $0 * 2 }.reduce(0, +)
        ```
      options:
        - text: "`84`"
          why: "صحيح. يُبقي `filter` العددين 12 و30، ويضاعفهما `map` إلى 24 و60، ويجمعهما `reduce`."
        - text: "`94`"
          why: "هذا يتضمّن 5 بعد مضاعفتها إلى 10. لكن `filter` حذفها قبل تنفيذ `map`."
        - text: "`[24, 60]`"
          why: "هذه هي القيمة بعد `map`. ثم يجمع `reduce` المصفوفة في رقم واحد."
        - text: "`42`"
          why: "هذا مجموع 12 + 30 دون مضاعفة. خطوة `map` تُنفَّذ قبل `reduce`."
      answer: 0
  s-sw-2:
    - q: |-
        `Expense` هو struct فيه `var amount: Decimal`. ماذا يطبع هذا الكود؟
        ```swift
        var list = [Expense(amount: 5)]
        var first = list[0]
        first.amount = 9
        print(list[0].amount)
        ```
      options:
        - text: "`5`"
          why: "صحيح. قراءة `list[0]` في `first` تنسخ الـ struct؛ وتغيير النسخة يترك المصفوفة دون مساس."
        - text: "`9`"
          why: "هذا سلوك الـ class. الـ structs تُنسخ عند الإسناد، فيكون `first` مستقلًّا."
        - text: لا يُترجَم، لأن عناصر المصفوفة ثوابت.
          why: "`list` معرّف بـ `var`، وكذلك `first`؛ لا شيء هنا ثابت."
        - text: "يتعطّل التطبيق، لأن `first` مرجع معلّق لا يشير إلى شيء."
          why: "الـ structs لا مراجع فيها لتتعلّق؛ `first` يحمل قيمته الكاملة الخاصة."
      answer: 0
    - q: |-
        ماذا يطبع هذا الكود؟
        ```swift
        enum Sync {
            case idle
            case syncing(progress: Double)
            case failed(String)
        }
        let state: Sync = .syncing(progress: 0.4)
        switch state {
        case .idle: print("Idle")
        case .syncing(let p) where p > 0.5: print("Almost")
        case .syncing: print("Working")
        case .failed(let message): print(message)
        }
        ```
      options:
        - text: "`Almost`"
          why: "هذه الحالة تتطلّب تقدّمًا أكبر من 0.5، و0.4 لا تحقّق شرط `where`."
        - text: "`Idle`"
          why: "القيمة هي `.syncing`، فلا يمكن أن تطابقها الحالة `.idle`."
        - text: لا شيء، لأن لا حالة تطابق 0.4.
          why: "الحالة العادية `case .syncing:` تطابق أي تقدّم، فهناك دائمًا حالة مطابقة."
        - text: "`Working`"
          why: "صحيح. يفشل شرط `where`، فتنتقل المطابقة إلى حالة `.syncing` التالية."
      answer: 3
    - q: "الـ protocol المعرّف `protocol Exportable { func csvRow() -> String }` له خمسة أنواع متوافقة. يجب أن يحصل كلٌّ منها أيضًا على `csvLine`، أي `csvRow()` مع سطر جديد، دون كتابتها خمس مرات. ماذا تضيف؟"
      options:
        - text: "متطلّبًا `var csvLine: String { get }` في الـ protocol."
          why: المتطلّب يُلزم كل نوع بتنفيذه، وهذا هو التكرار الذي أردت تجنّبه.
        - text: '`extension Exportable { var csvLine: String { csvRow() + "\n" } }`'
          why: صحيح. الـ protocol extension يعطي كل نوع متوافق التنفيذ دون أي جهد.
        - text: "class أساسيًا `ExportableBase` ترث منه الأنواع الخمسة كلها."
          why: الـ structs والـ enums لا تستطيع الوراثة، والوراثة أثقل مما تحتاجه هذه المشكلة.
        - text: "دالة عامة `csvLine(_ item: Exportable)` في كل ملف."
          why: كتابتها في كل ملف ما زالت تكرارًا، ولا تُقرأ كخاصية للنوع.
      answer: 1
    - q: "يخزّن `final class ReminderScheduler` الخاصية `var onFire: (() -> Void)?` ويضبط `onFire = { self.notify() }`. تُظهر أدوات الذاكرة أن الـ schedulers لا تُحرَّر أبدًا. ما الإصلاح؟"
      options:
        - text: "غيّر `onFire` من `var` إلى `let`."
          why: "قابلية التغيير ليست المشكلة؛ فالـ closure المعرّف بـ `let` سيلتقط `self` بالقوة نفسها."
        - text: "اضبط `onFire = nil` داخل `deinit`."
          why: "`deinit` لا يُنفَّذ أبدًا ما دامت الدورة موجودة، فلن يُنفَّذ ذلك السطر أبدًا."
        - text: "اجعل `ReminderScheduler` صنفًا فرعيًا من `NSObject`."
          why: الـ classes في Objective-C تستخدم عدّ المراجع أيضًا؛ وتبقى الدورة.
        - text: "التقط التقاطًا ضعيفًا: `onFire = { [weak self] in self?.notify() }`."
          why: صحيح. لم يعد الـ closure يمتلك الـ scheduler، فيمكن أن يصل عدّاد المراجع إلى الصفر.
      answer: 3
    - q: |-
        تقرأ `load()` المصاريف المحفوظة وترمي خطأً إن كان الملف تالفًا. ماذا يرى المستخدم حين يحدث ذلك؟
        ```swift
        let expenses = (try? load()) ?? []
        ```
      options:
        - text: قائمة فارغة، دون أي إشارة إلى أن تحميل بياناته فشل.
          why: "صحيح. تخلّصت `try?` من الخطأ وملأت `?? []` قيمة مكانه. التقط الخطأ وأخبر المستخدم."
        - text: تنبيهًا يصف التلف.
          why: "لا شيء هنا يعرض تنبيهًا؛ فقد تخلّصت `try?` من الخطأ."
        - text: عطلًا مع وصف الخطأ.
          why: "هذا ما تفعله `try!`. أما `try?` فلا تُسقط التطبيق أبدًا؛ بل تنتج `nil`."
        - text: المصاريف التي حُمّلت قبل الجزء التالف.
          why: "`load()` إما أن تعيد المصفوفة كاملة أو ترمي خطأً؛ لا توجد نتيجة جزئية."
      answer: 0
  s-sw-3:
    - q: "يعلن view ابن اسمه `AmountField` عن `@State var amount: Decimal`، وينشئه الأب بـ `AmountField(amount: budget.limit)`. الكتابة في الحقل لا تغيّر حدّ الأب أبدًا. لماذا؟"
      options:
        - text: "`TextField` لا يستطيع تعديل قيم `Decimal`."
          why: "مع `format:` يعدّل `TextField` قيم `Decimal` بلا مشكلة؛ النوع ليس المشكلة."
        - text: "يجب أن يستدعي الأب `objectWillChange.send()`."
          why: "هذا ينتمي إلى نظام `ObservableObject` الأقدم، ولن يربط القيمتين على أي حال."
        - text: لا يحدّث SwiftUI الآباء إلا حين يختفي الابن.
          why: يحدّث SwiftUI الشاشة بمجرّد تغيّر مصدر الحقيقة؛ لا توجد قاعدة تأخير كهذه.
        - text: "أعطى `@State` الابن نسخته الخاصة؛ يجب أن يكون `@Binding`، ويمرّر الأب binding."
          why: صحيح. يجب أن يستعير الابن مصدر الحقيقة الخاص بالأب، لا أن يبدأ مصدرًا جديدًا.
      answer: 3
    - q: أيّ كود يعرض مجموع الإنفاق بالطريقة التي يتوقّع المستخدمون في بلدان مختلفة قراءة المال بها؟
      options:
        - text: '`Text(total, format: .currency(code: "USD"))`'
          why: صحيح. نمط التنسيق يطبّق الإعدادات المحلية للمستخدم في موضع الرمز والفواصل والمنازل العشرية.
        - text: '`Text("$\(total)")`'
          why: هذا يثبّت الرمز ويتجاهل فواصل المستخدم، فتبدو "$1234.5" خاطئة في معظم الأماكن.
        - text: "`Text(String(describing: total))`"
          why: هذا تمثيل مخصّص للتصحيح، بلا عملة ولا قواعد محلية.
        - text: '`Text("\(total) USD")`'
          why: "أفضل من لا شيء، لكنه ما زال غير منسّق: لا تجميع للخانات، ولا منازل عشرية ثابتة، ولا إعدادات محلية."
      answer: 0
    - q: "تستخدم القائمة `NavigationLink(value: expense)` و`.navigationDestination(for: Expense.self)`. بعد حفظ مصروف جديد، تريد فتح شاشة تفاصيله من الكود. ماذا تضيف؟"
      options:
        - text: "‏`NavigationLink` مخفيًا مع `isActive:` تبدّل قيمته."
          why: "هذا نمط قديم مهجور؛ استبدله `NavigationStack` بالمسارات."
        - text: "تستدعي `navigationDestination` مرة أخرى مع المصروف الجديد."
          why: الـ modifier الخاص بالوجهة يُعلَن مرة واحدة؛ ولا يطلق التنقّل بنفسه.
        - text: "‏`@State private var path: [Expense] = []`، و`NavigationStack(path: $path)`، ثم `path.append(saved)`."
          why: صحيح. المسار state، فإضافة قيمة إليه تدفع شاشة وجهتها.
        - text: "تعرض شاشة التفاصيل عبر `.sheet` بدلًا من ذلك."
          why: هذا يحوّل التفاعل إلى عرض منبثق؛ ولا يدفع الشاشة إلى مكدّس التنقّل.
      answer: 2
    - q: "وُضع `BudgetStore` المعلّم بـ `@Observable` في الـ environment على مستوى التطبيق. ويحتاج view متداخل بعمق اسمه `LimitSettings` إلى `TextField` مربوط بـ `store.monthlyLimit`. ماذا يكتب هذا الـ view؟"
      options:
        - text: "`@EnvironmentObject var store: BudgetStore`"
          why: "`@EnvironmentObject` ينتمي إلى `ObservableObject`؛ ولا يجد الكائنات المضافة عبر `.environment(_:)`."
        - text: "`@State private var store = BudgetStore()`"
          why: هذا ينشئ مخزنًا جديدًا كليًا يملكه هذا الـ view، منفصلًا عن بيانات التطبيق.
        - text: "`@Binding var store: BudgetStore`"
          why: الـ bindings يمرّرها الأب صراحةً؛ ولا تأتي من الـ environment.
        - text: "`@Environment(BudgetStore.self) private var store`، ثم `@Bindable var store = store` داخل `body`."
          why: "صحيح. يوفّر الـ environment المخزن المشترك، وينتج `@Bindable` القيمة `$store.monthlyLimit`."
      answer: 3
    - q: "يُعرض `AddExpenseView` كـ sheet ويجب أن يُغلق نفسه حين ينقر المستخدم Save. ما الطريقة القياسية؟"
      options:
        - text: 'اقرأ `@Environment(\.dismiss) private var dismiss` واستدعِ `dismiss()` بعد الحفظ.'
          why: "صحيح. `dismiss` يغلق أيّ عرض يُظهر هذا الـ view، سواء كان sheet أو شاشة دُفعت إلى مكدّس التنقّل."
        - text: "استدعِ `NavigationStack.pop()`."
          why: لا يوجد API كهذا، والـ sheet ليست جزءًا من مكدّس التنقّل الخاص بالقائمة.
        - text: "اضبط خاصية `isPresented` الخاصة بالـ view نفسه على `false`."
          why: علامة الـ sheet ملك للأب؛ والابن لا يملك خاصية كهذه إلا إذا أُعطي binding.
        - text: "احذف الـ view من أبيه عبر `removeFromSuperview()`."
          why: هذا من UIKit؛ أما الـ views في SwiftUI فأوصاف، لا كائنات يمكنك حذفها.
      answer: 0
  s-sw-4:
    - q: |-
        كل عملية جلب تستغرق نحو ثانية. كيف تجعل هذا يستغرق نحو ثانية واحدة في المجمل؟
        ```swift
        func loadAll() async throws -> (Decimal, Decimal) {
            let eur = try await service.fetchRate(from: "USD", to: "EUR")
            let gbp = try await service.fetchRate(from: "USD", to: "GBP")
            return (eur, gbp)
        }
        ```
      options:
        - text: "غلّف كل استدعاء في `Task { }` وأعِد فورًا."
          why: ستعود الدالة قبل وجود النتائج، والمهام غير المهيكلة تفلت من الإلغاء.
        - text: "علّم الدالة بـ `@MainActor`."
          why: تغيير الـ actor لا يجعل عمليتَي انتظار متتاليتين تتداخلان.
        - text: "استدعِ `fetchRate` من كتلة `DispatchQueue.main.async`."
          why: هذا يخلط كود GCD القديم مع async/await، وما زال لا يشغّل الطلبين بالتوازي.
        - text: "استخدم `async let eur = …` و`async let gbp = …`، ثم `try await (eur, gbp)`."
          why: صحيح. تبدأ المهمتان الابنتان فورًا وتعملان في الوقت نفسه.
      answer: 3
    - q: "دالة مساعدة nonisolated تُسند قيمة إلى `model.state` في نموذج معلّم بـ `@MainActor`، فتُبلغ Swift 6 بالرسالة \"main actor-isolated property 'state' can not be mutated from a nonisolated context\". ما الإصلاح الصحيح؟"
      options:
        - text: "علّم الدالة المساعدة بـ `@MainActor`، فتعمل حيث تعيش الـ state الخاصة بالنموذج."
          why: صحيح. الآن يستطيع الـ compiler أن يثبت أن كود الـ main actor وحده يلمس الـ state.
        - text: "علّم النموذج بـ `@unchecked Sendable`."
          why: هذا يُسكت الفحوصات دون أن يجعل أي شيء آمنًا؛ والسباق ما زال موجودًا.
        - text: أعد الهدف إلى وضع اللغة Swift 5.
          why: هذا يُخفي التشخيص بدل إصلاح سباق البيانات الذي يصفه.
        - text: انسخ النموذج إلى متغيّر محلي قبل الإسناد.
          why: النموذج class، فالنسخة هي الكائن نفسه والسباق نفسه.
      answer: 0
    - q: "يعيد API الأسعار الحالة HTTP 404 مع صفحة HTML لعملة غير معروفة. وكودك يفكّ ترميز `data` مباشرة بعد `URLSession.shared.data(from:)`. ماذا يرى المستخدمون؟"
      options:
        - text: "‏`URLError` يقول إن الصفحة غير موجودة."
          why: لا يرمي URLSession أخطاءً لرموز حالة HTTP؛ فالـ 404 استجابة ناجحة على مستوى الشبكة.
        - text: خطأ فكّ ترميز، مثل "data couldn't be read because it isn't in the correct format".
          why: "صحيح. يصل الـ HTML إلى `JSONDecoder`. افحص رمز الحالة أولًا وارمِ خطأً أوضح."
        - text: قائمة أسعار فارغة دون أي خطأ.
          why: "فكّ ترميز HTML على أنه `RatesResponse` يفشل بصخب؛ ولا ينتج قيمة فارغة."
        - text: صفحة الـ HTML معروضة داخل التطبيق.
          why: لا شيء في الكود يعرض جسم الاستجابة.
      answer: 1
    - q: "تربط شاشة تعديل الحقول مباشرة بنموذج SwiftData عبر `@Bindable var expense: Expense`. ويريد فريق المنتج زر Cancel يتجاهل التغييرات. ما أنظف تصميم؟"
      options:
        - text: "أبقِ الربط المباشر، واستدعِ `context.insert(expense)` عند Cancel."
          why: إضافة نموذج موجود لا تتراجع عن التعديلات؛ فالتغييرات صارت على الكائن أصلًا.
        - text: أبقِ الربط المباشر؛ فالتعديلات لا تُحفظ إلا حين تُغلق الشاشة.
          why: التعديلات تغيّر النموذج فورًا، والـ context الرئيسي يحفظها تلقائيًا.
        - text: "حوّل `Expense` إلى struct فتكون التعديلات نسخًا."
          why: "`@Model` يتطلّب class؛ لا يمكنك جعل نموذج SwiftData من نوع struct."
        - text: "عدّل نسخ مسوّدة من الحقول في `@State`، ولا تكتبها في النموذج إلا عند Save."
          why: "صحيح. إنه نمط المسوّدة نفسه الذي في نموذج الإضافة: Cancel يرمي المسوّدات."
