  - q: "أضفت `case gifts` إلى `Category`. في المشروع ثلاث جمل `switch` على `Category`، ومع ذلك تنجح الترجمة دون أخطاء. ما التفسير الأرجح؟"
    options:
      - text: "لا تفحص Swift شمول جمل `switch` للـ enums ذات القيم الخام."
        why: القيم الخام لا تُحدث فرقًا؛ كل switch على enum تُفحص للتحقّق من شمولها.
      - text: لا تُفحص حالات الـ enum الجديدة إلا حين تشغّل التطبيق.
        why: الشمول فحص وقت الترجمة، لا وقت التشغيل أبدًا.
      - text: "جمل الـ switch تلك تستخدم `default:`، التي تبتلع الحالة الجديدة بصمت."
        why: صحيح. لهذا يجب أن تسرد جمل switch على الـ enums الخاصة بك حالاتها صراحةً.
      - text: لا يفحص Xcode إلا جمل switch في الملفات المفتوحة.
        why: الـ compiler يفحص كل ملف يبنيه، مفتوحًا كان أم لا.
