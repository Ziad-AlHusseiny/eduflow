  - q: يخزّن Watchlist القيمة `visibleMovies` في الـ state ويحدّثها حين يتغيّر الفلتر. الأفلام المضافة حديثًا لا تظهر حتى يُنقر الفلتر من جديد. ما أفضل إصلاح؟
    options:
      - text: حدّث `visibleMovies` أيضًا في معالج الإضافة.
        why: هذا يرقّع حالة واحدة. سيحتاج التبديل والحذف إلى الإصلاح نفسه، وستنساه الميزة التالية.
      - text: احذف الـ state المسمّى `visibleMovies` واحسبه أثناء الـ render من `movies` و`filter`.
        why: صحيح. القيمة المشتقّة المحسوبة في كل render متزامنة دائمًا مع مصادرها.
      - text: زامنها بـ effect يعتمد على `movies` و`filter`.
        why: ينجح بعد render إضافي ببيانات قديمة، ويُبقي الـ state المكرّر غير الضروري.
      - text: خزّن الفلتر داخل كل كائن فيلم.
        why: الفلتر خاصية من خصائص العرض، لا من خصائص كل فيلم. وهذا يجعل التحديثات أصعب.
