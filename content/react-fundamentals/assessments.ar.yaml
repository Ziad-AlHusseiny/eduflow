      - text: ادمج الـ effectين في واحد بلا مصفوفة اعتماديات.
        why: هذا يعمل بعد كل render، وما زال يحفظ قبل التحميل في الـ render الأول.
      - text: احذف StrictMode حتى تعمل الـ effects مرة واحدة.
        why: مشكلة الترتيب موجودة في الإنتاج أيضًا؛ StrictMode يجعلها أوضح فقط.
      - text: احفظ باستخدام `setTimeout` لتمنح التحميل وقتًا لينتهي.
        why: حيل التوقيت تُخفي المشكلة وتفشل على الأجهزة البطيئة. حمّل قبل الـ render الأول بدلًا من ذلك.
