          why: صحيح. إبقاء نظام خارجي متزامنًا مع الـ state هو بالضبط وظيفة الـ effects.
        - text: حساب قائمة الأفلام الظاهرة من الفلتر.
          why: هذه بيانات مشتقّة. احسبها أثناء الـ render.
        - text: مسح حقل العنوان بعد أن يرسل المستخدم النموذج.
          why: هذا ناتج عن إجراء محدّد، فمكانه معالج الإرسال.
        - text: إضافة فيلم حين يُرسل النموذج.
