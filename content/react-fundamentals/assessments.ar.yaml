  - q: بمجرّد تحميل الصفحة، تبلّغ React بالخطأ «Too many re-renders». عناصر القائمة تحتوي على `<button onClick={handleRemove(movie.id)}>Remove</button>`. ما الإصلاح؟
    options:
      - text: غلّف `handleRemove` بـ `useEffect`.
        why: التعامل مع الأحداث ليس effect. المشكلة أن المعالج يُستدعى أثناء الـ render.
      - text: غيّره إلى `onClick={handleRemove}` واقرأ المعرّف من الحدث.
        why: ستمرّر React حدث النقر، لا المعرّف، فلن يحذف المعالج شيئًا.
      - text: "مرّر دالة: `onClick={() => handleRemove(movie.id)}`."
        why: صحيح. لا تُنفَّذ الـ arrow function إلا عند النقر، ثم تستدعي المعالج بالمعرّف الصحيح.
      - text: استخدم `onMouseUp` بدل `onClick`.
        why: أي prop لحدث له المشكلة نفسها حين يُعطى نتيجة استدعاء بدل دالة.
