checkpoints:
  s-rf-1:
    - q: "استنسخ زميلك مستودع Watchlist وشغّل `npm run dev`. فطبعت الطرفية `vite: command not found`. ماذا يجب أن يفعل؟"
      options:
        - text: يثبّت Vite تثبيتًا عامًا (global) بالأمر `npm install -g vite`.
          why: التثبيت العام يُخفي المشكلة الحقيقية، وقد يشغّل إصدارًا من Vite غير الذي يتوقّعه المشروع.
        - text: يحذف `package-lock.json` ويحاول مجددًا.
          why: ملف القفل هو ما يجعل التثبيت قابلًا للتكرار بالنتيجة نفسها. حذفه لا يغيّر شيئًا في المجلد المفقود.
        - text: يشغّل `npm install` أولًا، لأن `node_modules` لا يُخزَّن في Git.
          why: صحيح. يقرأ `npm install` ملف package.json وملف القفل ويثبّت Vite محليًا، وهو ما يستخدمه `npm run dev`.
        - text: يعيد تسمية `index.html` حتى يجده Vite.
          why: يجد Vite ملف index.html في جذر المشروع أصلًا. الأمر نفسه هو المفقود، لا ملف الدخول.
      answer: 2
    - q: |-
        يعرض Vite الرسالة «Adjacent JSX elements must be wrapped in an enclosing tag» لهذا الـ component. أيّ إصلاح صحيح؟
        ```jsx
        export default function App() {
          return (
            <h1>Watchlist</h1>
            <p>3 to watch</p>
          );
        }
        ```
      options:
        - text: غلّف العنصرين بـ fragment `<>…</>` أو بعنصر له معنى مثل `<header>`.
          why: صحيح. الـ component يُرجع جذرًا واحدًا، والـ fragment يجمع الإخوة من دون إضافة عقدة إلى الـ DOM.
        - text: احذف الأقواس حول الـ JSX.
          why: الأقواس تحمي جملة الـ return متعدّدة الأسطر فقط. ومن دونها لا تُرجع الدالة شيئًا مفيدًا.
        - text: ضع فاصلة بين العنصرين.
          why: الفاصلة تُنشئ comma expression في JavaScript لا يُرجع إلا العنصر الأخير، وهذا أيضًا ليس ما تريده.
        - text: قسّم الإرجاع إلى جملتي `return`.
          why: تتوقّف الدالة عند أول `return`، فلن يُعرض العنصر الثاني أبدًا.
      answer: 0
    - q: "قيمة `count` هي 0 وقيمة `watched` هي `true`. ما النص الذي يعرضه `<p>{count} {watched}</p>`؟"
      options:
        - text: '"0 true"'
          why: لا تعرض React القيم المنطقية كنص. والقيمة `true` لا تُنتج شيئًا.
        - text: لا شيء على الإطلاق، لأن القيمتين كلتيهما تُتخطّيان.
          why: القيم المنطقية تُتخطّى، لكن الأرقام تُعرض دائمًا، بما فيها 0.
        - text: خطأ، لأن القيم المنطقية ليست أبناء صالحة.
          why: القيم المنطقية أبناء صالحة؛ لكنها لا تعرض شيئًا، وهذا ما يجعل `&&` يعمل.
        - text: '"0" (تليها مسافة)، لأن الأرقام تُعرض والقيم المنطقية لا تعرض شيئًا.'
          why: صحيح. الـ 0 رقم فيظهر كنص؛ أمّا `true` فتُتجاهل.
      answer: 3
    - q: "يحتوي `src/components/MovieCard.jsx` على `export function MovieCard() { … }` ولا شيء غيره. أيّ استيراد يعمل في App.jsx؟"
      options:
        - text: '`import MovieCard from "./components/MovieCard.jsx";`'
          why: من دون أقواس معقوصة تطلب الـ default export، وهذا الملف لا يحتوي عليه، فتكون القيمة undefined.
        - text: '`import { MovieCard } from "./components/MovieCard.jsx";`'
          why: صحيح. الـ named export يُستورد باسمه داخل أقواس معقوصة.
        - text: '`import { MovieCard } from "MovieCard";`'
          why: المُعرِّف المجرّد مثل "MovieCard" يُبحث عنه في node_modules. ملفاتك الخاصة تحتاج إلى مسار نسبي.
        - text: '`import * from "./components/MovieCard.jsx";`'
          why: "هذه صياغة غير صحيحة. استيراد الـ namespace يحتاج إلى اسم، مثل `import * as Cards from …`."
      answer: 1
    - q: حذف زميل `<StrictMode>` من main.jsx لأن السجلات تُطبع مرتين أثناء التطوير. ما أفضل ردّ؟
      options:
        - text: أوافق، لأن StrictMode يجعل تطبيق الإنتاج أبطأ مرتين.
          why: لا تأثير لـ StrictMode على نسخ الإنتاج إطلاقًا.
        - text: أوافق، لأن StrictMode أصبح متوقّفًا (deprecated) في React 19.
          why: الـ StrictMode حالي وموصى به في React 19.
        - text: أبقِه؛ فالتشغيل المزدوج لا يحدث إلا في التطوير، وغايته كشف الـ render غير النقي ودوال التنظيف المفقودة مبكرًا.
          why: صحيح. السجلات الإضافية ثمن فحص يلتقط أخطاء حقيقية قبل أن يصادفها المستخدمون.
        - text: أبقِه، لكن غلّف كل component بـ StrictMode خاص به أيضًا.
          why: StrictMode واحد في الجذر يغطّي الشجرة كلها. وإضافة المزيد بالتداخل لا تضيف شيئًا.
      answer: 2
  s-rf-2:
    - q: 'يعرض `<MovieCard title="Arrival" watched="false" />` شارة «Watched»، والـ component يستخدم `{watched && <Badge />}`. لماذا؟'
      options:
        - text: علامات الاقتباس تمرّر النص "false"، وأي نص غير فارغ قيمته truthy. مرّر `watched={false}` بدلًا من ذلك.
          why: صحيح. لا يُمرَّر بين علامتي اقتباس إلا النصوص؛ أمّا القيم المنطقية والأرقام والكائنات فتحتاج إلى أقواس معقوصة.
        - text: الـ props المنطقية يجب أن تُكتب دائمًا كخاصية مجرّدة.
          why: الخاصية المجرّدة تعني `true`. ولتمرير false تكتب `watched={false}` أو تحذف الـ prop.
        - text: "المعامل `&&` لا يعمل مع الـ props."
          why: "يعمل `&&` مع أي قيمة. المشكلة في نوع القيمة التي مُرّرت."
        - text: القيمة الافتراضية في الـ component تتغلّب على الـ prop.
          why: لا تُطبَّق القيم الافتراضية إلا حين يكون الـ prop قيمته undefined. وهنا الـ prop هو النص "false".
      answer: 0
    - q: |-
        تُعرض القائمة، لكن الـ console يحذّر «Each child in a list should have a unique key prop». أين الخطأ؟
        ```jsx
        function MovieItem({ movie }) {
          return <li key={movie.id}>{movie.title}</li>;
        }

        {movies.map((movie) => <MovieItem movie={movie} />)}
        ```
      options:
        - text: "القيمة `movie.id` ليست فريدة بما يكفي؛ استخدم الـ index."
          why: المعرّفات سليمة. الـ key ببساطة في المكان الخطأ، والـ index سيزيد أخطاء إعادة الترتيب سوءًا.
        - text: الـ `<ul>` حول القائمة يحتاج إلى key.
          why: الـ `<ul>` عنصر واحد. العناصر التي تُرجعها `map` هي الإخوة الذين يجب على React التمييز بينهم.
        - text: الـ keys تعمل على عناصر HTML فقط، لا على الـ components.
          why: الـ keys تعمل على الـ components أيضًا؛ وهذا بالضبط مكان هذا الـ key.
        - text: يجب أن يوضع الـ key على `<MovieItem key={movie.id} … />` داخل `map`، لا على الـ `<li>` داخل الـ component.
          why: صحيح. تقرأ React الـ keys من العناصر في المصفوفة، وهي هنا عناصر MovieItem.
      answer: 3
    - q: تبني `Dialog` له عنوان، وأي محتوى في جسمه، وأزرار تختلف من استخدام لآخر. أيّ واجهة تُبقي Dialog بسيطًا ومرنًا؟
      options:
        - text: prop اسمه `buttons` فيه مصفوفة من نصوص التسميات، ويُنشئ Dialog الأزرار ومعالجات النقر الخاصة بها.
          why: سيحتاج Dialog إلى معرفة كل إجراء في التطبيق، وتكبر واجهته مع كل استخدام جديد.
        - text: "`title` كـ prop، والجسم كـ `children`، وprop اسمه `footer` يأخذ JSX مثل `footer={<button onClick={close}>Close</button>}`."
          why: صحيح. يملك Dialog الإطار ويحدّد مواضع الـ slots؛ والمستدعون يقرّرون ما يوضع فيها.
        - text: component Dialog خاص بكل استخدام، يُنسخ ويُعدَّل في كل مرة.
          why: النسخ تتباعد مع الوقت، وكل إصلاح في التنسيق يجب تكراره في كل نسخة.
        - text: مرّر الـ markup الكامل للنافذة كنص HTML.
          why: نصوص HTML تتجاوز الـ components والتهريب في React، وهي غير آمنة مع أي بيانات من المستخدم.
      answer: 1
    - q: 'لدى فيلم `genres: ["drama", "sci-fi"]`، ولا تتكرّر الأنواع داخل الفيلم الواحد. ما الـ key الجيد عند عرضها؟'
      options:
        - text: "`Math.random()`، حتى تكون الـ keys فريدة دائمًا."
          why: الـ key الجديد في كل render يجبر React على إعادة إنشاء كل عنصر في كل render.
        - text: الـ index، لأن القائمة قصيرة.
          why: القوائم القصيرة قد يتغيّر ترتيبها أيضًا. وحين توجد قيمة فريدة وثابتة، فضّلها.
        - text: نص النوع نفسه، لأنه فريد داخل القائمة وثابت.
          why: صحيح. لا يلزم أن تكون الـ keys إلا فريدة بين الإخوة وثابتة مع الوقت، والنص يحقّق الأمرين.
        - text: بلا key، لأن النصوص لا تحتاج إلى keys.
          why: كل عنصر تُرجعه `map` يحتاج إلى key، أيًّا كانت البيانات التي جاء منها.
      answer: 2
    - q: يجب أن يعرض الـ component المسمّى `MovieTitle` الـ prop المسمّى `title` بأحرف كبيرة. أيّ نسخة صحيحة؟
      options:
        - text: "`const upper = title.toUpperCase(); return <h2>{upper}</h2>;`"
          why: صحيح. اشتقّ قيمة جديدة من الـ prop أثناء الـ render واترك الـ prop نفسه كما هو.
        - text: "`props.title = props.title.toUpperCase(); return <h2>{props.title}</h2>;`"
          why: هذا يكتب في الـ props، وهي ملك للأب. وتجمّد React الـ props في وضع التطوير، فيرمي خطأ.
        - text: "`const [upper] = useState(title.toUpperCase());` ثم اعرض `upper`."
          why: لا يقرأ الـ state قيمته الابتدائية إلا مرة واحدة، فسيتجاهل العنوان التغييرات اللاحقة.
        - text: "`useEffect(() => setUpper(title.toUpperCase()), [title]);` ثم اعرض `upper`."
          why: effect مع state من أجل قيمة مشتقّة يضيف render إضافيًا بنص قديم. احسبها أثناء الـ render.
      answer: 0
  s-rf-3:
    - q: زر «+1 later» ينفّذ `setTimeout(() => setCount(count + 1), 1000)`. نقرته ثلاث مرات خلال ثانية واحدة، وكانت `count` تساوي 0. كم تصبح بعد انطلاق المؤقّتات؟
      options:
        - text: 3، لأن ثلاثة مؤقّتات عملت.
          why: كل مؤقّت احتفظ بقيمة `count` من الـ render الذي أُنشئ فيه، وكانت 0 في كل مرة.
        - text: 0، لأن الـ state لا يمكن ضبطه من مؤقّت.
          why: ضبط الـ state من مؤقّت لا بأس به؛ إنه يتحدّث فعلًا.
        - text: خطأ بسبب ضبط الـ state خارج معالج أحداث.
          why: تسمح React بتحديثات الـ state من المؤقّتات والـ promises والمعالجات على حدّ سواء.
        - text: 1، لأن كل مؤقّت حسب 0 + 1. استخدم `setCount((c) => c + 1)` لتحصل على 3.
          why: صحيح. دالة التحديث تستقبل أحدث قيمة بدل لقطة قديمة.
      answer: 3
    - q: "الدالة `handleRemove` تنفّذ `const i = movies.findIndex((m) => m.id === id); movies.splice(i, 1); setMovies(movies);`. لكن الفيلم لا يختفي. لماذا؟"
      options:
        - text: "تُرجع `findIndex` القيمة -1 لكل فيلم."
          why: إنها تجد الـ index بشكل صحيح. المشكلة تأتي بعد ذلك.
        - text: "غيّرت `splice` المصفوفة الموجودة في مكانها، وأُعيدت المصفوفة نفسها، فلم ترَ React أي تغيير."
          why: "صحيح. تقارن React باستخدام Object.is. أنشئ مصفوفة جديدة: `setMovies(movies.filter((m) => m.id !== id))`."
        - text: يجب أن تستدعي `setMovies` قبل تغيير المصفوفة.
          why: الترتيب لا يفيد. أي تعديل على المصفوفة الموجودة يترك React مع المرجع نفسه.
        - text: لا يمكن تخزين المصفوفات في الـ state.
          why: المصفوفات نوع طبيعي من الـ state؛ لكن يجب استبدالها، لا تعديلها.
      answer: 1
    - q: تنقر Add، فيظهر الفيلم الجديد للحظة، ثم يُعاد تحميل الصفحة ويختفي. ما الناقص؟
      options:
        - text: key على عنصر القائمة الجديد.
          why: غياب الـ key يسبّب تحذيرًا في الـ console، لا إعادة تحميل للصفحة.
        - text: "الـ `useEffect` لحفظ الفيلم."
          why: الحفظ قد يفيد بعد إعادة التحميل، لكن الخطأ الحقيقي أن الصفحة تُعاد تحميلها أصلًا.
        - text: "`e.preventDefault()` في بداية معالج الإرسال الخاص بالنموذج."
          why: صحيح. من دونها يُجري المتصفّح إرسالًا عاديًا للنموذج ويعيد تحميل الصفحة.
        - text: 'الخاصية `type="button"` على زر Add.'
          why: هذا يمنع الزر من إرسال النموذج كليًا، فلن يعمل Enter ولا معالج الإرسال بعد ذلك.
      answer: 2
    - q: |-
        هذا المؤقّت يعدّ بزيادة 2 كل ثانية أثناء التطوير. ما الإصلاح؟
        ```jsx
        useEffect(() => {
          setInterval(() => setSeconds((s) => s + 1), 1000);
        }, []);
        ```
      options:
        - text: "أرجِع دالة تنظيف: `const id = setInterval(…); return () => clearInterval(id);`"
          why: صحيح. يركّب StrictMode ثم ينظّف ثم يركّب من جديد؛ ومن دون دالة تنظيف يظل المؤقّت الأول يعمل بجانب الثاني.
        - text: احذف StrictMode حتى يعمل الـ effect مرة واحدة.
          why: هذا يُخفي الخطأ أثناء التطوير، لكن غياب دالة التنظيف سيظل يُسرّب مؤقّتًا كلما أُلغي تركيب الـ component.
        - text: أضف `seconds` إلى مصفوفة الاعتماديات.
          why: هذا سيعيد تشغيل الـ effect كل ثانية، ومع استمرار غياب دالة التنظيف، ستتراكم مؤقّتات أكثر.
        - text: استخدم `setSeconds(seconds + 1)` بدل دالة التحديث.
          why: دالة التحديث صحيحة هنا. السرعة المضاعفة سببها مؤقّتان يعملان في الوقت نفسه.
      answer: 0
    - q: "يحتفظ `SearchBox` بـ `query` في الـ state الخاص به. ويجب أن يعرض أخوه `MovieList` فقط الأفلام التي يحتوي عنوانها على نص البحث. ماذا تفعل؟"
      options:
        - text: اجعل SearchBox يكتب نص البحث في localStorage، واجعل MovieList يقرؤه في كل render.
          why: لن يعيد MovieList الـ render حين يتغيّر نص البحث، والتخزين أداة خاطئة لمشاركة الـ state.
        - text: امنح MovieList الـ state الخاص به `query`، وانسخه من SearchBox بـ effect.
          why: نسختان تُزامَنان بـ effect أبطأ وقد تختلفان. المالك الواحد أبسط.
        - text: اعرض MovieList داخل SearchBox حتى يستطيع قراءة الـ state.
          why: هذا يلوي بنية الواجهة حول البيانات ويكسر التخطيط.
        - text: انقل `query` إلى أبيهما المشترك، ومرّره إلى كليهما، ومرّر معالج تغيير إلى SearchBox.
          why: صحيح. رفع الـ state يمنحه مالكًا واحدًا، ويقرأ الأخوان القيمة نفسها.
      answer: 3
  s-rf-4:
    - q: بعد أول deploy لك على Vercel، الموقع فارغ والـ console يعرض 404 للملف `/src/main.jsx`. ما الخطأ؟
      options:
        - text: قدّم Vercel ملف `index.html` المصدري بدل نسخة البناء. تحقّق أن الإعداد المسبق لإطار العمل هو Vite وأن مجلد المخرجات هو `dist`.
          why: صحيح. ملف index.html في الجذر لا يعمل إلا عبر خادم التطوير في Vite. ما يجب تقديمه هو الملفات المبنية في dist/.
        - text: لم يُدعم React 19 على Vercel بعد.
          why: يقدّم Vercel ملفات ثابتة؛ ولا يهمّه أي إصدار من React بناها.
        - text: "يجب إعادة تسمية `main.jsx` إلى `main.js` للإنتاج."
          why: امتداد الملف ليس المشكلة. في البناء الصحيح يُترجم main.jsx إلى حزمة ولا يُطلب أبدًا.
        - text: يحتاج التطبيق إلى rewrite في `vercel.json` نحو `/src/main.jsx`.
          why: الإشارة إلى ملفات المصدر ستفشل أيضًا؛ فالمتصفّحات لا تستطيع تشغيل JSX.
      answer: 0
    - q: يجب أن يكون الزر بلون indigo حين تكون `active` قيمتها true. أيّ className يعمل بموثوقية مع Tailwind؟
      options:
        - text: '`` `bg-${active ? "indigo" : "slate"}-600` ``'
          why: لا يرى Tailwind أسماء الـ classes كاملة أبدًا، فلا تُولَّد أيٌّ من الخلفيتين.
        - text: '`active ? "bg-indigo-600 text-white" : "bg-slate-100"`'
          why: صحيح. اسما الـ classes الكاملان يظهران في المصدر، فيولّدهما Tailwind.
        - text: 'التعبير `"bg-" + color + "-600"` مع `color` قادمة من الـ props'
          why: "بناء الأسماء من قطع له المشكلة نفسها: الـ classes الكاملة لا تظهر أبدًا في المصدر."
        - text: '`style={{ className: "bg-indigo-600" }}`'
          why: "الـ `className` ليست خاصية CSS، فلا يضبط هذا أي شيء."
      answer: 1
    - q: في Watchlist المكتمل، أيّ قيمة يجب ألّا تُخزَّن في `useState`؟
      options:
        - text: مصفوفة الأفلام.
          why: تتغيّر الأفلام حين يضيفها المستخدم أو يبدّل حالتها أو يحذفها، فهي state حقيقي.
        - text: الفلتر المختار.
          why: يتغيّر الفلتر حين ينقر المستخدم زر فلترة، ولا يمكن حسابه من أي شيء آخر.
        - text: عدد الأفلام غير المُشاهَدة.
          why: صحيح. إنه مشتقّ من الأفلام أثناء الـ render، وتخزينه لا يُنشئ إلا نسخة قد تصبح قديمة.
        - text: النص المكتوب في نموذج الإضافة، داخل AddMovieForm.
          why: يتغيّر نص المسوّدة أثناء الكتابة ويعيش في النموذج. إنه state حقيقي.
