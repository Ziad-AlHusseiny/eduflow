  - q: يحمّل Watchlist الأفلام المحفوظة في `useEffect(() => setMovies(load()), [])` ويحفظها في effect آخر على `[movies]`. يبلّغ المستخدمون أن قائمتهم تُمسح أحيانًا عند إعادة التحميل. ما التصميم الأفضل؟
