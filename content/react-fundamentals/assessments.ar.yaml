        why: تستطيع المعالجات قراءة أي شيء من الـ render الخاص بها. إنها فقط تقرأ قيم ذلك الـ render.
      - text: الطول من الـ render الحالي، بناءً على الفلتر القديم.
        why: صحيح. كل render لقطة؛ والقيمة الجديدة تظهر في الـ render التالي.
