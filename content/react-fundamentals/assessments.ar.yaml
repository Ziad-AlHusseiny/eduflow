  - q: كُتب مربّع اختيار «Watched» بالشكل `<input type="checkbox" value={watched} onChange={(e) => setWatched(e.target.value)} />`. النقر عليه لا يُظهر علامة الاختيار أبدًا. ما الخطأ؟
    options:
      - text: لا يمكن التحكّم في مربّعات الاختيار في React.
        why: يمكن ذلك؛ لكنها تستخدم خاصية مختلفة.
      - text: يحتاج المعالج إلى `e.preventDefault()`.
        why: منع السلوك الافتراضي سيوقف تبديل مربّع الاختيار كليًا.
      - text: "يجب أن تكون `watched` نصًا."
        why: القيمة المنطقية هي النوع الصحيح لمربّع الاختيار. المشكلة في الخاصية التي تُقرأ وتُضبط.
      - text: مربّعات الاختيار تستخدم `checked` و`e.target.checked`، لا `value`.
        why: صحيح. الـ `value` هي النص الذي يُرسل مع النموذج؛ أمّا `checked` فهي حالة التشغيل والإيقاف.
