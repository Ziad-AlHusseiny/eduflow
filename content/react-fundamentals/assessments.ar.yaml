  - q: يزيد component متغيّرًا اسمه `renderCount` في مستوى الـ module داخل جسمه ويعرضه. الرقم مختلف بين التطوير والإنتاج. لماذا؟
    options:
      - text: يخزّن Vite الـ modules مؤقّتًا بطريقة مختلفة في الإنتاج.
        why: التخزين المؤقّت للـ modules لا يغيّر عدد المرات التي تستدعي فيها React الـ component.
      - text: "الـ component غير نقي: يرسمه StrictMode مرتين أثناء التطوير، فيُنفَّذ الأثر الجانبي مرتين."
        why: صحيح. يجب ألّا يغيّر الـ render أي شيء خارج الـ component. انقل الآثار الجانبية إلى المعالجات أو الـ effects.
      - text: نسخ الإنتاج تحذف المتغيّرات في مستوى الـ module.
        why: متغيّرات الـ module ما زالت موجودة في الإنتاج؛ عدد مرّات الـ render وحده هو المختلف.
      - text: يرسم React 19 كل component مرتين في الإنتاج.
        why: الإنتاج يرسم مرة واحدة. الرسم المزدوج فحص خاص بالتطوير فقط.
    answer: 1
  - q: أيّ تعبير يعرض النص «Watched» فقط حين تكون `movie.watched` قيمتها true، ولا شيء في غير ذلك؟
    options:
      - text: '`{movie.watched ? "Watched"}`'
        why: المعامل الثلاثي يحتاج إلى الفرعين كليهما؛ هذا خطأ في الصياغة.
      - text: '`{if (movie.watched) "Watched"}`'
        why: "الـ `if` جملة ولا يمكن وضعها داخل أقواس JSX المعقوصة."
      - text: '`{movie.watched && "Watched"}`'
        why: صحيح. حين تكون `watched` قيمتها false يصبح التعبير false، ولا تعرض React شيئًا مقابل false.
      - text: '`{movie.watched || "Watched"}`'
        why: 'المعامل `||` يُرجع "Watched" حين تكون watched قيمتها false، أي عكس ما تريده، ولا يعرض شيئًا مرئيًا حين تكون true.'
    answer: 2
  - q: تكتب في حقل داخل صف من قائمة، فيفقد التركيز بعد كل ضغطة مفتاح. والقائمة تستخدم `key={Math.random()}`. ما الذي يحدث؟
    options:
      - text: كل render ينتج keys جديدة، فتعامل React كل صف كأنه جديد، وتهدمه وتُنشئ حقلًا جديدًا.
        why: صحيح. يجب أن تكون الـ keys ثابتة. استخدم معرّفًا مخزّنًا مع كل عنصر.
      - text: لا يمكن التحكّم في الحقول داخل القوائم.
        why: الـ controlled inputs تعمل في القوائم. الـ key المتغيّر هو ما يعيد تركيب الصف.
      - text: "قد تنتج `Math.random()` keys مكرّرة."
        why: التكرار ممكن لكنه نادر. المشكلة الحقيقية أن الـ keys تتغيّر في كل render.
      - text: تضع React حدًّا لعدد مرّات إعادة render القائمة.
        why: لا يوجد حدّ كهذا. يُعاد إنشاء الصفوف لأن هويتها تتغيّر.
    answer: 0
  - q: داخل معالج نقرة تستدعي `setFilter("watched")` ثم `console.log(visible.length)`، حيث `visible` مشتقّة من `filter` أثناء الـ render. ماذا يُطبع؟
    options:
      - text: عدد الأفلام المُشاهَدة.
        why: الفلتر الجديد يُطبَّق في الـ render التالي. وهذا المعالج ما زال يرى `visible` القديمة.
      - text: 0، لأن الـ state يُعاد ضبطه أثناء التحديث.
        why: التحديث لا يعيد ضبط الـ state أبدًا؛ تبقى اللقطة القديمة سليمة حتى الـ render التالي.
