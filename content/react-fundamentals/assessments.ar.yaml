        why: العناصر العادية تعمل جيدًا في القوائم. الاستخراج خيار من أجل إعادة الاستخدام والوضوح.
      - text: يتيح للحالة الفارغة أن تتشارك الـ state مع عناصر الأفلام.
        why: الـ components لا تتشارك الـ state أبدًا لمجرّد استخدامها الغلاف نفسه؛ كل نسخة مستقلة.
